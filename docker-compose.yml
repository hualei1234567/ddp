services:
  postgres:
    image: postgres:16-alpine
    container_name: ddp-postgres
    environment:
      POSTGRES_USER: ${DDP_DB_USER:-ddp}
      POSTGRES_PASSWORD: ${DDP_DB_PASSWORD:-ddp}
      POSTGRES_DB: ${DDP_DB_NAME:-ddp}
    ports:
      # 笔记本 5432 已被系统 PostgreSQL 占用，DDP 使用 55432。
      - "55432:5432"
    volumes:
      - ddp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DDP_DB_USER:-ddp} -d ${DDP_DB_NAME:-ddp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ddp-redis
    ports:
      - "6379:6379"
    volumes:
      - ddp-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 阶段 0 使用 latest 以便在受限网络下拉取；阶段 1 固定 digest。
    image: minio/minio:latest
    container_name: ddp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DDP_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DDP_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ddp-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    # 阶段 0 使用 latest；阶段 1 固定 digest。
    image: minio/mc:latest
    container_name: ddp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${DDP_S3_ACCESS_KEY:-minioadmin} ${DDP_S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${DDP_S3_BUCKET:-ddp-raw} &&
      echo 'minio bucket ready'
      "
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-api
    env_file: .env
    environment:
      # 容器内必须用服务名，而不是宿主 .env 里的 localhost。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_REDIS_URL: redis://redis:6379/0
      DDP_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-worker
    command: ["python", "-m", "app.workers.outbox"]
    env_file: .env
    environment:
      # 与 API 相同：容器内使用服务名访问数据库、缓存与对象存储。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_REDIS_URL: redis://redis:6379/0
      DDP_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: ddp-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ddp-pgdata:
  ddp-redisdata:
  ddp-miniodata:
