services:
  postgres:
    image: postgres:16-alpine
    container_name: ddp-postgres
    environment:
      POSTGRES_USER: ${DDP_DB_USER:-ddp}
      POSTGRES_PASSWORD: ${DDP_DB_PASSWORD:-ddp}
      POSTGRES_DB: ${DDP_DB_NAME:-ddp}
    ports:
      # 笔记本 5432 已被系统 PostgreSQL 占用，DDP 使用 55432。
      - "55432:5432"
    volumes:
      - ddp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DDP_DB_USER:-ddp} -d ${DDP_DB_NAME:-ddp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # 分布式限流后端（DDP_RATE_LIMIT_BACKEND=redis，见 docs/adr/0031）。
    # 固定 tag + 多架构 index digest（禁止 latest，CLAUDE.md §三）：
    # 7.4.12 是 7.x 线当前稳定维护版本，digest 为 OCI image index。
    # 仅作限流计数使用：不挂持久卷（计数可丢，重启即清空），
    # 不开 AOF/RDB，避免为一份可重建的短期计数写盘。
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: ddp-redis
    command:
      # maxmemory-policy=allkeys-lru：限流键是唯一负载，内存吃紧时淘汰旧键，
      # 表现为"配额提前恢复"（宽松），不会误拒；绝不用 noeviction 触发写失败。
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 2026-11-14：上游 minio/minio 在 Docker Hub 已不可拉取（object not found），
    # 改用 Bitnami 归档命名空间的同一 MinIO 二进制（API/控制台端口一致）。
    # 固定版本 + digest（禁止 latest，CLAUDE.md §三）；2025.7.23 是归档中最后一批稳定构建。
    # 卷路径为 /bitnami/minio/data（Bitnami 布局）。原 ddp-miniodata 卷经核验为空，
    # 路径变更无数据损失，见 docs/operations/docker-compose-minio变更说明.md。
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: ddp-minio
    environment:
      MINIO_ROOT_USER: ${DDP_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DDP_S3_SECRET_KEY:-minioadmin}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
      MINIO_SKIP_CLIENT: "yes"
      MINIO_DEFAULT_BUCKETS: ${DDP_S3_BUCKET:-ddp-raw}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ddp-miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    # 数据库迁移。单独成一个服务而不是塞进 api 启动脚本，原因有二：
    # 1. api 可能起多个副本，启动脚本各自跑迁移会并发执行同一个 DDL；
    # 2. 迁移失败必须让 api 起不来，而不是 api 起来了但 schema 是旧的。
    #
    # 为什么必须有它：此前整条部署链路里**没有任何一处执行 alembic upgrade**。
    # 实测后果——v0.2.0 的镜像起来后数据库仍停在 0034，而代码要求 0040，
    # 于是新端点全部 500。这类缺陷在"本地一直用手动 alembic upgrade 的开发机"
    # 上完全看不出来，只有全新环境或自动化部署才会暴露。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-api
    env_file: .env
    environment:
      # 容器内必须用服务名，而不是宿主 .env 里的 localhost。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
      # 限流后端：容器内必须指向 redis 服务名；宿主的 localhost 在容器里不通。
      DDP_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-worker
    command: ["python", "-m", "app.workers.outbox"]
    env_file: .env
    environment:
      # 与 API 相同：容器内使用服务名访问数据库、缓存与对象存储。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  datasource-worker:
    # 数据源导入 Worker：消费 datasource.import_requested 事件，真实下载 HF 文件、
    # 校验内容签名与 sha256、存对象存储，并登记 RawAsset + MediaAsset。
    #
    # 此前 compose 里**没有这个服务**：导入任务建好后事件一直躺在 outbox 里，
    # 只能靠手工 `python -m app.workers.datasources --once` 驱动，等于线上主链断开。
    # 同时修掉两处让它起不来的依赖问题（本批一并处理）：
    # - api.Dockerfile 原先不复制 data-platform/，镜像内 `import ddp_data` 失败；
    # - httpx 原先只在 requirements-dev.txt，生产镜像装不到。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-datasource-worker
    command: ["python", "-m", "app.workers.datasources"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

  ingestion-job-worker:
    # 接入任务执行 Worker：消费 ingestion.job.created（投递类）。
    #
    # 此前该类事件是**留痕类**，于是 IngestionJob 有完整的状态机、重试与超时
    # 字段、7 个 API 动作，却没有任何进程去执行——任务建完永远停在 QUEUED。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-ingestion-job-worker
    command: ["python", "-m", "app.workers.ingestion_jobs"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  export-worker:
    # 导出 Job 常驻 Worker：消费 dataset.export.requested 事件并写入对象存储。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-export-worker
    command: ["python", "-m", "app.workers.exports"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  maintenance-worker:
    # 阶段 8：定时备份 + outbox 归档 + 幂等表清扫。
    # 默认不开（maintenance_enabled 由 .env 控制）；开启前必须先设 DDP_BACKUP_DIR
    # 并把该目录挂载为持久卷，否则备份会落在容器内临时层。
    #
    # 为什么是独立 profile 而不是 "app"：该 worker 在 maintenance_enabled=False
    # 时会立即退出，restart: unless-stopped 于是把它变成无限重启循环——
    # 日志每几秒刷一条 ERROR，容器状态永远在 Restarting，看起来像故障但其实是
    # 配置期望的行为。把它从默认里摘出去：需要备份时显式
    # `docker compose --profile maintenance up -d maintenance-worker`，
    # 并先在 .env 里设 DDP_MAINTENANCE_ENABLED=true。
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-maintenance-worker
    command: ["python", "-m", "app.workers.maintenance"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_BACKUP_DIR: /var/backups/ddp
    volumes:
      - ddp-backups:/var/backups/ddp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: ddp-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ddp-pgdata:
  ddp-miniodata:
  ddp-backups:
