services:
  postgres:
    image: postgres:16-alpine
    container_name: ddp-postgres
    environment:
      POSTGRES_USER: ${DDP_DB_USER:-ddp}
      POSTGRES_PASSWORD: ${DDP_DB_PASSWORD:-ddp}
      POSTGRES_DB: ${DDP_DB_NAME:-ddp}
    ports:
      # 笔记本 5432 已被系统 PostgreSQL 占用，DDP 使用 55432。
      - "55432:5432"
    volumes:
      - ddp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DDP_DB_USER:-ddp} -d ${DDP_DB_NAME:-ddp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # 分布式限流后端（DDP_RATE_LIMIT_BACKEND=redis，见 docs/adr/0031）。
    # 固定 tag + 多架构 index digest（禁止 latest，CLAUDE.md §三）：
    # 7.4.12 是 7.x 线当前稳定维护版本，digest 为 OCI image index。
    # 仅作限流计数使用：不挂持久卷（计数可丢，重启即清空），
    # 不开 AOF/RDB，避免为一份可重建的短期计数写盘。
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: ddp-redis
    command:
      # maxmemory-policy=allkeys-lru：限流键是唯一负载，内存吃紧时淘汰旧键，
      # 表现为"配额提前恢复"（宽松），不会误拒；绝不用 noeviction 触发写失败。
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 2026-11-14：上游 minio/minio 在 Docker Hub 已不可拉取（object not found），
    # 改用 Bitnami 归档命名空间的同一 MinIO 二进制（API/控制台端口一致）。
    # 固定版本 + digest（禁止 latest，CLAUDE.md §三）；2025.7.23 是归档中最后一批稳定构建。
    # 卷路径为 /bitnami/minio/data（Bitnami 布局）。原 ddp-miniodata 卷经核验为空，
    # 路径变更无数据损失，见 docs/operations/docker-compose-minio变更说明.md。
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: ddp-minio
    environment:
      MINIO_ROOT_USER: ${DDP_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DDP_S3_SECRET_KEY:-minioadmin}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
      MINIO_SKIP_CLIENT: "yes"
      MINIO_DEFAULT_BUCKETS: ${DDP_S3_BUCKET:-ddp-raw}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ddp-miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    # 数据库迁移。单独成一个服务而不是塞进 api 启动脚本，原因有二：
    # 1. api 可能起多个副本，启动脚本各自跑迁移会并发执行同一个 DDL；
    # 2. 迁移失败必须让 api 起不来，而不是 api 起来了但 schema 是旧的。
    #
    # 为什么必须有它：此前整条部署链路里**没有任何一处执行 alembic upgrade**。
    # 实测后果——v0.2.0 的镜像起来后数据库仍停在 0034，而代码要求 0040，
    # 于是新端点全部 500。这类缺陷在"本地一直用手动 alembic upgrade 的开发机"
    # 上完全看不出来，只有全新环境或自动化部署才会暴露。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-api
    env_file: .env
    environment:
      # 容器内必须用服务名，而不是宿主 .env 里的 localhost。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      # 写死容器内地址，**不要**插值 ${DDP_S3_ENDPOINT}：.env 里那一项是给
      # 宿主机脚本（种子、巡检、boto3 校验）用的 localhost:9000，一旦被插值
      # 进来，容器内的 S3 客户端就会去连 localhost，上传/校验/导出全部
      # 503 object_storage_unavailable。需要连外部 S3 时用 override 文件。
      DDP_S3_ENDPOINT: http://minio:9000
      # 限流后端：容器内必须指向 redis 服务名；宿主的 localhost 在容器里不通。
      DDP_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      # 训练 / 模型 Adapter 的真实 HTTP 网关（可选）。这里显式透传，是因为
      # `${VAR:-}` 才算"可被 CI / shell 环境注入"；不写这两行时只有 env_file
      # 生效。默认空串 = 未接线：对应 adapter 仍返回 503，行为与接线前一致
      # （空串由 Settings 解析为「未配置」，不会让启动自检失败）。
      DDP_TRAINING_ADAPTER_ENDPOINTS: ${DDP_TRAINING_ADAPTER_ENDPOINTS:-}
      DDP_TRAINING_ADAPTER_EXECUTION_MODES: ${DDP_TRAINING_ADAPTER_EXECUTION_MODES:-}
      DDP_MODEL_ADAPTER_ENDPOINTS: ${DDP_MODEL_ADAPTER_ENDPOINTS:-}
      # SSRF 守卫例外（默认 false）。本地 `local-adapter` 服务名落在私有网段，
      # 需要在 .env 中按出站面分别显式置 true 才放行；共享/生产环境必须保持 false。
      DDP_TRAINING_ADAPTER_ALLOW_PRIVATE: ${DDP_TRAINING_ADAPTER_ALLOW_PRIVATE:-false}
      DDP_MODEL_ADAPTER_ALLOW_PRIVATE: ${DDP_MODEL_ADAPTER_ALLOW_PRIVATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-worker
    command: ["python", "-m", "app.workers.outbox"]
    env_file: .env
    environment:
      # 与 API 相同：容器内使用服务名访问数据库、缓存与对象存储。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: http://minio:9000
      # Adapter 网关同样在 worker 侧生效：outbox 投递/重放路径可能触达
      # 训练与模型平台，配置口径必须与 api 一致，否则两侧行为不同。
      DDP_TRAINING_ADAPTER_ENDPOINTS: ${DDP_TRAINING_ADAPTER_ENDPOINTS:-}
      DDP_TRAINING_ADAPTER_EXECUTION_MODES: ${DDP_TRAINING_ADAPTER_EXECUTION_MODES:-}
      DDP_MODEL_ADAPTER_ENDPOINTS: ${DDP_MODEL_ADAPTER_ENDPOINTS:-}
      DDP_TRAINING_ADAPTER_ALLOW_PRIVATE: ${DDP_TRAINING_ADAPTER_ALLOW_PRIVATE:-false}
      DDP_MODEL_ADAPTER_ALLOW_PRIVATE: ${DDP_MODEL_ADAPTER_ALLOW_PRIVATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  datasource-worker:
    # 数据源导入 Worker：消费 datasource.import_requested 事件，真实下载 HF 文件、
    # 校验内容签名与 sha256、存对象存储，并登记 RawAsset + MediaAsset。
    #
    # 此前 compose 里**没有这个服务**：导入任务建好后事件一直躺在 outbox 里，
    # 只能靠手工 `python -m app.workers.datasources --once` 驱动，等于线上主链断开。
    # 同时修掉两处让它起不来的依赖问题（本批一并处理）：
    # - api.Dockerfile 原先不复制 data-platform/，镜像内 `import ddp_data` 失败；
    # - httpx 原先只在 requirements-dev.txt，生产镜像装不到。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-datasource-worker
    command: ["python", "-m", "app.workers.datasources"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

  ingestion-job-worker:
    # 接入任务执行 Worker：消费 ingestion.job.created（投递类）。
    #
    # 此前该类事件是**留痕类**，于是 IngestionJob 有完整的状态机、重试与超时
    # 字段、7 个 API 动作，却没有任何进程去执行——任务建完永远停在 QUEUED。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-ingestion-job-worker
    command: ["python", "-m", "app.workers.ingestion_jobs"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  export-worker:
    # 导出 Job 常驻 Worker：消费 dataset.export.requested 事件并写入对象存储。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-export-worker
    command: ["python", "-m", "app.workers.exports"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  domain-worker:
    # 领域巡检 Worker：标注租约过期 + 采集任务数据检查。
    #
    # 这两件事此前都只有能力没有触发点：分配租约过期没人调度（领了活不干也
    # 永远占容量），采集任务提交后没有任何组件推进到 DATA_CHECKING（验收/
    # 完成按钮永远不出现）。它们是业务主流程的一部分，必须常开，所以放在
    # app profile 而不是默认关闭的 maintenance profile。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-domain-worker
    command: ["python", "-m", "app.workers.domain_sweeps", "--interval-seconds", "30"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  usage-snapshot-worker:
    # 用量快照 Worker：把每个项目的核心资源用量定时聚合进 usage_snapshots，
    # 供 `GET /projects/{id}/usage-report`（经营报表 / 分析页）读取。
    #
    # 此前它只在代码里存在：compose 没有部署，快照表永远是空的，报表所有
    # 指标都是 UNMEASURED（used=null）——界面上整页「—」，等于没有能力。
    # 报表是业务主流程的一部分，放在 app profile 常开；间隔与代码默认一致。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-usage-snapshot-worker
    command: ["python", "-m", "app.workers.usage_snapshots", "--interval-seconds", "300"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  maintenance-worker:
    # 阶段 8：定时备份 + outbox 归档 + 幂等表清扫。
    # 默认不开；开启前必须同时具备 DDP_MAINTENANCE_ENABLED=true 与
    # DDP_BACKUP_DIR，并把该目录挂载为持久卷，否则备份会落在容器内临时层。
    #
    # 为什么是独立 profile 而不是 "app"：该 worker 在 maintenance_enabled=False
    # 时会立即退出，restart: unless-stopped 于是把它变成无限重启循环——
    # 日志每几秒刷一条 ERROR，容器状态永远在 Restarting，看起来像故障但其实是
    # 配置期望的行为。把它从默认里摘出去：需要备份时显式
    # `docker compose --profile maintenance up -d maintenance-worker`。
    #
    # 为什么开关写在这里而不是 .env：`.env` 会被**所有**服务通过 env_file 加载，
    # 而 `Settings.validate_runtime_security()` 要求「启用维护就必须有备份目录」。
    # 把开关放进 .env 会让 api / web / 各 worker 一起读到 enabled=true 却没有
    # DDP_BACKUP_DIR，于是**整个 stack 拒绝启动**——实测报错
    # `RuntimeError: 安全配置不完整，拒绝启动：启用 DDP_MAINTENANCE_ENABLED 时
    # 必须设置 DDP_BACKUP_DIR`。开关是这一个 worker 的部署参数，就近声明。
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-maintenance-worker
    command: ["python", "-m", "app.workers.maintenance"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_BACKUP_DIR: /var/backups/ddp
      # 只在这个容器里打开维护任务；见上方注释。
      DDP_MAINTENANCE_ENABLED: "true"
    volumes:
      - ddp-backups:/var/backups/ddp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  local-adapter:
    # 真实执行的本地训练/推理/评测 Adapter（CPU 参考实现）。
    # 它只负责「被 DDP 调用 + 回 HMAC 回调」；DDP 侧需通过
    # DDP_TRAINING_ADAPTER_ENDPOINTS / DDP_MODEL_ADAPTER_ENDPOINTS 指向本服务。
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/local-adapter/Dockerfile
    container_name: ddp-local-adapter
    # 刻意不用 env_file: .env：该服务只需要对象存储与自身 adapter 配置，
    # 不应拿到 DDP 的数据库/JWT 等无关凭据。
    environment:
      # 容器内必须用服务名；宿主机 .env 里的 localhost 在容器里不通。
      DDP_API_BASE_URL: http://api:8000
      DDP_S3_ENDPOINT: http://minio:9000
      DDP_S3_ACCESS_KEY: ${DDP_S3_ACCESS_KEY:-minioadmin}
      DDP_S3_SECRET_KEY: ${DDP_S3_SECRET_KEY:-minioadmin}
      DDP_S3_BUCKET: ${DDP_S3_BUCKET:-ddp-raw}
      DDP_S3_REGION: ${DDP_S3_REGION:-us-east-1}
      LOCAL_ADAPTER_PUBLIC_BASE_URL: ${LOCAL_ADAPTER_PUBLIC_BASE_URL:-http://localhost:9100}
      LOCAL_ADAPTER_TRAINING_ADAPTER_ID: ${LOCAL_ADAPTER_TRAINING_ADAPTER_ID:-local-training}
      LOCAL_ADAPTER_TRAINING_ADAPTER_VERSION: ${LOCAL_ADAPTER_TRAINING_ADAPTER_VERSION:-1.0.0}
      LOCAL_ADAPTER_MODEL_ADAPTER_ID: ${LOCAL_ADAPTER_MODEL_ADAPTER_ID:-local-model}
      LOCAL_ADAPTER_MODEL_ADAPTER_VERSION: ${LOCAL_ADAPTER_MODEL_ADAPTER_VERSION:-1.0.0}
      # 默认值与 .env.example 中 DDP_*_ADAPTER_SHARED_SECRETS 保持一致；
      # 正式环境必须由 Secret 注入覆盖，禁止沿用本地默认值。
      LOCAL_ADAPTER_TRAINING_SECRET: ${LOCAL_ADAPTER_TRAINING_SECRET:-local-training-dev-secret-0123456789abcdef}
      LOCAL_ADAPTER_MODEL_SECRET: ${LOCAL_ADAPTER_MODEL_SECRET:-local-model-dev-secret-0123456789abcdef}
      LOCAL_ADAPTER_FFMPEG_PATH: /usr/bin/ffmpeg
      LOCAL_ADAPTER_FFPROBE_PATH: /usr/bin/ffprobe
    ports:
      - "${DDP_LOCAL_ADAPTER_PORT:-9100}:9100"
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: ddp-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # 本地开发令牌（形如 "Bearer eyJ..."）。浏览器端没有登录流程，靠它给
      # /api 请求补上身份；留空则什么都不注入，需要在前端「设置令牌」手动粘贴。
      # 只用于本机开发栈：令牌会出现在 nginx 配置里，不要用于任何共享环境。
      DDP_WEB_DEV_AUTH: ${DDP_WEB_DEV_AUTH:-}
    ports:
      # 宿主端口可配置。默认 8088 而不是 8080：8080 太容易被本机其他服务占用
      # （实测本机被一个监听在 CGNAT 地址上的进程占着，Docker 的端口转发因此
      # 静默失效——`docker port` 显示映射存在，实际连接被拒，容器内 nginx 却是
      # 正常的）。这类故障排查成本高，换一个不常撞车的默认值更划算。
      - "${DDP_WEB_PORT:-8088}:80"

volumes:
  ddp-pgdata:
  ddp-miniodata:
  ddp-backups:
