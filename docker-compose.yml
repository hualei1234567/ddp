services:
  postgres:
    image: postgres:16-alpine
    container_name: ddp-postgres
    environment:
      POSTGRES_USER: ${DDP_DB_USER:-ddp}
      POSTGRES_PASSWORD: ${DDP_DB_PASSWORD:-ddp}
      POSTGRES_DB: ${DDP_DB_NAME:-ddp}
    ports:
      - "5432:5432"
    volumes:
      - ddp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DDP_DB_USER:-ddp} -d ${DDP_DB_NAME:-ddp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ddp-redis
    ports:
      - "6379:6379"
    volumes:
      - ddp-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: ddp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DDP_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DDP_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ddp-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: ddp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${DDP_S3_ACCESS_KEY:-minioadmin} ${DDP_S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${DDP_S3_BUCKET:-ddp-raw} &&
      echo 'minio bucket ready'
      "
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: ddp-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ddp-pgdata:
  ddp-redisdata:
  ddp-miniodata:
