services:
  postgres:
    image: postgres:16-alpine
    container_name: ddp-postgres
    environment:
      POSTGRES_USER: ${DDP_DB_USER:-ddp}
      POSTGRES_PASSWORD: ${DDP_DB_PASSWORD:-ddp}
      POSTGRES_DB: ${DDP_DB_NAME:-ddp}
    ports:
      # 笔记本 5432 已被系统 PostgreSQL 占用，DDP 使用 55432。
      - "55432:5432"
    volumes:
      - ddp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DDP_DB_USER:-ddp} -d ${DDP_DB_NAME:-ddp}"]
      interval: 5s
      timeout: 3s
      retries: 20

# redis 已在阶段 8 移除：requirements.txt 无 redis 依赖、代码零 import，
# rate_limit_backend 也只有 memory 一种实现（见 app/core/config.py）。
# 保留一个空转容器只会扩大攻击面并误导"系统用了 Redis"。

  minio:
    # 2026-11-14：上游 minio/minio 在 Docker Hub 已不可拉取（object not found），
    # 改用 Bitnami 归档命名空间的同一 MinIO 二进制（API/控制台端口一致）。
    # 固定版本 + digest（禁止 latest，CLAUDE.md §三）；2025.7.23 是归档中最后一批稳定构建。
    # 卷路径为 /bitnami/minio/data（Bitnami 布局）。原 ddp-miniodata 卷经核验为空，
    # 路径变更无数据损失，见 docs/operations/docker-compose-minio变更说明.md。
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: ddp-minio
    environment:
      MINIO_ROOT_USER: ${DDP_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DDP_S3_SECRET_KEY:-minioadmin}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
      MINIO_SKIP_CLIENT: "yes"
      MINIO_DEFAULT_BUCKETS: ${DDP_S3_BUCKET:-ddp-raw}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ddp-miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-api
    env_file: .env
    environment:
      # 容器内必须用服务名，而不是宿主 .env 里的 localhost。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-worker
    command: ["python", "-m", "app.workers.outbox"]
    env_file: .env
    environment:
      # 与 API 相同：容器内使用服务名访问数据库、缓存与对象存储。
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  export-worker:
    # 导出 Job 常驻 Worker：消费 dataset.export.requested 事件并写入对象存储。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-export-worker
    command: ["python", "-m", "app.workers.exports"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_S3_ENDPOINT: ${DDP_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  maintenance-worker:
    # 阶段 8：定时备份 + outbox 归档 + 幂等表清扫。
    # 默认不开（maintenance_enabled 由 .env 控制）；开启前必须先设 DDP_BACKUP_DIR
    # 并把该目录挂载为持久卷，否则备份会落在容器内临时层。
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ddp-maintenance-worker
    command: ["python", "-m", "app.workers.maintenance"]
    env_file: .env
    environment:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@postgres:5432/ddp
      DDP_BACKUP_DIR: /var/backups/ddp
    volumes:
      - ddp-backups:/var/backups/ddp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: ddp-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ddp-pgdata:
  ddp-miniodata:
  ddp-backups:
