# Cloudflare Pages 配置声明（前端静态托管：https://www.ddp.online）
# 在 Cloudflare Pages 控制台连接 Git 仓库时：
#   Root directory:         apps/web
#   Build command:          npm run build
#   Build output directory: dist
#   Production 环境变量:
