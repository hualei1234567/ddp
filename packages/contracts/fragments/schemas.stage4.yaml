  properties:
    items: { type: array, items: { $ref: "../schemas/leakage-policy.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

DatasetGrantPage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "../schemas/dataset-grant.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

ExportJobPage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "../schemas/export-job.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

TrainingRequestPage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "../schemas/training-request.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

TrainingRequestRevisionPage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "../schemas/training-request-revision.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

TrainingDeliveryPage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "../schemas/training-delivery.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

ExternalTrainingReferencePage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "../schemas/external-training-reference.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

QualityPolicyCreate:
  type: object
  additionalProperties: false
  properties:
    name: { type: [string, "null"], maxLength: 200 }
    min_selected_count: { type: integer, minimum: 1, default: 1 }
    allow_warn_quality: { type: boolean, default: false }
    require_leakage_pass: { type: boolean, default: false }

QualityPolicyPage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "../schemas/quality-policy.v1.schema.json" } }
    next_cursor: { type: [string, "null"] }

ExportArtifactDownload:
  type: object
  required: [path, sha256, size_bytes, download_url, download_url_expires_at]
  additionalProperties: false
  properties:
    path: { type: string, minLength: 1, maxLength: 1024 }
