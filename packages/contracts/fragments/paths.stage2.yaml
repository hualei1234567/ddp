      "428": {$ref: "../openapi.yaml#/components/responses/PreconditionRequired"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
uploadSessions:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  post:
    operationId: createUploadSession
    tags: [uploads]
    summary: 创建上传会话
    parameters: [{$ref: "../openapi.yaml#/components/parameters/IdempotencyKey"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadSessionCreate"}}}}
    responses:
      "201": {description: 会话已创建, headers: {ETag: {schema: {type: string}}, Idempotent-Replayed: {schema: {type: string, enum: ["true", "false"]}}}, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadSession"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "413": {$ref: "../openapi.yaml#/components/responses/PayloadTooLarge"}
      "415": {$ref: "../openapi.yaml#/components/responses/UnsupportedMediaType"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
uploadSessionDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/UploadSessionId"
  get:
    operationId: getUploadSession
    tags: [uploads]
    summary: 断点状态与已确认分片
    responses:
      "200": {description: 会话状态, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadSession"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "410": {$ref: "../openapi.yaml#/components/responses/Gone"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
      "503": {$ref: "../openapi.yaml#/components/responses/ServiceUnavailable"}
uploadParts:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/UploadSessionId"
  get:
    operationId: listUploadParts
    tags: [uploads]
    summary: 已确认分片列表与缺失分片
    responses:
      "200": {description: 分片列表, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadPartList"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "410": {$ref: "../openapi.yaml#/components/responses/Gone"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
      "503": {$ref: "../openapi.yaml#/components/responses/ServiceUnavailable"}
uploadPartUrl:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/UploadSessionId"
    - $ref: "../openapi.yaml#/components/parameters/PartNumber"
  post:
    operationId: createUploadPartUrl
    tags: [uploads]
    summary: 获取分片预签名 URL（可绑定可选 sha256）
    requestBody: {required: false, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadPartUrlRequest"}}}}
    responses:
      "200": {description: 分片上传 URL 与必填头, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadPartUrlResponse"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "410": {$ref: "../openapi.yaml#/components/responses/Gone"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
uploadPartAck:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/UploadSessionId"
    - $ref: "../openapi.yaml#/components/parameters/PartNumber"
  post:
    operationId: ackUploadPart
    tags: [uploads]
    summary: 确认分片（ETag/大小/SHA256，同内容幂等）
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadPartAckRequest"}}}}
    responses:
      "200": {description: 分片已确认, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadPartAckResponse"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "410": {$ref: "../openapi.yaml#/components/responses/Gone"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
uploadComplete:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/UploadSessionId"
  post:
    operationId: completeUploadSession
    tags: [uploads]
    summary: 完成上传并登记/命中 RawAsset（异步校验，返回 uploaded_parts）
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CompleteUploadRequest"}}}}
    responses:
      "202": {description: 完成已受理，等待 VALIDATE Job, headers: {ETag: {schema: {type: string}}, Idempotent-Replayed: {schema: {type: string, enum: ["true", "false"]}}}, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CompleteUploadResponse"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "410": {$ref: "../openapi.yaml#/components/responses/Gone"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "428": {$ref: "../openapi.yaml#/components/responses/PreconditionRequired"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
      "503": {$ref: "../openapi.yaml#/components/responses/ServiceUnavailable"}
uploadAbort:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/UploadSessionId"
  post:
    operationId: abortUploadSession
    tags: [uploads]
    summary: 中止上传会话（终态重复调用返回原状态）
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody: {required: false, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/AbortUploadRequest"}}}}
    responses:
      "200": {description: 会话已中止或原状态返回, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/UploadSession"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "410": {$ref: "../openapi.yaml#/components/responses/Gone"}
      "428": {$ref: "../openapi.yaml#/components/responses/PreconditionRequired"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
