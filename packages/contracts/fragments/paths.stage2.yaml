    responses:
      "200": {description: 动作后的批次, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionBatch"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
