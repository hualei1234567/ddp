collectionTasks:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listCollectionTasks
    tags: [collection]
    summary: 采集任务列表（游标分页）
    parameters:
      - {name: status, in: query, required: false, schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTaskStatus"}}
      - {name: assigned_to, in: query, required: false, schema: {type: string, format: uuid}}
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200": {description: 任务分页, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTaskPage"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
  post:
    operationId: createCollectionTask
    tags: [collection]
    summary: 创建采集任务（初始 DRAFT）
    parameters: [{$ref: "../openapi.yaml#/components/parameters/IdempotencyKey"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTaskCreate"}}}}
    responses:
      "201": {description: 任务已创建, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTask"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
collectionTaskDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/TaskId"
  get:
    operationId: getCollectionTask
    tags: [collection]
    summary: 任务详情
    responses:
      "200": {description: 任务详情, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTask"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
  patch:
    operationId: updateCollectionTask
    tags: [collection]
    summary: 修改任务（仅 DRAFT 核心字段）
    parameters: [{$ref: "../openapi.yaml#/components/parameters/IfMatch"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTaskPatch"}}}}
    responses:
      "200": {description: 修改后的任务, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTask"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "428": {$ref: "../openapi.yaml#/components/responses/PreconditionRequired"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
collectionTaskActions:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/TaskId"
    - $ref: "../openapi.yaml#/components/parameters/TaskAction"
  post:
    operationId: actOnCollectionTask
    tags: [collection]
    summary: 任务状态动作（白名单）
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody: {required: false, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTaskActionRequest"}}}}
    responses:
      "200": {description: 动作后的任务, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CollectionTask"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "428": {$ref: "../openapi.yaml#/components/responses/PreconditionRequired"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
