adapterCallback:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/AdapterId"
  post:
    operationId: receiveTrainingAdapterCallback
    tags: [training-adapters]
    summary: Adapter 回调（HMAC-SHA256 + 时间窗 + nonce 防重放；幂等）
    security:
      - adapterHmac: []
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/CallbackSignature"
      - $ref: "../openapi.yaml#/components/parameters/CallbackTimestamp"
      - $ref: "../openapi.yaml#/components/parameters/CallbackNonce"
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AdapterCallbackPayload" }
    responses:
      "204":
        description: 回调已接受（重复回调幂等，不重复更新）
      "400": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

