# 阶段 4 数据集与训练域路径片段。
# 仅声明 backend/app/api/v1/{dataset*,export*,training*,adapter_callback}_routes.py 实际实现的端点；
# 草案中的 asset-catalog、Dataset/TrainingRequest 血缘与 DatasetVersion PATCH 尚未实现，不进入快照。
# 由 openapi.yaml 通过 $ref 解析；引用回入口文件以复用公共参数与响应。

datasets:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listDatasets
    tags: [datasets]
    summary: Dataset 列表
    parameters:
      - name: status
        in: query
        schema: { $ref: "../openapi.yaml#/components/schemas/DatasetStatus" }
      - name: purpose
        in: query
        schema: { $ref: "../openapi.yaml#/components/schemas/DatasetPurpose" }
      - name: usage_policy
        in: query
        schema: { $ref: "../openapi.yaml#/components/schemas/DatasetUsagePolicy" }
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Stage4Limit"
    responses:
      "200":
        description: Dataset 分页
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DatasetPage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    operationId: createDataset
    tags: [datasets]
    summary: 创建 Dataset（DRAFT）
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/DatasetCreate" }
    responses:
      "201":
        description: Dataset 已创建
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Dataset" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

datasetDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/DatasetId"
  get:
    operationId: getDataset
    tags: [datasets]
    summary: Dataset 详情
    responses:
      "200":
        description: Dataset 详情
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Dataset" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  patch:
    operationId: updateDataset
    tags: [datasets]
    summary: 修改 Dataset 非样本字段（ARCHIVED 不可编辑）
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/DatasetPatch" }
    responses:
      "200":
        description: 修改后的 Dataset
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Dataset" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "428": { $ref: "../openapi.yaml#/components/responses/PreconditionRequired" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

datasetActions:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/DatasetId"
    - $ref: "../openapi.yaml#/components/parameters/DatasetAction"
  post:
    operationId: actOnDataset
    tags: [datasets]
    summary: Dataset 状态动作（archive/restore；restore 需 PO 审批并审计）
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/DatasetActionRequest" }
    responses:
      "200":
        description: 动作后的 Dataset
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Dataset" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "428": { $ref: "../openapi.yaml#/components/responses/PreconditionRequired" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

