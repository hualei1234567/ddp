# V52-010 Token 成本台账 schema 片段（蓝图 N6）。
#
# 金额字段统一 `type: string`（十进制、4 位小数）：货币值经 JSON 双精度
# 会丢精度（MEM-INC-008 同族问题），前端类型定义也必须用 string。
# `cost_estimate: null` 表示"未配置价格"，不是 0（0 = 免费）。

TokenCostLedgerEntry:
  type: object
  required:
    - model_id
    - purpose
    - call_count
    - input_tokens
    - output_tokens
    - total_tokens
    - cost_estimate
    - cost_estimated_tokens
  properties:
    model_id:
      type: string
      description: 模型 ID（成本归属键，与 AI 建议的 model_id 同源）
    purpose:
      type: string
      enum: [PRE_LABEL, LLM_JUDGE, EMBED]
      description: 计量用途
    call_count:
      type: integer
      minimum: 0
      description: 该桶的 LLM 调用次数
    input_tokens:
      type: integer
      minimum: 0
      description: 输入 token 合计
    output_tokens:
      type: integer
      minimum: 0
      description: 输出 token 合计
    total_tokens:
      type: integer
      minimum: 0
      description: 输入 + 输出 token 合计
    cost_estimate:
      type: [string, "null"]
      description: 成本合计（USD 十进制字符串，4 位小数）；null = 未配置价格（不是 0）
    cost_estimated_tokens:
      type: integer
      minimum: 0
      description: 有价可算部分的 token 数；未配价模型的 tokens 不计入

TokenCostLedger:
  type: object
  required:
    - project_id
    - entries
    - total_cost_estimate
    - generated_at
  properties:
    project_id:
      type: string
      format: uuid
      description: 项目 ID
    entries:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/TokenCostLedgerEntry"
      description: 按 (model_id, purpose) 聚合的条目（确定性排序）
    total_cost_estimate:
      type: [string, "null"]
      description: 全项目有价部分成本合计（USD 十进制字符串）；全未配价时为 null（不是 0）
    generated_at:
      type: string
      format: date-time
      description: 快照生成时间（UTC，带时区）

# --- 评测失败案例回流（V52-030，蓝图 N5 / G5） ---
AnnotationBackflowIngest:
  type: object
  required: [cases]
  properties:
    cases:
      type: array
      minItems: 1
      maxItems: 200
      description: 案例数组；每条必含 source / case_ref / capability
      items:
        type: object
        required: [source, case_ref, capability]
        properties:
          source: { type: string, minLength: 1, maxLength: 120, description: 来源系统标识 }
          case_ref: { type: string, minLength: 1, maxLength: 200, description: 来源系统内案例唯一键 }
          capability: { type: string, minLength: 1, maxLength: 120, description: 失败所属能力维度 }
          failure_summary: { type: string, maxLength: 1000, description: 失败摘要（可选） }
          failure_count: { type: integer, minimum: 1, default: 1, description: 该案例累计失败次数（影响优先级） }
          suggested_priority:
            type: string
            enum: [P0, P1, P2, P3]
            description: 显式优先级（可选；缺省按 capability + failure_count 映射）
          payload:
            type: object
            additionalProperties: true
            description: 评测平台原始报告片段（平台只存储不解释）
    limit:
      type: integer
      minimum: 1
      maximum: 10000
      default: 200
      description: 单 source 每小时受理上限（超出判 RATE_LIMITED）
    conversion:
      type: object
      required: [sample_set_id, schema_id]
      description: 可选：受理后立即转任务的目标配置
      properties:
        sample_set_id: { type: string, format: uuid, description: 目标样本集 ID }
        schema_id: { type: string, format: uuid, description: 标注 Schema ID }

AnnotationBackflowDecision:
  type: object
  required: [source, case_ref, capability, decision, reason, suggested_priority]
  properties:
    source: { type: string }
    case_ref: { type: string }
    capability: { type: string }
    decision:
      type: string
      enum: [CREATE_TASK, DUPLICATE_SKIPPED, RATE_LIMITED]
      description: 单条案例的判定
    reason: { type: string, description: 判定原因（审计可追溯） }
    suggested_priority: { type: string, enum: [P0, P1, P2, P3] }

AnnotationBackflowIngestResult:
  type: object
  required: [accepted, duplicated, rate_limited, decisions]
  properties:
    accepted: { type: integer, minimum: 0, description: 受理（将转任务）的案例数 }
    duplicated: { type: integer, minimum: 0, description: 重复跳过的案例数 }
    rate_limited: { type: integer, minimum: 0, description: 超限拒绝的案例数 }
    task_id:
      type: [string, "null"]
      format: uuid
      description: 转换成功时的任务 ID；未配置转换目标时为 null
    decisions:
      type: array
      items: { $ref: "#/AnnotationBackflowDecision" }

AnnotationBackflowCase:
  type: object
  required: [case_id, source, case_ref, capability, status, suggested_priority, received_at]
  properties:
    case_id: { type: string, format: uuid }
    source: { type: string }
    case_ref: { type: string }
    capability: { type: string }
    status:
      type: string
      enum: [RECEIVED, CONVERTED, SKIPPED_DUPLICATE, RATE_LIMITED]
    suggested_priority: { type: string, enum: [P0, P1, P2, P3] }
    failure_summary: { type: [string, "null"] }
    task_id: { type: [string, "null"], format: uuid }
    received_at: { type: string, format: date-time }

AnnotationBackflowCasePage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "#/AnnotationBackflowCase" }
# V52-008 黄金题熔断接线（蓝图 N3 阶段 3）：解除暂停的响应快照。
HoneypotResumeResult:
  type: object
  required:
    - annotator_id
    - state
    - resumed
    - checked_at
  properties:
    annotator_id:
      type: string
      format: uuid
      description: 标注员 ID
    state:
      type: string
      enum: [NORMAL, PAUSED]
      description: 解除后的熔断状态（PAUSED 仅在开关关闭且从未写行时不可能出现；本端点只把 PAUSED 变 NORMAL）
    resumed:
      type: boolean
      description: 本次调用是否实际发生了 NORMAL 化；false = 开关关闭 / 无状态行 / 本就 NORMAL（幂等，不是失败）
    checked_at:
      type: string
      format: date-time
      description: 状态快照时间（UTC，带时区）

# V52-031 G6 语义近似去重：能力状态、查询与结果。
AnnotationDedupBackendStatus:
  type: object
  required: [backend, available]
  description: 单个去重后端的可用性
  properties:
    backend:
      type: string
      enum: [TRIGRAM, VECTOR]
      description: 后端标识
    available:
      type: boolean
      description: 当前部署下该后端是否真实可用（VECTOR 恒为 false：仅接口预留）
    reason:
      type: [string, "null"]
      description: 不可用原因；available=true 时为 null
AnnotationDedupStatus:
  type: object
  required: [engine, backend, threshold, candidate_limit, backends]
  description: 语义近似去重能力状态
  properties:
    engine:
      type: string
      enum: [postgresql, sqlite]
      description: 当前数据库方言（决定走 pg_trgm 索引还是 Python 兜底）
    backend:
      type: string
      enum: [TRIGRAM, VECTOR]
      description: 当前生效后端（生产为 TRIGRAM；VECTOR 仅接口预留）
    threshold:
      type: number
      minimum: 0
      maximum: 1
      description: 默认命中阈值（score >= threshold 命中）
    candidate_limit:
      type: integer
      minimum: 1
      description: 默认候选窗口（有界召回，禁止全表扫描）
    backends:
      type: array
      description: 全部后端的可用性（TRIGRAM / VECTOR）
      items: { $ref: "#/AnnotationDedupBackendStatus" }
AnnotationDedupQuery:
  type: object
  required: [text]
  description: 近似重复查询请求（只读）
  properties:
    text:
      type: string
      minLength: 1
      maxLength: 2000
      description: 待查文本（与样本文本上限同口径）
    threshold:
      type: number
      minimum: 0
      maximum: 1
      default: 0.85
      description: 命中阈值（score >= threshold 命中）
    limit:
      type: integer
      minimum: 1
      maximum: 500
      default: 200
      description: 参与比较的候选窗口上限（有界召回）
AnnotationDedupCandidate:
  type: object
  required: [text_digest, text, score]
  description: 一条近似重复候选
  properties:
    text_digest:
      type: string
      description: 候选文本的 sha256 指纹（sha256:<64 hex>）
    text:
      type: string
      description: 候选文本（规范化后）
    score:
      type: number
      minimum: 0
      maximum: 1
      description: 与查询文本的 trigram 相似度（6 位小数）
    episode_id:
      type: [string, "null"]
      format: uuid
      description: 候选样本载体（Episode）ID
AnnotationDedupResult:
  type: object
  required: [text_digest, backend, threshold, scanned, candidate_count, candidates]
  description: 一次近似重复查询的结论（只读，不落库）
  properties:
    text_digest:
      type: string
      description: 查询文本的 sha256 指纹（sha256:<64 hex>）
    backend:
      type: string
      enum: [TRIGRAM, VECTOR]
      description: 实际使用的后端（生产为 TRIGRAM）
    threshold:
      type: number
      minimum: 0
      maximum: 1
      description: 本次生效阈值
    scanned:
      type: integer
      minimum: 0
      description: 实际参与比较的候选条数（有界窗口内）
    candidate_count:
      type: integer
      minimum: 0
      description: 命中条数
    candidates:
      type: array
      description: 命中的近似重复候选（按分数降序）
      items: { $ref: "#/AnnotationDedupCandidate" }

# --- 数据集版本对比（阶段 5） ---
StatDiff:
  type: object
  required: [baseline, candidate, changed]
  properties:
    baseline: { type: integer, description: 基线版本取值 }
    candidate: { type: integer, description: 候选版本取值 }
    changed: { type: boolean, description: 是否发生变化 }

VersionComparison:
  type: object
  required: [dataset_id, baseline_version, candidate_version, items_added,
             items_removed, items_common, item_comparison_truncated,
             added_samples, removed_samples, stats_diff, policy_changes]
  properties:
    dataset_id: { type: string, format: uuid }
    baseline_version: { type: integer, description: 基线版本号 }
    candidate_version: { type: integer, description: 候选版本号 }
    items_added: { type: integer, minimum: 0, description: 候选新增条目数 }
    items_removed: { type: integer, minimum: 0, description: 基线被移除条目数 }
    items_common: { type: integer, minimum: 0, description: 两版共有条目数 }
    item_comparison_truncated:
      type: boolean
      description: 条目对比是否因上限截断（true 时计数是部分值）
    added_samples:
      type: array
      maxItems: 5
      description: 新增条目样例
      items: { type: object, additionalProperties: true }
    removed_samples:
      type: array
      maxItems: 5
      description: 移除条目样例
      items: { type: object, additionalProperties: true }
    stats_diff:
      type: object
      additionalProperties: { $ref: "#/StatDiff" }
    policy_changes:
      type: object
      additionalProperties: { type: string, description: "旧 → 新" }
# --- Webhook 订阅（阶段 5 / 蓝图 N5） ---
WebhookSubscriptionCreate:
  type: object
  required: [url, secret, event_types]
  properties:
    url:
      type: string
      minLength: 1
      maxLength: 2048
      description: 订阅地址（https 或本机 http）
    secret:
      type: string
      minLength: 8
      maxLength: 256
      description: 验签密钥明文（仅创建时返回一次）
    event_types:
      type: array
      minItems: 1
      maxItems: 50
      description: 订阅的事件类型（至少一个）
      items: { type: string }

WebhookSubscriptionOut:
  type: object
  required: [id, url, event_types, status, consecutive_failures]
  properties:
    id: { type: string, format: uuid }
    url: { type: string }
    event_types:
      type: array
      items: { type: string }
    status: { type: string, enum: [ACTIVE, PAUSED] }
    consecutive_failures: { type: integer, minimum: 0 }
    last_success_at: { type: [string, "null"], format: date-time }
    last_error_at: { type: [string, "null"], format: date-time }
    last_error_message: { type: [string, "null"] }
    created_at: { type: [string, "null"], format: date-time }

WebhookSubscriptionCreated:
  allOf:
    - $ref: "#/WebhookSubscriptionOut"
    - type: object
      required: [secret]
      properties:
        secret: { type: string, description: 验签密钥明文（仅创建时返回一次） }

WebhookSubscriptionPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "#/WebhookSubscriptionOut" }
