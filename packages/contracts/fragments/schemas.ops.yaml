# V52-010 Token 成本台账 schema 片段（蓝图 N6）。
#
# 金额字段统一 `type: string`（十进制、4 位小数）：货币值经 JSON 双精度
# 会丢精度（MEM-INC-008 同族问题），前端类型定义也必须用 string。
# `cost_estimate: null` 表示"未配置价格"，不是 0（0 = 免费）。

TokenCostLedgerEntry:
  type: object
  required:
    - model_id
    - purpose
    - call_count
    - input_tokens
    - output_tokens
    - total_tokens
    - cost_estimate
    - cost_estimated_tokens
  properties:
    model_id:
      type: string
      description: 模型 ID（成本归属键，与 AI 建议的 model_id 同源）
    purpose:
      type: string
      enum: [PRE_LABEL, LLM_JUDGE, EMBED]
      description: 计量用途
    call_count:
      type: integer
      minimum: 0
      description: 该桶的 LLM 调用次数
    input_tokens:
      type: integer
      minimum: 0
      description: 输入 token 合计
    output_tokens:
      type: integer
      minimum: 0
      description: 输出 token 合计
    total_tokens:
      type: integer
      minimum: 0
      description: 输入 + 输出 token 合计
    cost_estimate:
      type: [string, "null"]
      description: 成本合计（USD 十进制字符串，4 位小数）；null = 未配置价格（不是 0）
    cost_estimated_tokens:
      type: integer
      minimum: 0
      description: 有价可算部分的 token 数；未配价模型的 tokens 不计入

TokenCostLedger:
  type: object
  required:
    - project_id
    - entries
    - total_cost_estimate
    - generated_at
  properties:
    project_id:
      type: string
      format: uuid
      description: 项目 ID
    entries:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/TokenCostLedgerEntry"
      description: 按 (model_id, purpose) 聚合的条目（确定性排序）
    total_cost_estimate:
      type: [string, "null"]
      description: 全项目有价部分成本合计（USD 十进制字符串）；全未配价时为 null（不是 0）
    generated_at:
      type: string
      format: date-time
      description: 快照生成时间（UTC，带时区）

# --- 评测失败案例回流（V52-030，蓝图 N5 / G5） ---
AnnotationBackflowIngest:
  type: object
  required: [cases]
  properties:
    cases:
      type: array
      minItems: 1
      maxItems: 200
      description: 案例数组；每条必含 source / case_ref / capability
      items:
        type: object
        required: [source, case_ref, capability]
        properties:
          source: { type: string, minLength: 1, maxLength: 120, description: 来源系统标识 }
          case_ref: { type: string, minLength: 1, maxLength: 200, description: 来源系统内案例唯一键 }
          capability: { type: string, minLength: 1, maxLength: 120, description: 失败所属能力维度 }
          failure_summary: { type: string, maxLength: 1000, description: 失败摘要（可选） }
          failure_count: { type: integer, minimum: 1, default: 1, description: 该案例累计失败次数（影响优先级） }
          suggested_priority:
            type: string
            enum: [P0, P1, P2, P3]
            description: 显式优先级（可选；缺省按 capability + failure_count 映射）
          payload:
            type: object
            additionalProperties: true
            description: 评测平台原始报告片段（平台只存储不解释）
    limit:
      type: integer
      minimum: 1
      maximum: 10000
      default: 200
      description: 单 source 每小时受理上限（超出判 RATE_LIMITED）
    conversion:
      type: object
      required: [sample_set_id, schema_id]
      description: 可选：受理后立即转任务的目标配置
      properties:
        sample_set_id: { type: string, format: uuid, description: 目标样本集 ID }
        schema_id: { type: string, format: uuid, description: 标注 Schema ID }

AnnotationBackflowDecision:
  type: object
  required: [source, case_ref, capability, decision, reason, suggested_priority]
  properties:
    source: { type: string }
    case_ref: { type: string }
    capability: { type: string }
    decision:
      type: string
      enum: [CREATE_TASK, DUPLICATE_SKIPPED, RATE_LIMITED]
      description: 单条案例的判定
    reason: { type: string, description: 判定原因（审计可追溯） }
    suggested_priority: { type: string, enum: [P0, P1, P2, P3] }

AnnotationBackflowIngestResult:
  type: object
  required: [accepted, duplicated, rate_limited, decisions]
  properties:
    accepted: { type: integer, minimum: 0, description: 受理（将转任务）的案例数 }
    duplicated: { type: integer, minimum: 0, description: 重复跳过的案例数 }
    rate_limited: { type: integer, minimum: 0, description: 超限拒绝的案例数 }
    task_id:
      type: [string, "null"]
      format: uuid
      description: 转换成功时的任务 ID；未配置转换目标时为 null
    decisions:
      type: array
      items: { $ref: "#/AnnotationBackflowDecision" }

AnnotationBackflowCase:
  type: object
  required: [case_id, source, case_ref, capability, status, suggested_priority, received_at]
  properties:
    case_id: { type: string, format: uuid }
    source: { type: string }
    case_ref: { type: string }
    capability: { type: string }
    status:
      type: string
      enum: [RECEIVED, CONVERTED, SKIPPED_DUPLICATE, RATE_LIMITED]
    suggested_priority: { type: string, enum: [P0, P1, P2, P3] }
    failure_summary: { type: [string, "null"] }
    task_id: { type: [string, "null"], format: uuid }
    received_at: { type: string, format: date-time }

AnnotationBackflowCasePage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "#/AnnotationBackflowCase" }
