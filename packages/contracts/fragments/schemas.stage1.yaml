HealthResponse:
  type: object
  required: [status, service, version, env]
  additionalProperties: false
  properties:
    status: {type: string, const: ok}
    service: {type: string}
    version: {type: string}
    env: {type: string}
PlatformMeta:
  type: object
  required: [name, version, env, phase, modules]
  additionalProperties: false
  properties:
    name: {type: string}
    version: {type: string}
    env: {type: string}
    phase: {type: string}
    modules: {type: array, items: {type: string}}
LifecycleStatus:
  type: string
  enum: [PROVISIONED, ACTIVE, IN_MAINTENANCE, FAULT, SUSPENDED, RETIRED]
DeviceType:
  type: string
  enum: [COMPUTE, CONTROLLER, CAMERA_RIG, TELEOP, GRIPPER, OTHER]
SensorType:
  type: string
  enum: [RGB, RGB_D, DEPTH, IMU, JOINT_STATE, END_EFFECTOR, FORCE_TORQUE, MOCAP, AUDIO]
SensorSyncMode:
  type: string
  enum: [PTP, NTP, HARDWARE_TRIGGER, SOFTWARE_ESTIMATE, MANUAL, NONE]
FrameConvention:
  type: string
  description: |
    坐标系约定（ADR-0019）。UNSPECIFIED 是显式的"不知道"，
    不是默认猜一个：把非 ROS 数据错标成 ROS 约定比标注未知更危险。
  enum: [ROS_REP_103, OPENCV, UNITY_LHS, UNSPECIFIED]
CalibrationScope:
  type: string
  enum: [ROBOT, DEVICE, SENSOR, SYSTEM]
CalibrationTargetType:
  type: string
  enum: [ROBOT, DEVICE, SENSOR, SYSTEM]
CalibrationType:
  type: string
  enum: [INTRINSICS, EXTRINSICS, HAND_EYE, IMU, JOINT_OFFSET, TIME_OFFSET, FORCE_TORQUE, DEPTH_ALIGNMENT]
CalibrationStatus:
  type: string
  enum: [DRAFT, SUBMITTED, VALIDATED, ACTIVE, REJECTED, SUPERSEDED, REVOKED, EXPIRED]
Robot:
  type: object
  required: [robot_id, project_id, code, name, robot_type, status, capability_profile, version]
  additionalProperties: false
  properties:
    robot_id: {type: string, format: uuid}
    project_id: {type: string, format: uuid}
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    robot_type: {type: string, minLength: 1, maxLength: 64}
    status: {$ref: "#/LifecycleStatus"}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    firmware_version: {type: [string, "null"], maxLength: 64}
    hardware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    capability_profile: {type: object, additionalProperties: true}
    location_id: {type: [string, "null"], format: uuid}
    owner_user_id: {type: [string, "null"], format: uuid}
    status_reason: {type: [string, "null"], maxLength: 500}
    fault_code: {type: [string, "null"], maxLength: 64}
    fault_detail: {type: [string, "null"], maxLength: 2000}
    fault_occurred_at: {type: [string, "null"], format: date-time}
    status_changed_at: {type: [string, "null"], format: date-time}
    status_changed_by: {type: [string, "null"], format: uuid}
    version: {type: integer, minimum: 1}
RobotPage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items: {type: array, items: {$ref: "#/Robot"}}
    next_cursor: {type: [string, "null"]}
RobotCreate:
  type: object
  required: [code, name, robot_type]
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    robot_type: {type: string, minLength: 1, maxLength: 64}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    firmware_version: {type: [string, "null"], maxLength: 64}
    hardware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    capability_profile: {type: object, additionalProperties: true}
    location_id: {type: [string, "null"], format: uuid}
    owner_user_id: {type: [string, "null"], format: uuid}
RobotPatch:
  type: object
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    robot_type: {type: string, minLength: 1, maxLength: 64}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    firmware_version: {type: [string, "null"], maxLength: 64}
    hardware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    # G-09 顺带修正：实现从不接受 null（frozen_mapping 只认 Mapping），
    # 契约此前允许 null 属描述错误。与 RobotCreate / DevicePatch 保持一致。
    capability_profile: {type: object, additionalProperties: true}
    location_id: {type: [string, "null"], format: uuid}
    owner_user_id: {type: [string, "null"], format: uuid}
CalibrationProfile:
  type: object
  required: [profile_id, project_id, name, scope, target_type, profile_version, schema_version, required_types, selection_rule, target_id]
  additionalProperties: false
  properties:
    profile_id: {type: string, format: uuid}
    project_id: {type: string, format: uuid}
    name: {type: string, minLength: 1, maxLength: 200}
    scope: {$ref: "#/CalibrationScope"}
    target_type: {$ref: "#/CalibrationTargetType"}
    profile_version: {type: integer, minimum: 1, description: "业务版本号；Domain / ORM / DB 列同名（ADR-0032）"}
    schema_version: {type: string, minLength: 1, maxLength: 64}
    required_types: {type: array, items: {$ref: "#/CalibrationType"}}
    selection_rule: {type: object, additionalProperties: true}
    target_id: {type: [string, "null"], format: uuid}
CalibrationProfileCreate:
  type: object
  required: [name, scope, target_type, schema_version]
  additionalProperties: false
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    scope: {$ref: "#/CalibrationScope"}
    target_type: {$ref: "#/CalibrationTargetType"}
    schema_version: {type: string, minLength: 1, maxLength: 64}
    required_types: {type: array, items: {$ref: "#/CalibrationType"}}
    selection_rule: {type: object, additionalProperties: true}
    target_id: {type: [string, "null"], format: uuid}
    profile_version: {type: integer, minimum: 1, default: 1}
    supersedes_id: {type: [string, "null"], format: uuid}
Device:
  type: object
  required: [device_id, project_id, robot_id, code, name, device_type, vendor, model, serial_number, firmware_version, hardware_version, calibration_profile_id, capability_profile, status, location_id, owner_user_id, version, created_at, updated_at, created_by, updated_by]
  additionalProperties: false
  properties:
    device_id: {type: string, format: uuid}
    project_id: {type: string, format: uuid}
    robot_id: {type: [string, "null"], format: uuid}
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    device_type: {$ref: "#/DeviceType"}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    firmware_version: {type: [string, "null"], maxLength: 64}
    hardware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    capability_profile: {type: object, additionalProperties: true}
    status: {$ref: "#/LifecycleStatus"}
    location_id: {type: [string, "null"], format: uuid}
    owner_user_id: {type: [string, "null"], format: uuid}
    version: {type: integer, minimum: 1, description: "乐观锁；仅表示档案版本，不表示业务修订历史"}
    # G-09：状态语义六列与 Robot 对齐（DB 迁移 0023/0031 已有列）。
    # 新增字段不进入 required，避免历史响应（未写入这些值的记录）被判为不合法。
    status_reason: {type: [string, "null"], maxLength: 1000}
    fault_code: {type: [string, "null"], maxLength: 64}
    fault_detail: {type: [string, "null"], maxLength: 2000}
    fault_occurred_at: {type: [string, "null"], format: date-time}
    status_changed_at: {type: [string, "null"], format: date-time}
    status_changed_by: {type: [string, "null"], format: uuid}
    created_at: {type: [string, "null"], format: date-time}
    updated_at: {type: [string, "null"], format: date-time}
    created_by: {type: [string, "null"], format: uuid}
    updated_by: {type: [string, "null"], format: uuid}
DeviceCreate:
  type: object
  required: [code, name, device_type]
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    device_type: {$ref: "#/DeviceType"}
    robot_id: {type: [string, "null"], format: uuid}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    firmware_version: {type: [string, "null"], maxLength: 64}
    hardware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    capability_profile: {type: object, additionalProperties: true, default: {}}
    location_id: {type: [string, "null"], format: uuid}
    owner_user_id: {type: [string, "null"], format: uuid}
DevicePatch:
  type: object
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    device_type: {$ref: "#/DeviceType"}
    robot_id: {type: [string, "null"], format: uuid}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    firmware_version: {type: [string, "null"], maxLength: 64}
    hardware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    capability_profile: {type: object, additionalProperties: true}
    location_id: {type: [string, "null"], format: uuid}
    owner_user_id: {type: [string, "null"], format: uuid}
DevicePage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items: {type: array, items: {$ref: "#/Device"}}
    next_cursor: {type: [string, "null"]}
Sensor:
  type: object
  required: [sensor_id, project_id, robot_id, device_id, code, sensor_type, vendor, model, serial_number, sample_rate_hz, resolution_w, resolution_h, bit_depth, channels, intrinsic_calibration_id, extrinsic_calibration_id, coordinate_frame, sync_mode, sync_group, firmware_version, calibration_profile_id, status, mount_position, version, created_at, updated_at]
  additionalProperties: false
  properties:
    sensor_id: {type: string, format: uuid}
    project_id: {type: string, format: uuid}
    robot_id: {type: [string, "null"], format: uuid}
    device_id: {type: [string, "null"], format: uuid}
    code: {type: string, minLength: 1, maxLength: 64}
    sensor_type: {$ref: "#/SensorType"}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    sample_rate_hz: {type: number, exclusiveMinimum: 0}
    resolution_w: {type: [integer, "null"], minimum: 1}
    resolution_h: {type: [integer, "null"], minimum: 1}
    bit_depth: {type: [integer, "null"], minimum: 1}
    channels: {type: [integer, "null"], minimum: 1, description: "整数通道数；不是字符串数组"}
    intrinsic_calibration_id: {type: [string, "null"], format: uuid}
    extrinsic_calibration_id: {type: [string, "null"], format: uuid}
    coordinate_frame: {type: string, minLength: 1, maxLength: 200, deprecated: true, description: "DEPRECATED（ADR-0019）：读 frame_id；本字段保留至阶段 2 移除"}
    frame_id: {type: string, minLength: 1, maxLength: 200, description: "坐标系标识，如 camera_link、base_link（ADR-0019）"}
    frame_convention: {$ref: '#/FrameConvention'}
    sync_mode: {$ref: "#/SensorSyncMode"}
    sync_group: {type: [string, "null"], maxLength: 64}
    firmware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    status: {$ref: "#/LifecycleStatus"}
    mount_position: {type: [string, "null"], maxLength: 200}
    version: {type: integer, minimum: 1}
    # G-09：与 Device / Robot 对齐的状态语义六列；不进 required（理由同 Device）。
    status_reason: {type: [string, "null"], maxLength: 1000}
    fault_code: {type: [string, "null"], maxLength: 64}
    fault_detail: {type: [string, "null"], maxLength: 2000}
    fault_occurred_at: {type: [string, "null"], format: date-time}
    status_changed_at: {type: [string, "null"], format: date-time}
    status_changed_by: {type: [string, "null"], format: uuid}
    created_at: {type: [string, "null"], format: date-time}
    updated_at: {type: [string, "null"], format: date-time}
SensorCreate:
  type: object
  required: [code, sensor_type, sample_rate_hz, coordinate_frame]
  additionalProperties: false
  anyOf:
    - required: [robot_id]
    - required: [device_id]
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    sensor_type: {$ref: "#/SensorType"}
    sample_rate_hz: {type: number, exclusiveMinimum: 0}
    coordinate_frame: {type: string, minLength: 1, maxLength: 200, description: "DEPRECATED（ADR-0019）：新客户端应填 frame_id"}
    frame_id: {type: [string, "null"], minLength: 1, maxLength: 200, description: "坐标系标识；缺省时服务端回落到 coordinate_frame"}
    frame_convention: {$ref: "#/FrameConvention"}
    robot_id: {type: [string, "null"], format: uuid}
    device_id: {type: [string, "null"], format: uuid}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    resolution_w: {type: [integer, "null"], minimum: 1}
    resolution_h: {type: [integer, "null"], minimum: 1}
    bit_depth: {type: [integer, "null"], minimum: 1}
    channels: {type: [integer, "null"], minimum: 1}
    intrinsic_calibration_id: {type: [string, "null"], format: uuid}
    extrinsic_calibration_id: {type: [string, "null"], format: uuid}
    sync_mode: {$ref: "#/SensorSyncMode"}
    sync_group: {type: [string, "null"], maxLength: 64}
    firmware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    mount_position: {type: [string, "null"], maxLength: 200}
SensorPatch:
  type: object
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    sensor_type: {$ref: "#/SensorType"}
    robot_id: {type: [string, "null"], format: uuid}
    device_id: {type: [string, "null"], format: uuid}
    vendor: {type: [string, "null"], maxLength: 120}
    model: {type: [string, "null"], maxLength: 120}
    serial_number: {type: [string, "null"], maxLength: 120}
    sample_rate_hz: {type: number, exclusiveMinimum: 0}
    resolution_w: {type: [integer, "null"], minimum: 1}
    resolution_h: {type: [integer, "null"], minimum: 1}
    bit_depth: {type: [integer, "null"], minimum: 1}
    channels: {type: [integer, "null"], minimum: 1}
    intrinsic_calibration_id: {type: [string, "null"], format: uuid}
    extrinsic_calibration_id: {type: [string, "null"], format: uuid}
    coordinate_frame: {type: string, minLength: 1, maxLength: 200, deprecated: true}
    frame_id: {type: [string, "null"], minLength: 1, maxLength: 200}
    frame_convention: {$ref: "#/FrameConvention"}
    sync_mode: {$ref: "#/SensorSyncMode"}
    sync_group: {type: [string, "null"], maxLength: 64}
    firmware_version: {type: [string, "null"], maxLength: 64}
    calibration_profile_id: {type: [string, "null"], format: uuid}
    mount_position: {type: [string, "null"], maxLength: 200}
SensorPage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items: {type: array, items: {$ref: "#/Sensor"}}
    next_cursor: {type: [string, "null"]}
Calibration:
  type: object
  required: [calibration_id, project_id, profile_id, scope, target_type, target_id, calibration_type, method, parameters, parent_frame, child_frame, valid_from, valid_to, status, evidence_asset_ids, source, checksum, uncertainty, performed_by, validated_by, validated_at, supersedes_id, version, created_at, updated_at]
  additionalProperties: false
  properties:
    calibration_id: {type: string, format: uuid}
    project_id: {type: string, format: uuid}
    profile_id: {type: string, format: uuid}
    scope: {$ref: "#/CalibrationScope"}
    target_type: {$ref: "#/CalibrationTargetType"}
    target_id: {type: string, format: uuid}
    calibration_type: {$ref: "#/CalibrationType"}
    method: {type: string, minLength: 1, maxLength: 200}
    parameters: {type: object, additionalProperties: true}
    parent_frame: {type: [string, "null"], maxLength: 200}
    child_frame: {type: [string, "null"], maxLength: 200}
    valid_from: {type: string, format: date-time}
    valid_to: {type: [string, "null"], format: date-time}
    status: {$ref: "#/CalibrationStatus"}
    evidence_asset_ids: {type: array, items: {type: string, format: uuid}}
    source: {type: [string, "null"], maxLength: 120}
    checksum: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    uncertainty: {type: object, additionalProperties: true}
    performed_by: {type: string, format: uuid}
    validated_by: {type: [string, "null"], format: uuid}
    validated_at: {type: [string, "null"], format: date-time}
    supersedes_id: {type: [string, "null"], format: uuid}
    calibration_version: {type: integer, minimum: 1, description: "业务修订号（ADR-0020）；只有内容变更才递增"}
    profile_version: {type: [integer, "null"], minimum: 1, description: "创建时 Profile 版本（ADR-0020 / G-05）"}
    profile_schema_version: {type: [string, "null"], maxLength: 64, description: "创建时 Profile 的 schema 版本（ADR-0020 / G-05）"}
    profile_snapshot: {type: object, additionalProperties: true, description: "创建时 Profile 内容副本，保证事后可复现（ADR-0020 / G-05）"}
    version: {type: integer, minimum: 1, deprecated: true, description: "DEPRECATED（ADR-0020）：乐观锁版本，改名 lock_version 见阶段 2"}
    created_at: {type: [string, "null"], format: date-time}
    updated_at: {type: [string, "null"], format: date-time}
CalibrationCreate:
  type: object
  required: [profile_id, target_type, target_id, calibration_type, method, parameters, valid_from]
  additionalProperties: false
  properties:
    profile_id: {type: string, format: uuid}
    target_type: {$ref: "#/CalibrationTargetType"}
    target_id: {type: string, format: uuid}
    calibration_type: {$ref: "#/CalibrationType"}
    method: {type: string, minLength: 1, maxLength: 200}
    parameters:
      type: object
      description: |
        形状由 docs/architecture/contract-draft/device/calibration-parameters.v1.schema.json
        按 calibration_type 冻结（ADR-0021 / G-19）；服务端不符即 422。
    valid_from: {type: string, format: date-time}
    valid_to: {type: [string, "null"], format: date-time}
    parent_frame: {type: [string, "null"], maxLength: 200}
    child_frame: {type: [string, "null"], maxLength: 200}
    evidence_asset_ids: {type: array, items: {type: string, format: uuid}, default: []}
    source: {type: [string, "null"], maxLength: 120}
    uncertainty: {type: object, additionalProperties: true, default: {}}
CalibrationPatch:
  type: object
  additionalProperties: false
  properties:
    profile_id: {type: string, format: uuid}
    target_type: {$ref: "#/CalibrationTargetType"}
    target_id: {type: string, format: uuid}
    calibration_type: {$ref: "#/CalibrationType"}
    method: {type: string, minLength: 1, maxLength: 200}
    parameters: {type: object, additionalProperties: true}
    valid_from: {type: string, format: date-time}
    valid_to: {type: [string, "null"], format: date-time}
    parent_frame: {type: [string, "null"], maxLength: 200}
    child_frame: {type: [string, "null"], maxLength: 200}
    evidence_asset_ids: {type: array, items: {type: string, format: uuid}}
    source: {type: [string, "null"], maxLength: 120}
    uncertainty: {type: object, additionalProperties: true}
CalibrationPage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items: {type: array, items: {$ref: "#/Calibration"}}
    next_cursor: {type: [string, "null"]}
ActionRequest:
  type: object
  additionalProperties: false
  properties:
    reason: {type: [string, "null"], maxLength: 1000}
    fault_code: {type: [string, "null"], maxLength: 64}
    fault_detail: {type: [string, "null"], maxLength: 2000}
    occurred_at: {type: [string, "null"], format: date-time}
    maintenance_record_id: {type: [string, "null"], format: uuid}
    evidence_refs: {type: [array, "null"], items: {type: string, format: uuid}}
