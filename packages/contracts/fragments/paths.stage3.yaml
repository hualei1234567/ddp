# 阶段 3 标注域路径片段。
# 仅声明 backend/app/api/v1/annotation_{catalog,work,results,quality}.py 实际实现且
# include_in_schema=True 的端点；隐藏别名（annotation-batches / annotation-gold-sets /
# annotation-quality-samples / annotation-iaa-reports）不进入契约。

annotationSchemas:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listAnnotationSchemas
    tags: [annotation-schemas]
    summary: 标签 Schema 列表（游标分页）
    parameters:
      - {name: status, in: query, required: false, schema: {$ref: "../openapi.yaml#/components/schemas/AnnotationSchemaStatus"}}
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200": {description: Schema 分页, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/AnnotationSchemaPage"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
  post:
    operationId: createAnnotationSchema
    tags: [annotation-schemas]
    summary: 创建标签 Schema（初始 DRAFT）
    parameters: [{$ref: "../openapi.yaml#/components/parameters/IdempotencyKey"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/AnnotationSchemaCreate"}}}}
    responses:
      "201": {description: Schema 已创建, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/AnnotationSchema"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}

annotationSchemaDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/SchemaId"
  get:
    operationId: getAnnotationSchema
    tags: [annotation-schemas]
    summary: Schema 详情
    responses:
      "200": {description: Schema 详情, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/AnnotationSchema"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
  patch:
    operationId: updateAnnotationSchema
    tags: [annotation-schemas]
    summary: 修改 DRAFT Schema（If-Match 乐观锁）
    parameters: [{$ref: "../openapi.yaml#/components/parameters/IfMatch"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/AnnotationSchemaPatch"}}}}
    responses:
      "200": {description: 修改后的 Schema, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/AnnotationSchema"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "428": {$ref: "../openapi.yaml#/components/responses/PreconditionRequired"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}

annotationSchemaActions:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/SchemaId"
    - $ref: "../openapi.yaml#/components/parameters/AnnotationSchemaAction"
  post:
    operationId: actOnAnnotationSchema
