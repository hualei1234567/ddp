    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/IAAReportCreate"}}}}
    responses:
      "201": {description: IAA 报告, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/IAAReport"}}}}
