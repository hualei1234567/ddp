    responses:
      "200": {description: 动作后的抽检, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/QualitySample"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
