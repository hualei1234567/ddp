# 阶段 5 模型闭环域路径片段。
# 仅声明 backend/app/api/v1/{model_routes,evaluation_routes,inference_routes,
# feedback_routes,requirement_routes,model_adapter_routes}.py 实际实现的端点。
# 由 openapi.yaml 通过 $ref 解析；引用回入口文件以复用公共参数与响应。

models:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/ProjectId
  get:
    operationId: listModels
    tags:
    - models
    summary: 模型列表
    parameters:
    - name: status
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/ModelStatus
    - name: task_type
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/ModelTaskType
    - $ref: ../openapi.yaml#/components/parameters/Cursor
    - $ref: ../openapi.yaml#/components/parameters/Limit
    responses:
      '200':
        description: 模型分页
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ModelPage
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  post:
    operationId: createModel
    tags:
    - models
    summary: 创建模型（DRAFT）
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ModelCreate
    responses:
      '201':
        description: 模型已创建
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Model
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
modelDetail:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/ProjectId
  - $ref: ../openapi.yaml#/components/parameters/ModelId
  get:
    operationId: getModel
    tags:
    - models
    summary: 模型详情
    responses:
      '200':
        description: 模型
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Model
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  patch:
    operationId: updateModel
    tags:
    - models
    summary: 修改模型（If-Match）
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ModelPatch
    responses:
      '200':
        description: 修改后的模型
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Model
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '428':
        $ref: ../openapi.yaml#/components/responses/PreconditionRequired
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
modelActions:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/ProjectId
  - $ref: ../openapi.yaml#/components/parameters/ModelId
  - $ref: ../openapi.yaml#/components/parameters/ModelAction
