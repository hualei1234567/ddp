# 阶段 7 数据平面 Schema（第一批：HF 数据源登记与导入）。

DataSourceKind:
  type: string
  enum: [HUGGINGFACE]
  description: 数据源类型。当前仅支持 Hugging Face；新增 Adapter 时在此扩展。

AccessCondition:
  type: string
  enum: [PUBLIC, GATED, PRIVATE, UNKNOWN]
  description: |
    访问条件。**访问成功不等于拥有商业使用权**（`docs/ddp/07` §2）。
    `GATED` 必须与 `is_gated=true` 同时出现。

ImportScope:
  type: string
  enum: [SAMPLE, SPLIT, FULL]
  description: 导入范围。默认只做小样本，不默认全量下载。

ImportStatus:
  type: string
  enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]

ImportAction:
  type: string
  enum: [start, succeed, fail, cancel]
  description: |
    `PENDING -> RUNNING -> {SUCCEEDED, FAILED, CANCELLED}`；终态之后任何动作都返回
    `state_transition_invalid`（409）。

ImportStage:
  type: string
  enum: [DOWNLOAD, VALIDATE, PARSE, INGEST, COMPLETE]
  description: |
    导入执行阶段（运行期可观测性，不参与状态机）。响应中 `stage=null` 表示
    **未测量**（迁移 0055 之前的存量导入），不是"已完成 0%"。

ImportLogLevel:
  type: string
  enum: [INFO, WARNING, ERROR]

DataSourceCreate:
  type: object
  additionalProperties: false
  required: [code, name, repo_id, revision, license, access_condition]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    repo_id:
      type: string
      pattern: '^[A-Za-z0-9][\w.-]*/[A-Za-z0-9][\w.-]*$'
      description: Hugging Face repo id，形如 `owner/name`；不接受 URL。
    revision:
      type: string
      minLength: 40
      maxLength: 40
      pattern: '^[0-9a-f]{40}$'
      description: |
        必须是 40 位 commit sha。`main` 等分支引用会移动，只存分支名的导入不可复现，
        因此契约层直接拒绝。
    license: { type: string, minLength: 1, maxLength: 100 }
    access_condition: { $ref: "../openapi.yaml#/components/schemas/AccessCondition" }
    is_gated: { type: boolean, default: false }
    kind:
      allOf:
        - $ref: "../openapi.yaml#/components/schemas/DataSourceKind"
      default: HUGGINGFACE
    config_name: { type: [string, "null"], maxLength: 100 }
    split: { type: [string, "null"], maxLength: 100 }
    dataset_card_url: { type: [string, "null"], maxLength: 2048 }
    notes: { type: [string, "null"], maxLength: 2000 }
    metadata: { type: [object, "null"], additionalProperties: true }
    verify_remote:
      type: boolean
      default: false
      description: |
        显式请求在登记前读取 Hugging Face 远端元信息。默认 `false`，避免每次
        登记都访问外网。开启后，超时、仓库不存在/无权限、gated 与声明不一致
        都会让登记失败（`validation_failed`，422），不会写入半条记录。
        失败响应体带 `details.remote_check = {status: "FAILED", reason: <枚举>}`，
        `reason` 取 `RemoteCheckFailureReason`，供前端区分超时/404/5xx/非法响应。
        校验结论只以规范化摘要写入服务端保留的 `metadata.remote_check`，
        远端返回的其他字段不会落库；远端原始报错、URL 与凭据绝不回显。

DataSourcePatch:
  type: object
  additionalProperties: false
  description: |
    只允许改治理字段。`repo_id` / `revision` 不在白名单内：改 revision 等于换数据，
    必须重新登记以保证血缘可追。
  properties:
    name: { type: [string, "null"], minLength: 1, maxLength: 200 }
    license: { type: [string, "null"], minLength: 1, maxLength: 100 }
    access_condition:
      oneOf:
        - { $ref: "../openapi.yaml#/components/schemas/AccessCondition" }
        - { type: "null" }
    is_gated: { type: [boolean, "null"] }
    config_name: { type: [string, "null"], maxLength: 100 }
    split: { type: [string, "null"], maxLength: 100 }
    notes: { type: [string, "null"], maxLength: 2000 }

DataSource:
  type: object
  required:
    [data_source_id, project_id, code, name, kind, repo_id, revision, license,
     access_condition, is_gated, metadata, version]
  properties:
    data_source_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string }
    name: { type: string }
    kind: { $ref: "../openapi.yaml#/components/schemas/DataSourceKind" }
    repo_id: { type: string }
    revision: { type: string }
    license: { type: string }
    access_condition: { $ref: "../openapi.yaml#/components/schemas/AccessCondition" }
    is_gated: { type: boolean }
    config_name: { type: [string, "null"] }
    split: { type: [string, "null"] }
    dataset_card_url: { type: [string, "null"] }
    notes: { type: [string, "null"] }
    metadata: { type: object, additionalProperties: true }
    version: { type: integer, minimum: 1 }

DataSourcePage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/DataSource" }
    next_cursor: { type: [string, "null"] }

DataSourceImportCreate:
  type: object
  additionalProperties: false
  required: [scope, tool_name, tool_version]
  properties:
    scope: { $ref: "../openapi.yaml#/components/schemas/ImportScope" }
    tool_name: { type: string, minLength: 1, maxLength: 200 }
    tool_version: { type: string, minLength: 1, maxLength: 100 }
    sample_limit:
      type: [integer, "null"]
      minimum: 1
      description: |
        `scope=SAMPLE` 时必填。默认只做小样本导入，不默认全量下载。
    cache_location: { type: [string, "null"], maxLength: 1024 }
    collection_task_id:
      type: [string, "null"]
      format: uuid
      description: |
        数据归属：本次导入是为哪个采集任务采的。导入产出的 RawAsset 与物化出
        的 Episode 会继承该归属；为空表示不归属任何任务。
    batch_id:
      type: [string, "null"]
      format: uuid
      description: 归属到具体采集批次；为空时只归属到任务。
    license_acknowledged:
      type: boolean
      default: false
      description: |
        许可确认（V61-023）。数据源为 `access_condition=GATED` / `is_gated=true`、
        或许可不在宽松白名单（MIT / Apache-2.0 / BSD / CC0 / CC-BY 等）时，
        必须显式传 `true` 才能导入；否则返回 422 并说明原因。许可缺失同样
        视为最严格（"没说许可"不等于"随便用"）。宽松许可的数据源无需本字段。
        确认事实（许可值 + 触发的限制原因）会写入审计 details 留痕。

ImportActionRequest:
  type: object
  additionalProperties: false
  properties:
    row_count: { type: [integer, "null"], minimum: 0 }
    file_count: { type: [integer, "null"], minimum: 0 }
    error_message:
      type: [string, "null"]
      maxLength: 2000
      description: |
        `action=fail` 时必填：失败留痕是 `docs/ddp/07` §5 的硬要求，
        不允许"失败了但不知道为什么"。

DataSourceImport:
  type: object
  required:
    [import_id, project_id, data_source_id, status, scope, tool_name, tool_version,
     stage, processed_items, total_items, version, allowed_actions]
  properties:
    import_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    data_source_id: { type: string, format: uuid }
    status: { $ref: "../openapi.yaml#/components/schemas/ImportStatus" }
    scope: { $ref: "../openapi.yaml#/components/schemas/ImportScope" }
    tool_name: { type: string }
    tool_version: { type: string }
    collection_task_id: { type: [string, "null"], format: uuid }
    batch_id: { type: [string, "null"], format: uuid }
    sample_limit: { type: [integer, "null"] }
    cache_location: { type: [string, "null"] }
    imported_row_count: { type: [integer, "null"] }
    imported_file_count: { type: [integer, "null"] }
    error_message: { type: [string, "null"] }
    started_at: { type: [string, "null"], format: date-time }
    finished_at: { type: [string, "null"], format: date-time }
    stage:
      type: [string, "null"]
      enum: [DOWNLOAD, VALIDATE, PARSE, INGEST, COMPLETE, null]
      description: |
        当前/最后进入的执行阶段。`null` = 未测量，前端必须显示"未测量"
        而不是 0%。
    processed_items:
      type: [integer, "null"]
      minimum: 0
      description: |
        已处理的媒体文件数。与 `total_items` 同为 null、或 `total_items=0`
        时不展示百分比。
    total_items:
      type: [integer, "null"]
      minimum: 0
      description: |
        本次导入要处理的媒体文件总数；元数据解析完成后才可知，之前为 null。
        存量导入为 null（未测量）。
    version: { type: integer, minimum: 1 }
    allowed_actions:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ImportAction" }
      description: 服务端计算的可执行动作；前端只按此渲染按钮。

DataSourceImportPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/DataSourceImport" }
    next_cursor: { type: [string, "null"] }

RemoteSourceCheck:
  type: object
  additionalProperties: false
  required:
    [status, checked_at, resolved_revision, license, is_gated, dataset_card_url]
  description: |
    服务端记录的一次**成功**远端校验结论，只含 Adapter 已规范化的字段。
    `license` 是远端 Dataset Card 的值；缺失时为 null，不代表"无限制"。
    校验**失败**不会产生本对象（登记被拒绝），失败原因见错误体
    `details.remote_check`（`RemoteCheckFailureReason`）。
  properties:
    status: { type: string, enum: [VERIFIED] }
    checked_at: { type: string, format: date-time }
    resolved_revision:
      type: string
      description: 远端解析出的不可变 commit sha。
    license: { type: [string, "null"] }
    is_gated: { type: boolean }
    dataset_card_url: { type: [string, "null"] }

RemoteCheckFailureReason:
  type: string
  description: |
    远端校验失败的稳定原因枚举，出现在登记失败响应的
    `error.details.remote_check.reason`。远端原始报错、URL 与凭据不回显。
  enum:
    - TIMEOUT
    - NOT_FOUND
    - UNAUTHORIZED
    - SERVER_ERROR
    - INVALID_RESPONSE
    - RESPONSE_TOO_LARGE
    - UNAVAILABLE

DataSourceDetail:
  type: object
  additionalProperties: false
  required: [data_source, imports, remote_check]
  description: |
    数据源详情聚合：登记信息、导入任务与最近一次远端校验结论。
    从未校验或摘要损坏时 `remote_check=null`，前端必须显示"未校验"。
  properties:
    data_source: { $ref: "../openapi.yaml#/components/schemas/DataSource" }
    imports:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/DataSourceImport" }
    remote_check:
      oneOf:
        - { $ref: "../openapi.yaml#/components/schemas/RemoteSourceCheck" }
        - { type: "null" }

ImportLog:
  type: object
  additionalProperties: false
  required:
    [log_id, project_id, import_id, stage, level, message, attempt, occurred_at]
  properties:
    log_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    import_id: { type: string, format: uuid }
    stage: { $ref: "../openapi.yaml#/components/schemas/ImportStage" }
    level: { $ref: "../openapi.yaml#/components/schemas/ImportLogLevel" }
    message:
      type: string
      minLength: 1
      maxLength: 1000
      description: |
        已脱敏的步骤消息：服务端写入与读取两侧都会替换 URL、预签名参数与
        绝对路径，客户端不得据此还原存储地址。
    attempt:
      type: integer
      minimum: 1
      description: 第几次尝试产生的日志；重试后可区分不同轮次。
    occurred_at: { type: string, format: date-time }

ImportLogList:
  type: object
  additionalProperties: false
  required: [items, truncated, next_cursor]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ImportLog" }
    truncated:
      type: boolean
      description: |
        是否还有更早的日志未返回。语义与 `next_cursor !== null` 严格等价；
        **不表示**消息体被截断（消息脱敏长度上限是独立规则）。
    next_cursor:
      type: [string, "null"]
      description: |
        下一页（更早日志）的不透明游标，取自本页最旧一条日志。
        `null` 表示已经到最早一条，没有更多历史。
        非法游标返回 `validation_failed`。

# ---------------------------------------------------------------------------
# 审看与质量报告（阶段 7 第二批：补上前一批漏登记的 6 个端点所需模型）
#
# 这些模型在实现侧早已存在（backend/app/api/v1/datasource_schemas.py 的
# MediaAssetOut / MediaAssetPlaybackOut / ReviewCreateOut / QualityReportOut），
# 只是契约没登记。字段以**实现的实际序列化结果**为准——不是反过来让实现
# 去迁就一份凭空写的契约。
# ---------------------------------------------------------------------------

MediaAsset:
  type: object
  required:
    - asset_id
    - raw_asset_id
    - project_id
    - data_source_id
    - import_id
    - episode_key
    - path
    - camera
    - object_key
    - size_bytes
    - sha256
    - content_type
    - task_name
    - created_at
  additionalProperties: false
  properties:
    asset_id: { type: string, format: uuid }
    raw_asset_id:
      type: [string, "null"]
      format: uuid
      description: 指向 Canonical 层 RawAsset；导入的每个媒体文件同时是一条 RawAsset。
    project_id: { type: string, format: uuid }
    data_source_id: { type: string, format: uuid }
    import_id: { type: string, format: uuid }
    episode_key:
      type: string
      minLength: 1
      description: 数据集内的 episode 标识（LeRobot 的 example_id 聚合结果）。
    path:
      type: string
      minLength: 1
      description: 数据集内的相对路径，用于回溯原始文件。
    camera:
      type: string
      minLength: 1
      description: 机位标识，如 main / right / stereo / wrist_left / wrist_right。
    object_key:
      type: string
      minLength: 1
      description: 对象存储内的键；客户端不得据此自行拼接访问地址。
    size_bytes: { type: integer, minimum: 0 }
    sha256:
      type: string
      description: 形如 `sha256:<hex>`；与官方校验清单可直接比对。
    content_type: { type: string, minLength: 1 }
    task_name: { type: string }
    excerpt_start_seconds: { type: [number, "null"], minimum: 0 }
    excerpt_seconds: { type: [number, "null"], minimum: 0 }
    source_fps: { type: [number, "null"], exclusiveMinimum: 0 }
    created_at: { type: string, format: date-time }

MediaAssetList:
  type: object
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/MediaAsset" }

MediaAssetPlayback:
  type: object
  required: [asset_id, url, expires_in_seconds, content_type, size_bytes]
  additionalProperties: false
  properties:
    asset_id: { type: string, format: uuid }
    url:
      type: string
      minLength: 1
      description: 服务端签发的短时预签名 URL；有效期见 expires_in_seconds。
    expires_in_seconds: { type: integer, minimum: 1 }
    content_type: { type: string, minLength: 1 }
    size_bytes: { type: integer, minimum: 0 }

DataReview:
  type: object
  required:
    - review_id
    - project_id
    - import_id
    - status
    - submitted_by
    - created_at
    - version
  additionalProperties: false
  properties:
    review_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    import_id: { type: string, format: uuid }
    status: { type: string, minLength: 1 }
    decision: { type: [string, "null"] }
    reason: { type: [string, "null"], maxLength: 2000 }
    reviewer_id: { type: [string, "null"], format: uuid }
    submitted_by: { type: string, format: uuid }
    created_at: { type: string, format: date-time }
    decided_at: { type: [string, "null"], format: date-time }
    version: { type: integer, minimum: 1 }
    evidence:
      anyOf:
        - $ref: "../openapi.yaml#/components/schemas/ReviewEvidence"
        - type: "null"
      description: |
        审核依据（可选）。旧审核记录为 null；服务端只接受白名单键，
        evidence 序列化后不得超过 2000 字节。

ReviewEvidence:
  type: object
  additionalProperties: false
  description: |
    结构化审核依据：时间点、机位、备注与片段键。最多 4 个键；
    键与长度限制由服务端领域层与契约双重校验。
  properties:
    timestamp_seconds:
      type: [number, "null"]
      minimum: 0
      description: 审核关注的时间点（秒，有限非负数）。
    camera: { type: [string, "null"], maxLength: 64 }
    note: { type: [string, "null"], maxLength: 500 }
    episode_key: { type: [string, "null"], maxLength: 128 }

ReviewDecisionRequest:
  type: object
  required: [decision]
  additionalProperties: false
  properties:
    decision:
      type: string
      enum: [ACCEPT, REJECT, NEEDS_FIX]
    reason: { type: [string, "null"], maxLength: 2000 }
    evidence:
      anyOf:
        - $ref: "../openapi.yaml#/components/schemas/ReviewEvidence"
        - type: "null"

ImportQualityFinding:
  type: object
  required: [rule_id, passed, detail]
  additionalProperties: false
  properties:
    rule_id: { type: string, minLength: 1 }
    passed: { type: boolean }
    detail: { type: string }

# 注意与数据集域的 `QualityReport`（schemas/quality-report.v1.schema.json）
# 区分：那个按 dataset_version 组织、含拆分与泄漏检查；本模型按导入任务组织、
# 只有规则通过率。同名不同物会误导客户端，故加 Import 前缀。
ImportQualityReport:
  type: object
  required:
    - import_id
    - rule_version
    - sample_scope
    - total_assets
    - total_episodes
    - passed
    - findings
    - failures
  additionalProperties: false
  properties:
    import_id: { type: string, format: uuid }
    rule_version: { type: string, minLength: 1 }
    sample_scope:
      type: string
      minLength: 1
      description: 质量结论覆盖的样本范围（SAMPLE / SPLIT / FULL），与导入任务一致。
    total_assets: { type: integer, minimum: 0 }
    total_episodes: { type: integer, minimum: 0 }
    passed: { type: boolean }
    findings:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ImportQualityFinding" }
    failures:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ImportQualityFinding" }

ImportEpisodeMaterializeRequest:
  type: object
  additionalProperties: false
  description: |
    可选场景标签；其余语义字段（任务名、指令、时间范围、机位集合）全部由
    导入产物推导，不接受客户端覆盖——否则同一份导入能生成出不同 Episode。
  properties:
    scene_labels:
      type: array
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 100 }

ImportEpisodeMaterializeResult:
  type: object
  required: [import_id, episode_count, episodes, skipped_episode_keys]
  additionalProperties: false
  properties:
    import_id: { type: string, format: uuid }
    episode_count: { type: integer, minimum: 0 }
    episodes:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/MaterializedEpisode" }
    skipped_episode_keys:
      type: array
      uniqueItems: true
      description: 已存在而同 Episode code 被跳过的 episode_key（幂等重试时非空）。
      items: { type: string, minLength: 1 }
