# 阶段 7 数据平面 Schema（第一批：HF 数据源登记与导入）。

DataSourceKind:
  type: string
  enum: [HUGGINGFACE]
  description: 数据源类型。当前仅支持 Hugging Face；新增 Adapter 时在此扩展。

AccessCondition:
  type: string
  enum: [PUBLIC, GATED, PRIVATE, UNKNOWN]
  description: |
    访问条件。**访问成功不等于拥有商业使用权**（`docs/ddp/07` §2）。
    `GATED` 必须与 `is_gated=true` 同时出现。

ImportScope:
  type: string
  enum: [SAMPLE, SPLIT, FULL]
  description: 导入范围。默认只做小样本，不默认全量下载。

ImportStatus:
  type: string
  enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]

ImportAction:
  type: string
  enum: [start, succeed, fail, cancel]
  description: |
    `PENDING -> RUNNING -> {SUCCEEDED, FAILED, CANCELLED}`；终态之后任何动作都返回
    `state_transition_invalid`（409）。

DataSourceCreate:
  type: object
  additionalProperties: false
  required: [code, name, repo_id, revision, license, access_condition]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    repo_id:
      type: string
      pattern: '^[A-Za-z0-9][\w.-]*/[A-Za-z0-9][\w.-]*$'
      description: Hugging Face repo id，形如 `owner/name`；不接受 URL。
    revision:
      type: string
      minLength: 40
      maxLength: 40
      pattern: '^[0-9a-f]{40}$'
      description: |
        必须是 40 位 commit sha。`main` 等分支引用会移动，只存分支名的导入不可复现，
        因此契约层直接拒绝。
    license: { type: string, minLength: 1, maxLength: 100 }
    access_condition: { $ref: "../openapi.yaml#/components/schemas/AccessCondition" }
    is_gated: { type: boolean, default: false }
    kind:
      allOf:
        - $ref: "../openapi.yaml#/components/schemas/DataSourceKind"
      default: HUGGINGFACE
    config_name: { type: [string, "null"], maxLength: 100 }
    split: { type: [string, "null"], maxLength: 100 }
    dataset_card_url: { type: [string, "null"], maxLength: 2048 }
    notes: { type: [string, "null"], maxLength: 2000 }
    metadata: { type: [object, "null"], additionalProperties: true }

DataSourcePatch:
  type: object
  additionalProperties: false
  description: |
    只允许改治理字段。`repo_id` / `revision` 不在白名单内：改 revision 等于换数据，
    必须重新登记以保证血缘可追。
  properties:
    name: { type: [string, "null"], minLength: 1, maxLength: 200 }
    license: { type: [string, "null"], minLength: 1, maxLength: 100 }
    access_condition:
      oneOf:
        - { $ref: "../openapi.yaml#/components/schemas/AccessCondition" }
        - { type: "null" }
    is_gated: { type: [boolean, "null"] }
    config_name: { type: [string, "null"], maxLength: 100 }
    split: { type: [string, "null"], maxLength: 100 }
    notes: { type: [string, "null"], maxLength: 2000 }

DataSource:
  type: object
  required:
    [data_source_id, project_id, code, name, kind, repo_id, revision, license,
     access_condition, is_gated, metadata, version]
  properties:
    data_source_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string }
    name: { type: string }
    kind: { $ref: "../openapi.yaml#/components/schemas/DataSourceKind" }
    repo_id: { type: string }
    revision: { type: string }
    license: { type: string }
    access_condition: { $ref: "../openapi.yaml#/components/schemas/AccessCondition" }
    is_gated: { type: boolean }
    config_name: { type: [string, "null"] }
    split: { type: [string, "null"] }
    dataset_card_url: { type: [string, "null"] }
    notes: { type: [string, "null"] }
    metadata: { type: object, additionalProperties: true }
    version: { type: integer, minimum: 1 }

DataSourcePage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/DataSource" }
    next_cursor: { type: [string, "null"] }

DataSourceImportCreate:
  type: object
  additionalProperties: false
  required: [scope, tool_name, tool_version]
  properties:
    scope: { $ref: "../openapi.yaml#/components/schemas/ImportScope" }
    tool_name: { type: string, minLength: 1, maxLength: 200 }
    tool_version: { type: string, minLength: 1, maxLength: 100 }
    sample_limit:
      type: [integer, "null"]
      minimum: 1
      description: |
        `scope=SAMPLE` 时必填。默认只做小样本导入，不默认全量下载。
    cache_location: { type: [string, "null"], maxLength: 1024 }

ImportActionRequest:
  type: object
  additionalProperties: false
  properties:
    row_count: { type: [integer, "null"], minimum: 0 }
    file_count: { type: [integer, "null"], minimum: 0 }
    error_message:
      type: [string, "null"]
      maxLength: 2000
      description: |
        `action=fail` 时必填：失败留痕是 `docs/ddp/07` §5 的硬要求，
        不允许"失败了但不知道为什么"。

DataSourceImport:
  type: object
  required:
    [import_id, project_id, data_source_id, status, scope, tool_name, tool_version,
     version, allowed_actions]
  properties:
    import_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    data_source_id: { type: string, format: uuid }
    status: { $ref: "../openapi.yaml#/components/schemas/ImportStatus" }
    scope: { $ref: "../openapi.yaml#/components/schemas/ImportScope" }
    tool_name: { type: string }
    tool_version: { type: string }
    sample_limit: { type: [integer, "null"] }
    cache_location: { type: [string, "null"] }
    imported_row_count: { type: [integer, "null"] }
    imported_file_count: { type: [integer, "null"] }
    error_message: { type: [string, "null"] }
    started_at: { type: [string, "null"], format: date-time }
    finished_at: { type: [string, "null"], format: date-time }
    version: { type: integer, minimum: 1 }
    allowed_actions:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ImportAction" }
      description: 服务端计算的可执行动作；前端只按此渲染按钮。

DataSourceImportPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/DataSourceImport" }
    next_cursor: { type: [string, "null"] }

# ---------------------------------------------------------------------------
# 审看与质量报告（阶段 7 第二批：补上前一批漏登记的 6 个端点所需模型）
#
# 这些模型在实现侧早已存在（backend/app/api/v1/datasource_schemas.py 的
# MediaAssetOut / MediaAssetPlaybackOut / ReviewCreateOut / QualityReportOut），
# 只是契约没登记。字段以**实现的实际序列化结果**为准——不是反过来让实现
# 去迁就一份凭空写的契约。
# ---------------------------------------------------------------------------

MediaAsset:
  type: object
  required:
    - asset_id
    - project_id
    - data_source_id
    - import_id
    - episode_key
    - path
    - camera
    - object_key
    - size_bytes
    - sha256
    - content_type
    - task_name
    - created_at
  additionalProperties: false
  properties:
    asset_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    data_source_id: { type: string, format: uuid }
    import_id: { type: string, format: uuid }
    episode_key:
      type: string
      minLength: 1
      description: 数据集内的 episode 标识（LeRobot 的 example_id 聚合结果）。
    path:
      type: string
      minLength: 1
      description: 数据集内的相对路径，用于回溯原始文件。
    camera:
      type: string
      minLength: 1
      description: 机位标识，如 main / right / stereo / wrist_left / wrist_right。
    object_key:
      type: string
      minLength: 1
      description: 对象存储内的键；客户端不得据此自行拼接访问地址。
    size_bytes: { type: integer, minimum: 0 }
    sha256:
      type: string
      description: 形如 `sha256:<hex>`；与官方校验清单可直接比对。
    content_type: { type: string, minLength: 1 }
    task_name: { type: string }
    excerpt_start_seconds: { type: [number, "null"], minimum: 0 }
    excerpt_seconds: { type: [number, "null"], minimum: 0 }
    source_fps: { type: [number, "null"], exclusiveMinimum: 0 }
    created_at: { type: string, format: date-time }

MediaAssetList:
  type: object
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/MediaAsset" }

MediaAssetPlayback:
  type: object
  required: [asset_id, url, expires_in_seconds, content_type, size_bytes]
  additionalProperties: false
  properties:
    asset_id: { type: string, format: uuid }
    url:
      type: string
      minLength: 1
      description: 服务端签发的短时预签名 URL；有效期见 expires_in_seconds。
    expires_in_seconds: { type: integer, minimum: 1 }
    content_type: { type: string, minLength: 1 }
    size_bytes: { type: integer, minimum: 0 }

DataReview:
  type: object
  required:
    - review_id
    - project_id
    - import_id
    - status
    - submitted_by
    - created_at
    - version
  additionalProperties: false
  properties:
    review_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    import_id: { type: string, format: uuid }
    status: { type: string, minLength: 1 }
    decision: { type: [string, "null"] }
    reason: { type: [string, "null"], maxLength: 2000 }
    reviewer_id: { type: [string, "null"], format: uuid }
    submitted_by: { type: string, format: uuid }
    created_at: { type: string, format: date-time }
    decided_at: { type: [string, "null"], format: date-time }
    version: { type: integer, minimum: 1 }

ReviewDecisionRequest:
  type: object
  required: [decision]
  additionalProperties: false
  properties:
    decision:
      type: string
      enum: [ACCEPT, REJECT, NEEDS_FIX]
    reason: { type: [string, "null"], maxLength: 2000 }

ImportQualityFinding:
  type: object
  required: [rule_id, passed, detail]
  additionalProperties: false
  properties:
    rule_id: { type: string, minLength: 1 }
    passed: { type: boolean }
    detail: { type: string }

# 注意与数据集域的 `QualityReport`（schemas/quality-report.v1.schema.json）
# 区分：那个按 dataset_version 组织、含拆分与泄漏检查；本模型按导入任务组织、
# 只有规则通过率。同名不同物会误导客户端，故加 Import 前缀。
ImportQualityReport:
  type: object
  required:
    - import_id
    - rule_version
    - sample_scope
    - total_assets
    - total_episodes
    - passed
    - findings
    - failures
  additionalProperties: false
  properties:
    import_id: { type: string, format: uuid }
    rule_version: { type: string, minLength: 1 }
    sample_scope:
      type: string
      minLength: 1
      description: 质量结论覆盖的样本范围（SAMPLE / SPLIT / FULL），与导入任务一致。
    total_assets: { type: integer, minimum: 0 }
    total_episodes: { type: integer, minimum: 0 }
    passed: { type: boolean }
    findings:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ImportQualityFinding" }
    failures:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ImportQualityFinding" }

ImportEpisodeMaterializeRequest:
  type: object
  additionalProperties: false
  description: |
    可选场景标签；其余语义字段（任务名、指令、时间范围、机位集合）全部由
    导入产物推导，不接受客户端覆盖——否则同一份导入能生成出不同 Episode。
  properties:
    scene_labels:
      type: array
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 100 }

ImportEpisodeMaterializeResult:
  type: object
  required: [import_id, episode_count, episodes, skipped_episode_keys]
  additionalProperties: false
  properties:
    import_id: { type: string, format: uuid }
    episode_count: { type: integer, minimum: 0 }
    episodes:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/MaterializedEpisode" }
    skipped_episode_keys:
      type: array
      uniqueItems: true
      description: 已存在而同 Episode code 被跳过的 episode_key（幂等重试时非空）。
      items: { type: string, minLength: 1 }
