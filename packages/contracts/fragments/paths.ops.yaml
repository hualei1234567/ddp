# V4.1 FR-042 运行态运维路径片段（只读聚合视图）。

opsDispatchQueue:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: getOpsDispatchQueue
    tags: [ops]
    summary: 投递队列健康快照（积压 / 重试 / 失败分布）
    description: |
      只读聚合：一次查询给出本项目投递类事件（`dispatch=true`）的状态分布、
      重试中数量、最老待处理事件年龄、是否疑似停滞，以及按事件类型聚合的
      失败计数。不返回任何事件 payload——运维视图只回答"有没有东西卡住"。

      `oldest_pending_age_seconds` 在无待处理事件时返回 `null`（不是 `0`）：
      0 会被误读成"刚刚卡住"。`stale` 是服务端派生的结论，客户端不必自己
      比时间。留痕类事件（`dispatch=false`，写入即终态）不计入本口径。

      权限为项目负责人口径（owner 或平台管理员）：队列健康暴露系统内部失败
      模式，属于运维信息。本端点只读，清理/重投必须走 Worker 运维流程。
    responses:
      "200":
        description: 投递队列健康快照
        content:
          application/json:
            schema: {$ref: "../openapi.yaml#/components/schemas/OpsDispatchQueueSnapshot"}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}

# V52-010 Token 成本台账（蓝图 N6）：与 dispatch-queue 同为 owner 口径运维视图。
# 本 fragment 只声明路径与 schema；openapi.yaml 的 version 与 paths 引用由主控
# 统一处理（本轮不 bump version）。金额字段全部用字符串（十进制），货币值经
# JSON 双精度会丢精度（MEM-INC-008 同族问题）。
opsTokenLedger:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: getOpsTokenLedger
    tags: [ops]
    summary: Token 成本台账（按模型/用途聚合的调用、tokens 与成本）
    description: |
      只读聚合：按 `(model_id, purpose)` 切分本项目 LLM 调用次数、输入/输出
      token 合计与折算成本。计量行由登记 AI 建议时的可选 `usage` 条目写入
      （`POST .../ai-suggestions` 的 `usage` 字段）；无计量数据的模型/用途
      不会出现在本响应里。

      `cost_estimate` 为 `null` 表示该模型**未配置价格**（部署配置
      `DDP_AI_TOKEN_PRICE_MAP`），不是免费（0）：漏配与免费语义分开，
      客户端必须把 `null` 渲染成"无价格数据"。金额是十进制字符串
      （4 位小数，USD）；`cost_estimated_tokens` 只含有价可算部分的 token，
      未配价模型的 tokens 不计入成本合计但照常统计调用次数。

      权限为项目负责人口径（owner 或平台管理员）：成本暴露供应商账单折算
      与 ROI 时薪口径，属企业内部信息。本端点只读，不提供任何写操作。
    responses:
      "200":
        description: Token 成本台账快照
        content:
          application/json:
            schema: {$ref: "../openapi.yaml#/components/schemas/TokenCostLedger"}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}

# --- Token 预算评估（V61-019，蓝图 N6；owner / 平台管理员） ---
opsTokenBudget:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: monthly_tokens
      in: query
      required: false
      schema: {type: integer, minimum: 1}
      description: 月度 token 上限；不传表示该维度不设预算
    - name: total_tokens
      in: query
      required: false
      schema: {type: integer, minimum: 1}
      description: 项目累计 token 上限；不传表示该维度不设预算
    - name: monthly_cost_usd
      in: query
      required: false
      schema: {type: string, pattern: "^[0-9]+(\\.[0-9]+)?$"}
      description: 月度成本上限（USD 十进制字符串，> 0）；
        用字符串避免 JSON 双精度丢精度
    - name: total_cost_usd
      in: query
      required: false
      schema: {type: string, pattern: "^[0-9]+(\\.[0-9]+)?$"}
      description: 项目累计成本上限（USD 十进制字符串，> 0）
    - name: warning_ratio
      in: query
      required: false
      schema: {type: number, exclusiveMinimum: 0, maximum: 1}
      description: 预警比例，默认 0.8；用量达到 limit × ratio 即 WARNING
  get:
    operationId: getOpsTokenBudget
    tags: [ops]
    summary: Token 预算评估（按查询参数传入上限，只读判定）
    description: |
      用当前台账合计与调用方传入的预算上限做**只读**判定，不落库、不缓存。
      预算随项目与季度变化，因此走查询参数而不是部署配置——固化进配置会让
      "改预算"变成"重新部署"。

      **三条语义必须照实渲染**：

      1. `UNLIMITED` ≠ `OK`：某维度没设上限是"没有预算"，不是"在预算内"；
      2. `UNKNOWN` ≠ `0`：用量无数据（如全项目未配价）时不判超限，也不告警；
      3. `WARNING` 从 `usage ≥ limit × warning_ratio` 开始，**等于上限仍是
         WARNING**，只有严格超过才是 `EXCEEDED`。

      权限与成本台账一致（owner / 平台管理员）。`breached_dimensions` 可
      直接作为告警去重键。
    responses:
      "200":
        description: 预算评估结论
        content:
          application/json:
            schema: {$ref: "../openapi.yaml#/components/schemas/TokenBudgetEvaluation"}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}


# --- 评测失败案例回流（V52-030，蓝图 N5 / G5） ---
annotationBackflow:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  post:
    operationId: ingestAnnotationBackflow
    tags: [annotation-backflow]
    summary: 受理一批评测失败案例（幂等：同 source+case_ref 重复不报错）
    description: |
      评测平台把模型失败案例推回来，平台判定「受理 / 重复跳过 / 超限拒绝」后
      落库为回流案例；可选 `conversion` 块把本批受理案例合并成**一个**标注任务
      （`code=BACKFLOW-<UTC 时间>-<短哈希>`），任务描述记录案例清单。

      幂等语义：同一 `(source, case_ref)` 重发不报错，判为
      `DUPLICATE_SKIPPED`（回调重试是常态，MEM-INC-001）。限流按 `source`
      独立计数（近 1 小时已受理数 + 本批受理数 ≥ `limit` 时拒绝超出部分，
      其余 source 不受影响）。并发双写撞唯一键时整批不落库并返回 409，
      调用方可安全重试。

      转换目标（`sample_set_id` / `schema_id`）是项目侧既有配置，不由回调方
      提供；缺省时案例停在 `RECEIVED`，由运营经列表端点确认后转换。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AnnotationBackflowIngest" }
    responses:
      "200":
        description: 批次受理结果（逐条判定，与入参顺序一致）
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AnnotationBackflowIngestResult" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  get:
    operationId: listAnnotationBackflow
    tags: [annotation-backflow]
    summary: 回流案例列表（按接收时间倒序）
    description: |
      运营视图：返回案例状态（`RECEIVED` / `CONVERTED` /
      `SKIPPED_DUPLICATE` / `RATE_LIMITED`）、映射优先级与任务引用。
      `limit` 上限 200，非法取值返回 422。权限为 owner 口径。
    parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        description: 返回条数上限；非法取值返回 422，不静默截断。
    responses:
      "200":
        description: 回流案例列表
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AnnotationBackflowCasePage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
# V52-008 黄金题熔断接线（蓝图 N3 阶段 2）：派单准入治理端点，owner 口径。
# 按 MEM-INC-017 三步自查：路径级 parameters 显式声明 {annotator_id} →
# AnnotatorId 组件定义在 components.yaml 的 parameters: 段 → fragment 内
# $ref 相对基准是本目录（../openapi.yaml#/...）。
annotationHoneypotResume:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/AnnotatorId"
  post:
    operationId: resumeAnnotationHoneypot
    tags: [annotation-quality]
    summary: 解除标注员的黄金题熔断暂停（清窗口回 NORMAL）
    description: |
      黄金题熔断接线（V52-008，蓝图 N3）：标注员黄金题准确率连续 2 个
      满窗口低于 85% 时，系统自动 PAUSED 并拦截新派单（只挡新分配，
      不收回已有分配）。本端点由项目负责人手动解除暂停：状态回 NORMAL
      并清空滑窗，从空窗口重新累计；不回放历史命中，也不改动已有
      分配、提交与结算记录。

      幂等：重复解除不是错误（本就 NORMAL 时返回 `resumed=false`）。
      `resumed=false` 的三种情形都返回 200：熔断开关关闭
      （`DDP_HONEYPOT_BREAKER_ENABLED=false`，状态行不写、派单不查）；
      该标注员无状态行（从未熔断）；本就 NORMAL。客户端按 `state`
      渲染，不要把 `resumed=false` 当失败。

      权限为项目负责人口径（owner 或平台管理员）：解除暂停改变派单
      准入与结算冻结口径，是治理动作。
    responses:
      "200":
        description: 解除后的熔断状态快照
        content:
          application/json:
            schema: {$ref: "../openapi.yaml#/components/schemas/HoneypotResumeResult"}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}

# V52-031 G6 语义近似去重（蓝图 N1 训练集防污染）：只读能力。
# 生产 PostgreSQL 未装 pgvector，默认后端恒为 TRIGRAM（pg_trgm）；VECTOR 仅接口预留。
annotationDedup:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: getAnnotationDedupStatus
    tags: [annotation-dedup]
    summary: 语义近似去重能力状态（后端可用性、阈值、候选窗口）
    description: |
      蓝图 G6 语义近似去重（N1 训练集防污染）的**只读**能力状态。

      生产 PostgreSQL 16.16 未安装 pgvector，默认后端恒为 `TRIGRAM`
      （`pg_trgm` 扩展 + GIN 三元组索引；SQLite 集成测试走纯 Python 兜底）。
      `VECTOR` 后端只保留接口：`available=false` 且给出原因
      （`extension_missing` 扩展缺失 / `not_implemented` 代码未实现），
      **不提供向量能力**，客户端不得据此认为语义向量检索可用。

      权限按 READ 校验（viewer 可读）。
    responses:
      "200":
        description: 能力状态（后端可用性、生效阈值、有界候选窗口）
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AnnotationDedupStatus" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
  post:
    operationId: queryAnnotationDedup
    tags: [annotation-dedup]
    summary: 查询一段文本在项目内的近似重复样本（只读，不落库）
    description: |
      给一段文本（1..2000 字符），在项目内既有样本文本
      （`episodes.language_instruction`）中查近似重复。

      语义：对候选窗口内（默认 200，最大 500）的样本重算**字符 3-gram
      Jaccard 相似度**，`score >= threshold` 命中（含边界），按分数降序返回。
      本端点**只读**：不写库、不删数据、不修改去重结论的持久状态。

      实现分派：PostgreSQL 用 `pg_trgm` 的 GIN 索引 + `similarity()` 做有界
      索引扫描（`text_digest` B-tree 负责完全重复精确命中）；SQLite 用纯
      Python 兜底。两条路径的最终分数都由领域纯函数重算，阈值语义一致。
      候选窗口有界是**能力边界**：窗口外的样本不参与比较（禁止全表扫描）。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AnnotationDedupQuery" }
    responses:
      "200":
        description: 近似重复查询结论（命中候选按分数降序）
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AnnotationDedupResult" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }

# --- 数据集版本对比（阶段 5 / 治理闭环） ---
datasetVersionCompare:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/DatasetId"
    - $ref: "../openapi.yaml#/components/parameters/BaselineVersionId"
    - $ref: "../openapi.yaml#/components/parameters/CandidateVersionId"
  get:
    operationId: compareDatasetVersions
    tags: [dataset-versions]
    summary: 对比同一数据集的两个版本
    description: |
      对比两个数据集版本的：条目级差异（新增/删除/共同，按条目内容指纹）、
      统计变化、策略指纹变化（去重/切分/泄漏防护/质检）。

      条目对比有上限（默认 10000）：超限返回 `item_comparison_truncated=true`，
      计数是部分值而非全量，**不静默截断**。只输出差异计数与样例（≤5 条），
      不逐条输出全量条目。

      两个版本必须属于同一数据集，否则 404。
    parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 100000, default: 10000 }
        description: 条目对比上限；非法取值返回 422。
    responses:
      "200":
        description: 版本对比结果
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/VersionComparison" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
# --- Webhook 订阅（阶段 5 / 蓝图 N5 生态对接） ---
webhookSubscription:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  post:
    operationId: createWebhookSubscription
    tags: [webhook]
    summary: 创建 Webhook 订阅（secret 仅本次响应返回一次）
    description: |
      为项目注册一个事件订阅。`secret` 明文**仅在创建响应里返回一次**，
      之后只存 SHA-256 哈希；投递时用该密钥做 HMAC-SHA256 签名
      （`X-DDP-Signature: sha256=...` + `X-DDP-Timestamp`），下游据此验签。

      URL 只接受 https 或**本机** http（防误配把数据推到外部地址）。
      同一项目同一 URL 只允许一份订阅（重复返回 409）。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/WebhookSubscriptionCreate" }
    responses:
      "201":
        description: 创建成功（响应含明文 secret，仅此一次）
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WebhookSubscriptionCreated" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
  get:
    operationId: listWebhookSubscriptions
    tags: [webhook]
    summary: 列出项目的 Webhook 订阅（不含任何 secret）
    description: |
      订阅视图**不含**明文 secret 也**不含**哈希——两者都不对外暴露。
      `status` 为 ACTIVE / PAUSED；连续投递失败达阈值自动 PAUSED，
      成功投递后自动恢复 ACTIVE。
    responses:
      "200":
        description: 订阅列表
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WebhookSubscriptionPage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }

webhookSubscriptionDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/SubscriptionId"
  delete:
    operationId: deleteWebhookSubscription
    tags: [webhook]
    summary: 删除 Webhook 订阅
    description: 删除订阅后该地址不再收到事件投递。删除是幂等的。
    responses:
      "204": { description: 删除成功 }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
