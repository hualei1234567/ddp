    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/CollectionSopId"
  get:
    operationId: getCollectionSop
    tags: [collection-assets]
    summary: SOP 详情
    responses:
      "200":
