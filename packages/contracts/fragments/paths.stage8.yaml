# 阶段 8（N8 真实采集与设备集成）路径片段。
# 仅声明 backend/app/api/v1/collection_asset_routes.py 实际实现的端点（12 个操作）。
#
# 范围说明：四类采集素材实体（方案 / SOP / 场景 / 动作库）的
# 「创建 / 列表 / 详情 / 更新 / 状态迁移 / 删除」。状态机为
# `DRAFT --activate--> ACTIVE --archive--> ARCHIVED`（终态），
# 因此 `ACTIVE` / `ARCHIVED` 由 `/actions/{action}` 到达。
#
# 更新与删除的字段可变性规则见 fragments/../docs 与
# backend/app/domain/collection/asset_lifecycle.py（唯一权威实现）。

collectionPlans:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listCollectionPlans
    tags: [collection-assets]
    summary: 采集方案列表
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Stage4Limit"
    responses:
      "200":
        description: 采集方案分页
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CollectionPlanPage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    operationId: createCollectionPlan
    tags: [collection-assets]
    summary: 创建采集方案
    description: |
      `status` 不是请求字段：服务端固定初始化为 `DRAFT`。客户端不能提交
      `project_id` / `version` / 审计字段。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/CollectionPlanCreate" }
    responses:
      "201":
        description: 已创建
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CollectionPlan" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

collectionPlanDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/CollectionPlanId"
  get:
    operationId: getCollectionPlan
    tags: [collection-assets]
    summary: 采集方案详情
    responses:
      "200":
        description: 采集方案
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CollectionPlan" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  patch:
    operationId: updateCollectionPlan
    tags: [collection-assets]
    summary: 更新采集方案
    description: |
      只允许改 `name` / `description`。`code` 是业务标识、`plan_version` 是版本锚点，
      均不可改。
      
      `DRAFT` 与 `ACTIVE` 都可改：任务不冻结素材名称，只冻结版本列，改名不会让
      任何任务的快照失真。`ARCHIVED` 一律不可改——终态即「只作为历史事实存在」。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/CollectionPlanPatch" }
    responses:
      "200":
        description: 更新后的采集方案
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CollectionPlan" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "428": { $ref: "../openapi.yaml#/components/responses/PreconditionRequired" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  delete:
    operationId: deleteCollectionPlan
    tags: [collection-assets]
    summary: 删除采集方案
    description: |
      素材必须处于 `DRAFT` 且未被采集任务引用才可删除。
      
      - `ACTIVE` 可能正被新任务挑选，不允许删；
      - `ARCHIVED` 是历史任务版本快照的事实载体，不允许删；
      - 被任务引用时数据库复合外键会拒绝，应用层先查引用并返回可读错误
        （`resource_immutable`），不把 SQL 原文透出。
      
      硬删而非软删：删除前已确认无引用，且删除动作写审计（`action=delete`）。
      再加 `deleted_at` 会让「这个 ID 还在不在」出现第三种答案。
    responses:
      "204": { description: 已删除（无响应体） }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
