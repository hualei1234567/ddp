      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  patch:
    operationId: updateCollectionSop
    tags: [collection-assets]
    summary: 更新SOP
    description: |
      只允许改 `name` / `description`。`steps` **在任何状态下都不开放修改**（连
      `DRAFT` 也不）：任务的版本一致性校验只比对被引用那一行自身的版本列，原地改
      步骤而不改版本号，会让冻结的 v1 快照指向已被改写的定义。内容变更的合法路径
      是**新增版本行**（`(project_id, code, sop_version)` 唯一约束即为此设计）。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/CollectionSopPatch" }
    responses:
      "200":
        description: 更新后的SOP
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CollectionSop" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "428": { $ref: "../openapi.yaml#/components/responses/PreconditionRequired" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  delete:
    operationId: deleteCollectionSop
    tags: [collection-assets]
    summary: 删除SOP
    description: |
      素材必须处于 `DRAFT` 且未被采集任务引用才可删除。
      
