# ---------------------------------------------------------------------------
# N4 标注质量检查（backend/app/api/v1/annotation_quality_check_routes.py）
# ---------------------------------------------------------------------------

submissionQualityChecks:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/SubmissionId"
  post:
    operationId: runAnnotationQualityCheck
    tags: [annotation-quality]
    summary: 对一条标注提交执行质量检查
    description: |
      每次都产生一个新的 run（结论只追加、不改写）。`passed` 是三态：
      `true` 合规、`false` 违规、`null` 表示该规则对这条记录**没有结论**
      （缺 Episode 边界、任务未配阈值）。客户端不得把 `null` 渲染成"通过"。

      **刻意不支持 `Idempotency-Key`**：每次执行都会新增一条 run 记录，
      这是审计事实，重放一条已存在的 run 反而会掩盖"又跑了一次"。
      需要「已检查过」的判断请查 `GET .../quality-checks` 历史，而不是靠幂等键。
    responses:
      "201":
        description: 本次检查结果
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/QualityCheckRun" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  get:
    operationId: listAnnotationQualityChecks
    tags: [annotation-quality]
    summary: 该提交的质量检查历史
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Stage4Limit"
    responses:
      "200":
        description: 检查记录分页
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/QualityCheckRunPage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
