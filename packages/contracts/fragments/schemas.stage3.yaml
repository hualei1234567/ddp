# 标注 Schema 预设模板（N6-001）：只读、代码级权威，不落库、不属于任何项目。
SchemaPreset:
  type: object
  required: [preset_key, name, description, version, annotation_levels, labels]
  properties:
    preset_key:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9-]*$"
      description: URL 路径安全的模板键。
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      minLength: 1
      maxLength: 2000
    version:
      type: string
      minLength: 1
      maxLength: 64
      description: 模板语义化版本；模板内容变化必须显式升级。
    annotation_levels:
      type: array
      minItems: 1
      uniqueItems: true
      items: {$ref: "#/AnnotationLevel"}
    labels:
      type: array
      minItems: 1
      description: |
        与 `AnnotationSchemaCreate.labels` 同形，可直接复制到创建请求后按项目需要覆盖；
        服务端仍会按既有 Schema 校验规则重新校验，预设不绕过任何规则。
      items: {$ref: "../schemas/annotation-schema.v1.schema.json#/$defs/LabelDefinitionOut"}

SchemaPresetCatalog:
  type: object
  required: [catalog_version, items]
  properties:
    catalog_version:
      type: string
      minLength: 1
      maxLength: 128
      description: 目录内容寻址摘要；任何模板定义变化都会改变该值。
    items:
      type: array
      items: {$ref: "#/SchemaPreset"}
