# 阶段 3 标注域 Schema 片段。
# 响应对象以 packages/contracts/schemas/*.json 为唯一来源；本文件只放
# 请求 DTO、分页包装与共享枚举，避免与后端实际响应重复维护。

AnnotationSchemaStatus:
  type: string
  enum: [DRAFT, PENDING_REVIEW, PUBLISHED, DEPRECATED, REVOKED]

AnnotationSampleSetStatus:
  type: string
  enum: [DRAFT, PREVIEW, SNAPSHOTTED, CONSUMED, CANCELLED]

AnnotationTaskStatus:
  type: string
  enum:
    - DRAFT
    - PENDING_REVIEW
    - APPROVED
    - READY
    - ASSIGNED
    - IN_PROGRESS
    - PAUSED
    - BLOCKED
    - SUBMITTED
    - REVIEWING
    - ARBITRATION
    - ACCEPTED
    - REJECTED
    - REWORK
    - COMPLETED
    - CANCELLED
    - ARCHIVED

AnnotationBatchStatus:
  type: string
  enum:
    - PLANNED
    - READY
    - ASSIGNED
    - IN_PROGRESS
    - PAUSED
    - BLOCKED
    - SUBMITTED
    - REVIEWING
    - ARBITRATION
    - ACCEPTED
    - REJECTED
    - REWORK
    - CANCELLED

AnnotationAssignmentStatus:
  type: string
  enum: [ASSIGNED, CLAIMED, IN_PROGRESS, SUBMITTED, COMPLETED, REVOKED, EXPIRED]

AnnotationSubmissionStatus:
  type: string
  enum:
    - DRAFT
    - SUBMITTED
    - IN_REVIEW
    - APPROVED
    - REJECTED
    - ESCALATED
    - ARBITRATING
    - RESOLVED_APPROVED
    - RESOLVED_REJECTED
    - RESOLVED_REWORK
    - REWORK_REQUIRED
    - WITHDRAWN
    - SUPERSEDED

AnnotationReviewStatus:
  type: string
  enum: [PENDING, IN_REVIEW, APPROVED, REJECTED, ESCALATED, CANCELLED]

AnnotationArbitrationStatus:
  type: string
  enum:
    - PENDING
    - IN_ARBITRATION
    - RESOLVED_APPROVED
    - RESOLVED_REJECTED
    - RESOLVED_REWORK
    - CANCELLED

GoldSetStatus:
  type: string
  enum: [DRAFT, PENDING_REVIEW, ACTIVE, RETIRED, REVOKED]

QualitySampleStatus:
  type: string
  enum:
    - PLANNED
    - SAMPLED
    - ASSIGNED
    - IN_REVIEW
    - PASSED
    - FAILED
    - ESCALATED
    - CLOSED
    - CANCELLED

IAAReportStatus:
  type: string
  enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, INSUFFICIENT_DATA, CANCELLED]

AnnotationLevel:
  type: string
  enum: [TASK, EPISODE, TIME_RANGE, ACTION_SEGMENT, FRAME, OBJECT_TRACK]

AnnotationSchemaCreate:
  type: object
  required: [code, name, annotation_levels, labels]
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    description: {type: [string, "null"], maxLength: 2000}
    annotation_levels:
      type: array
      minItems: 1
      uniqueItems: true
      items: {$ref: "#/AnnotationLevel"}
    labels:
      type: array
      minItems: 1
      items: {type: object, additionalProperties: true}
    compatibility: {type: string, enum: [BACKWARD_COMPATIBLE, BREAKING], default: BACKWARD_COMPATIBLE}
    schema_lineage_id: {type: [string, "null"], format: uuid}
    schema_version: {type: integer, minimum: 1, default: 1}
    supersedes_id: {type: [string, "null"], format: uuid}

AnnotationSchemaPatch:
  type: object
  additionalProperties: false
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    description: {type: [string, "null"], maxLength: 2000}
    annotation_levels:
      type: array
      minItems: 1
      uniqueItems: true
      items: {$ref: "#/AnnotationLevel"}
    labels:
      type: array
      minItems: 1
      items: {type: object, additionalProperties: true}
    compatibility: {type: string, enum: [BACKWARD_COMPATIBLE, BREAKING]}

AnnotationSchemaActionRequest:
  type: object
  additionalProperties: false
  properties:
    reason: {type: [string, "null"], maxLength: 2000}

SampleSetCreate:
  type: object
  required: [code]
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: [string, "null"], maxLength: 200}
    strategy: {type: string, enum: [FILTER, STRATIFIED, RISK_BASED, MANUAL], default: FILTER}
    selection_rule_version: {type: string, minLength: 1, maxLength: 64, default: stage3-sample-selection/1}
    filters: {type: object, additionalProperties: true, default: {}}
    strata: {type: array, items: {type: object, additionalProperties: true}, default: []}
    dedup_key: {type: string, enum: [EPISODE_LINEAGE, EPISODE_VERSION, NONE], default: EPISODE_LINEAGE}
    data_source: {type: string, enum: [REAL, SYNTHETIC, MIXED, UNKNOWN], default: UNKNOWN}
    warn_confirmed: {type: boolean, default: false}

SampleSetActionRequest:
  type: object
  additionalProperties: false
  properties:
    reason: {type: [string, "null"], maxLength: 2000}
    filters: {type: [object, "null"], additionalProperties: true}
    strata: {type: [array, "null"], items: {type: object, additionalProperties: true}}
    warn_confirmed: {type: boolean, default: false}

AnnotationTaskCreate:
  type: object
  required: [code, name, sample_set_id, schema_id, target_item_count, target_episode_count]
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 200}
    description: {type: [string, "null"], maxLength: 2000}
    sample_set_id: {type: string, format: uuid}
    schema_id: {type: string, format: uuid}
    schema_version: {type: [integer, "null"], minimum: 1}
    target_item_count: {type: integer, minimum: 1}
    target_episode_count: {type: integer, minimum: 1}
    due_at: {type: [string, "null"], format: date-time}
    priority: {type: string, enum: [P0, P1, P2, P3], default: P1}
    assignment_mode: {type: string, enum: [MANUAL, CLAIM, MIXED], default: MANUAL}
    iaa_policy:
      type: object
      additionalProperties: true
      default: {}
      description: >-
        任务级策略。除双标字段（review_mode / agreement_threshold /
        agreement_metric / auto_approve）外，可选 blind_review（布尔，默认
        false）。开启后服务端在读取该任务的提交与标注记录时，对标注人之外
        的读取者隐藏标签值：labels 只返回 label_key 与 redacted=true，
        不返回值、来源、置信度与备注；record_sha256 / records_digest 返回
        空串，避免成为枚举标签的校验预言机。
    quality_policy: {type: object, additionalProperties: true, default: {}}
    review_mode: {type: string, enum: [SINGLE, DOUBLE], default: SINGLE}
    agreement_threshold: {type: [number, "null"], minimum: 0, maximum: 1}
    auto_approve: {type: boolean, default: false}

AnnotationTaskPatch:
  type: object
  additionalProperties: false
  properties:
    description: {type: [string, "null"], maxLength: 2000}
    target_item_count: {type: [integer, "null"], minimum: 1}
    target_episode_count: {type: [integer, "null"], minimum: 1}
    due_at: {type: [string, "null"], format: date-time}
    priority: {type: string, enum: [P0, P1, P2, P3]}
    assignment_mode: {type: string, enum: [MANUAL, CLAIM, MIXED]}
    iaa_policy:
      type: [object, "null"]
      additionalProperties: true
      description: >-
        同创建；blind_review 为可选布尔字段（默认 false），开启后服务端
        对非标注人隐藏标签值。
    quality_policy: {type: [object, "null"], additionalProperties: true}

AnnotationTaskActionRequest:
  type: object
  additionalProperties: false
  properties:
    reason: {type: [string, "null"], maxLength: 2000}
    waiver_reason: {type: [string, "null"], maxLength: 2000}

AnnotationBatchCreate:
  type: object
  required: [planned_item_count]
  additionalProperties: false
  properties:
    planned_item_count: {type: integer, minimum: 0}
    code: {type: [string, "null"], maxLength: 64}
    sequence_no: {type: [integer, "null"], minimum: 1}
    name: {type: [string, "null"], maxLength: 200}
    stratum: {type: [string, "null"], maxLength: 100}
    item_refs: {type: array, items: {type: string, format: uuid}, uniqueItems: true, default: []}
    due_at: {type: [string, "null"], format: date-time}

AnnotationBatchPatch:
  type: object
  additionalProperties: false
  properties:
    name: {type: [string, "null"], maxLength: 200}
    stratum: {type: [string, "null"], maxLength: 100}
    item_refs: {type: [array, "null"], items: {type: string, format: uuid}, uniqueItems: true}
    planned_item_count: {type: [integer, "null"], minimum: 0}
    due_at: {type: [string, "null"], format: date-time}

AnnotationBatchActionRequest:
  type: object
  additionalProperties: false
  properties:
    reason: {type: [string, "null"], maxLength: 2000}

AnnotationAssignmentCreate:
  type: object
  required: [batch_id, assignee_id]
  additionalProperties: false
  properties:
    batch_id: {type: string, format: uuid}
    assignee_id: {type: string, format: uuid}
    assignment_role: {type: string, enum: [ANNOTATOR, REVIEWER, ARBITER], default: ANNOTATOR}
    planned_item_count: {type: integer, minimum: 0, default: 0}
    planned_minutes: {type: integer, minimum: 0, default: 0}
    lease_expires_at: {type: [string, "null"], format: date-time}

AnnotationAssignmentActionRequest:
  type: object
  additionalProperties: false
  properties:
    reason: {type: [string, "null"], maxLength: 2000}
    actual_minutes: {type: [integer, "null"], minimum: 0}
    submitted_item_count: {type: [integer, "null"], minimum: 0}
    approved_item_count: {type: [integer, "null"], minimum: 0}

AnnotationSubmissionCreate:
