    assignment_id: {type: string, format: uuid}
    records:
      type: array
      minItems: 1
      items: {type: object, additionalProperties: true}
    data_source: {type: string, enum: [REAL, SYNTHETIC, MIXED, UNKNOWN], default: UNKNOWN}

AnnotationSubmissionActionRequest:
  type: object
  additionalProperties: false
  properties:
