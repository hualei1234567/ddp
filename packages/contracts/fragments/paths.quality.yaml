# N4-004：统一 Quality Engine 路径。
# 对应 backend/app/api/v1/quality_routes.py。
#
# 一次 POST 同步执行适用的既有规则（导入 / 标注；数据集规则源已注册但
# 本批次不开放入口），落一条只追加的运行与结论明细。规则实现不在这里，
# 也不在 application/quality 里重写——本模块只编排与分层。

qualityRuns:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listQualityRuns
    tags: [quality]
    summary: 按对象列举历史质量运行
    description: |
      按 `subject_type` + `subject_id` 列出该对象的历史运行，**创建时间倒序**
      （同一时间按 `run_id` 倒序，等价于 UUIDv7 创建顺序），游标分页。
      游标取上一页最后一条的 `run_id`；游标只对同一组查询参数有效。

      服务端强制项目隔离；`subject_type` / `subject_id` 必填，未知
      `subject_type` 返回 422 `validation_failed`。对象不存在或跨项目返回
      **空页**而不是 404：列表过滤没有可定位的单条资源，也不能用状态码
      差异探测其他项目的对象。

      本接口只读，不触发检查、不改变历史结论；`DATASET_VERSION` 可被列举，
      但这不代表 `POST` 已开放该对象的检查入口。
    parameters:
      - name: subject_type
        in: query
        required: true
        schema: { $ref: "../openapi.yaml#/components/schemas/QualitySubjectType" }
      - name: subject_id
        in: query
        required: true
        schema: { type: string, format: uuid }
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: 历史运行分页（空对象为空数组）
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/QualityRunPage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    operationId: createQualityRun
    tags: [quality]
    summary: 对 Episode 或导入任务执行统一质量检查
    description: |
      服务端解析对象并强制项目隔离：对象不存在或跨项目返回 404
      `resource_not_found`；未知类别/对象类型返回 422 `validation_failed`。

      运行只追加：重复调用产生新的 run，不覆盖历史结论。响应中的
      `rule_set_version` 是本次适用规则声明的内容 SHA；每条 finding 另带
      `rule_version`，用于解释"当时用的是哪一版规则"。

      批量/自动的 Episode 质检不在本批次范围，客户端需显式指定单个对象。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/QualityRunCreate" }
    responses:
      "201":
        description: 已完成的质量运行
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/QualityRun" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

qualityRunDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: getQualityRun
    tags: [quality]
    summary: 质量运行详情（六类聚合）
    description: |
      运行不存在或跨项目返回 404。`categories` 六类始终齐全；没有结论的
      类别为 `NOT_APPLICABLE`，`score` 为 null，客户端不得渲染成通过。
    responses:
      "200":
        description: 质量运行
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/QualityRun" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

qualityRunFindings:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: listQualityFindings
    tags: [quality]
    summary: 质量运行结论明细
    description: |
      按游标分页；可按 `category` / `status` 过滤。`category=OVERALL` 返回空
      列表（OVERALL 是聚合结果，不是落库结论）。运行不存在或跨项目返回 404。
    parameters:
      - name: category
        in: query
        required: false
        schema: { $ref: "../openapi.yaml#/components/schemas/QualityCategory" }
      - name: status
        in: query
        required: false
        schema: { $ref: "../openapi.yaml#/components/schemas/QualityFindingStatus" }
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: 结论明细分页
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/QualityRunFindingPage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

qualityRunBatch:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  post:
    operationId: rerunQualityRunsBatch
    tags: [quality]
    summary: 批量重跑（为一组 Episode 各排一次质检）
    description: |
      与 `POST /quality-runs` 的区别只有执行时机：本端点**只入队**，由质检
      Worker 领取执行；单次端点仍在请求线程里同步算完。响应是排队中的运行
      列表（`lifecycle=QUEUED`），**没有结论**——调用方不得把缺省 `status`
      读成"检查通过"。

      只接受 `EPISODE`：导入任务的批量重跑没有业务场景。空列表、重复对象、
      超过 1000 个对象返回 422 `validation_failed`；整批在同一事务里入队，
      不存在"排了一半"的中间态。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/QualityRunBatchCreate" }
    responses:
      "201":
        description: 已入队的运行（无结论）
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../openapi.yaml#/components/schemas/QueuedQualityRun" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

qualityRunDiff:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: baseline_run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: candidate_run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: compareQualityRuns
    tags: [quality]
    summary: 两次质量运行的差异报告
    description: |
      按 `rule_id + subject_ref` 对齐两次运行的结论，逐条分类为
      `NEW` / `RESOLVED` / `UNCHANGED` / `CHANGED`。`subject_ref` 区分同一
      规则作用于多个对象，只用 `rule_id` 会把"记录 A 通过、记录 B 失败"
      错算成规则状态变化。

      两次运行必须检查**同一对象**，否则返回 422 `validation_failed`；
      任一运行未产出结论（`lifecycle != SUCCEEDED`）同样拒绝——没有可信
      结论就没有可比性。运行不存在或跨项目返回 404。

      `has_regression` 只把 `NEW` 算作回归：`CHANGED` 可能是修好也可能是
      变坏，需要看具体状态。
    responses:
      "200":
        description: 差异报告
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/QualityRunDiff" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
