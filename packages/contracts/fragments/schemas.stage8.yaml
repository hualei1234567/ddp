# --- N8：写路径请求体 -------------------------------------------------------
# 全部字段可选、`additionalProperties: false`：PATCH 语义是「只改提交的字段」，
# 未知字段直接 422 而不是被静默忽略。显式 `null` 与「未提交」语义不同
# （前者清空 `description`，后者不动），因此 `description` 允许 null。

CollectionPlanPatch:
  type: object
  additionalProperties: false
  description: |
    `code` / `plan_version` 不可改：前者是业务标识，后者标识内容版本。
    目标与阈值是计划元数据，可改；显式 `null` 表示清空（阈值清空为 `{}`）。
    `ARCHIVED` 状态下不允许任何修改。
  properties:
    name: { type: string, minLength: 1, maxLength: 200 }
    description: { type: [string, "null"], maxLength: 2000 }
    target_episode_count: { type: [integer, "null"], minimum: 0 }
    quality_thresholds:
      type: [object, "null"]
      propertyNames:
        enum: [min_selected_count, max_duplicated_count, min_total_duration_ns, max_blocking_issue_count, max_warning_count]
      additionalProperties:
        type: number
        minimum: 0

CollectionSopPatch:
  type: object
  additionalProperties: false
  description: |
    `steps` 不可改：执行内容变更必须新增版本行，否则任务冻结的版本快照会与
    行内容脱节。`ARCHIVED` 状态下不允许任何修改。
  properties:
    name: { type: string, minLength: 1, maxLength: 200 }
    description: { type: [string, "null"], maxLength: 2000 }

ScenarioPatch:
  type: object
  additionalProperties: false
  description: |
    场景不版本化，故 `scene_labels` 可改。标签由服务端保序去重。
    `ARCHIVED` 状态下不允许任何修改。
  properties:
    name: { type: string, minLength: 1, maxLength: 200 }
    description: { type: [string, "null"], maxLength: 2000 }
    scene_labels:
      type: array
      maxItems: 32
      items: { type: string, minLength: 1, maxLength: 64 }

ActionSpecPatch:
  type: object
  additionalProperties: false
  description: |
    `actions` 不可改：执行内容变更必须新增版本行，理由同 `CollectionSopPatch`。
    `ARCHIVED` 状态下不允许任何修改。
  properties:
    name: { type: string, minLength: 1, maxLength: 200 }
    description: { type: [string, "null"], maxLength: 2000 }

CollectionAssetActionRequest:
  type: object
  additionalProperties: false
  description: |
    状态动作请求体。整个 body 可选；`reason` 不强制（素材动作不同于审批类动作，
    不要求填写原因）。提交时写入审计记录。
  properties:
    reason: { type: [string, "null"], maxLength: 1000 }
