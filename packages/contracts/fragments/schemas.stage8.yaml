# 阶段 8（N8 真实采集与设备集成）Schema 片段。
# 对应 backend/app/api/v1/collection_asset_schemas.py。
#
# 四类素材共用一套状态取值（DRAFT / ACTIVE / ARCHIVED）与审计字段，
# 差异只在各自的版本列（plan_version / sop_version / spec_version）。
# 本批无更新与删除端点，因此状态恒为 DRAFT。

CollectionAssetStatus:
  type: string
  enum: [DRAFT, ACTIVE, ARCHIVED]
  description: |
    四类采集素材共用的生命周期状态。本批只有创建端点、没有状态迁移端点，
    因此实现上取值恒为 `DRAFT`；`ACTIVE` / `ARCHIVED` 为预留取值，
    在迁移端点落地前不可到达。

CollectionPlan:
  type: object
  required: [plan_id, project_id, code, name, plan_version, status, version, created_at, created_by, updated_at, updated_by, description, owner_id]
  properties:
    plan_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    plan_version: { type: integer, minimum: 1 }
    status: { $ref: "../openapi.yaml#/components/schemas/CollectionAssetStatus" }
    description: { type: [string, "null"], maxLength: 2000 }
    owner_id: { type: [string, "null"], format: uuid }
    version: { type: integer, minimum: 1 }
    created_at: { type: [string, "null"], format: date-time }
    updated_at: { type: [string, "null"], format: date-time }
    created_by: { type: [string, "null"], format: uuid }
    updated_by: { type: [string, "null"], format: uuid }

CollectionPlanCreate:
  type: object
  additionalProperties: false
  required: [code, name]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    plan_version: { type: integer, minimum: 1, default: 1 }
    description: { type: [string, "null"], maxLength: 2000 }
    owner_id: { type: [string, "null"], format: uuid }

CollectionPlanPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/CollectionPlan" }
    next_cursor: { type: [string, "null"] }

CollectionSop:
  type: object
  required: [sop_id, project_id, code, name, sop_version, steps, status, version, created_at, created_by, updated_at, updated_by, description]
  properties:
    sop_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    sop_version: { type: string, minLength: 1, maxLength: 64 }
    steps:
      type: array
      items: { type: object, additionalProperties: true }
    status: { $ref: "../openapi.yaml#/components/schemas/CollectionAssetStatus" }
    description: { type: [string, "null"], maxLength: 2000 }
    version: { type: integer, minimum: 1 }
    created_at: { type: [string, "null"], format: date-time }
    updated_at: { type: [string, "null"], format: date-time }
    created_by: { type: [string, "null"], format: uuid }
    updated_by: { type: [string, "null"], format: uuid }

CollectionSopCreate:
  type: object
  additionalProperties: false
  required: [code, name, sop_version]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    sop_version: { type: string, minLength: 1, maxLength: 64 }
    steps:
      type: array
      items: { type: object, additionalProperties: true }
    description: { type: [string, "null"], maxLength: 2000 }

CollectionSopPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/CollectionSop" }
    next_cursor: { type: [string, "null"] }

Scenario:
  type: object
  required: [scenario_id, project_id, code, name, scene_labels, status, version, created_at, created_by, updated_at, updated_by, description]
  properties:
    scenario_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    scene_labels:
      type: array
      maxItems: 32
      items: { type: string, minLength: 1, maxLength: 64 }
    status: { $ref: "../openapi.yaml#/components/schemas/CollectionAssetStatus" }
    description: { type: [string, "null"], maxLength: 2000 }
    version: { type: integer, minimum: 1 }
    created_at: { type: [string, "null"], format: date-time }
    updated_at: { type: [string, "null"], format: date-time }
    created_by: { type: [string, "null"], format: uuid }
    updated_by: { type: [string, "null"], format: uuid }

ScenarioCreate:
  type: object
  additionalProperties: false
  required: [code, name]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    scene_labels:
      type: array
      maxItems: 32
      items: { type: string, minLength: 1, maxLength: 64 }
    description: { type: [string, "null"], maxLength: 2000 }

ScenarioPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/Scenario" }
    next_cursor: { type: [string, "null"] }

ActionSpec:
  type: object
  required: [action_spec_id, project_id, code, name, spec_version, actions, status, version, created_at, created_by, updated_at, updated_by, description]
  properties:
    action_spec_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    spec_version: { type: string, minLength: 1, maxLength: 64 }
    actions:
      type: array
      items: { type: object, additionalProperties: true }
    status: { $ref: "../openapi.yaml#/components/schemas/CollectionAssetStatus" }
    description: { type: [string, "null"], maxLength: 2000 }
    version: { type: integer, minimum: 1 }
    created_at: { type: [string, "null"], format: date-time }
    updated_at: { type: [string, "null"], format: date-time }
    created_by: { type: [string, "null"], format: uuid }
    updated_by: { type: [string, "null"], format: uuid }

ActionSpecCreate:
  type: object
  additionalProperties: false
  required: [code, name, spec_version]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    spec_version: { type: string, minLength: 1, maxLength: 64 }
    actions:
      type: array
      items: { type: object, additionalProperties: true }
    description: { type: [string, "null"], maxLength: 2000 }

ActionSpecPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ActionSpec" }
    next_cursor: { type: [string, "null"] }
