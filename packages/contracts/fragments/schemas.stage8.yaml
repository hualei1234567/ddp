# 阶段 8（N8 真实采集与设备集成）Schema 片段。
# 对应 backend/app/api/v1/collection_asset_schemas.py。
#
# 四类素材共用一套状态取值（DRAFT / ACTIVE / ARCHIVED）与审计字段，
# 差异只在各自的版本列（plan_version / sop_version / spec_version）。
# 本批无更新与删除端点，因此状态恒为 DRAFT。

CollectionAssetStatus:
  type: string
  enum: [DRAFT, ACTIVE, ARCHIVED]
  description: |
    四类采集素材共用的生命周期状态。本批只有创建端点、没有状态迁移端点，
    因此实现上取值恒为 `DRAFT`；`ACTIVE` / `ARCHIVED` 为预留取值，
    在迁移端点落地前不可到达。

CollectionPlan:
  type: object
  required: [plan_id, project_id, code, name, plan_version, status, version, created_at, created_by, updated_at, updated_by, description, owner_id, target_episode_count, quality_thresholds, allowed_actions]
  properties:
    plan_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    plan_version: { type: integer, minimum: 1 }
    status: { $ref: "../openapi.yaml#/components/schemas/CollectionAssetStatus" }
    description: { type: [string, "null"], maxLength: 2000 }
    owner_id: { type: [string, "null"], format: uuid }
    target_episode_count:
      type: [integer, "null"]
      minimum: 0
      description: |
        计划采集的 Episode 数；`null` 表示未设定目标（与 0 区分）。
        只是计划值，不是执行保证，也不构成自动验收依据。
    quality_thresholds:
      type: object
      description: |
        计划质量阈值；键只允许复用数据集需求匹配登记的阈值键，值必须是非负
        有限数。只是计划目标，不是执行保证，也不构成自动验收依据；实际是否
        达标由质量运行与人工审核结论判定。
      propertyNames:
        enum: [min_selected_count, max_duplicated_count, min_total_duration_ns, max_blocking_issue_count, max_warning_count]
      additionalProperties:
        type: number
        minimum: 0
    version: { type: integer, minimum: 1 }
    created_at: { type: [string, "null"], format: date-time }
    updated_at: { type: [string, "null"], format: date-time }
    created_by: { type: [string, "null"], format: uuid }
    updated_by: { type: [string, "null"], format: uuid }
    allowed_actions:
      type: array
      items: { type: string, enum: [activate, archive] }
      description: |
        当前状态下服务端允许的动作，供前端按此渲染按钮。
        `ARCHIVED` 为终态，返回空数组。与状态迁移校验同源计算。

CollectionPlanCreate:
  type: object
  additionalProperties: false
  required: [code, name]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    plan_version: { type: integer, minimum: 1, default: 1 }
    description: { type: [string, "null"], maxLength: 2000 }
    owner_id: { type: [string, "null"], format: uuid }
    target_episode_count: { type: [integer, "null"], minimum: 0 }
    quality_thresholds:
      type: object
      default: {}
      propertyNames:
        enum: [min_selected_count, max_duplicated_count, min_total_duration_ns, max_blocking_issue_count, max_warning_count]
      additionalProperties:
        type: number
        minimum: 0

CollectionPlanPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/CollectionPlan" }
    next_cursor: { type: [string, "null"] }

CollectionSop:
  type: object
  required: [sop_id, project_id, code, name, sop_version, steps, status, version, created_at, created_by, updated_at, updated_by, description, allowed_actions]
  properties:
    sop_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    sop_version: { type: string, minLength: 1, maxLength: 64 }
    steps:
      type: array
      items: { type: object, additionalProperties: true }
    status: { $ref: "../openapi.yaml#/components/schemas/CollectionAssetStatus" }
    description: { type: [string, "null"], maxLength: 2000 }
    version: { type: integer, minimum: 1 }
    created_at: { type: [string, "null"], format: date-time }
    updated_at: { type: [string, "null"], format: date-time }
    created_by: { type: [string, "null"], format: uuid }
    updated_by: { type: [string, "null"], format: uuid }
    allowed_actions:
      type: array
      items: { type: string, enum: [activate, archive] }
      description: |
        当前状态下服务端允许的动作，供前端按此渲染按钮。
        `ARCHIVED` 为终态，返回空数组。与状态迁移校验同源计算。

CollectionSopCreate:
  type: object
  additionalProperties: false
  required: [code, name, sop_version]
  properties:
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
    sop_version: { type: string, minLength: 1, maxLength: 64 }
    steps:
      type: array
      items: { type: object, additionalProperties: true }
    description: { type: [string, "null"], maxLength: 2000 }

CollectionSopPage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/CollectionSop" }
    next_cursor: { type: [string, "null"] }

