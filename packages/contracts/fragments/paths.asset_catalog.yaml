# 统一资产目录（N5-001）路径片段。
#
# 只读：没有 POST/PATCH/DELETE。各资源自身的列表/详情端点保持不变，
# 本端点只是跨资源的检索入口，不替代它们。

assetCatalogSearch:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: searchAssets
    tags: [asset-catalog]
    summary: 统一资产只读检索
    description: |
      在项目内按资源标识前缀检索多类资产，返回统一最小条目。

      - 默认检索全部类型；`kind` 只接受封闭枚举，非法值返回 422。
      - `q` 必填，长度 1..64（去除首尾空白后判定）；空白串与 NUL 字符返回 422。
      - 匹配使用既有索引前缀（RawAsset/Episode/Dataset 的 `code`、
        DatasetVersion 的父 Dataset `code`、媒体资产的 `episode_key`），
        不做 `%关键词%` 无界扫描，不引入全文/搜索引擎。
      - 排序为 `updated_at DESC, kind ASC, id ASC`；`cursor` 是复合键集游标，
        非法游标返回 422，不静默回到首页。
      - 服务端强制项目隔离；客户端传入的 `project_id` 只用于定位上下文，
        不参与构造查询。跨项目数据不会出现在结果中。
      - 不做任何写操作，也不改变既有资源状态。
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: 资源标识前缀；去除首尾空白后不能为空。
      - name: kind
        in: query
        required: false
        schema:
          $ref: "../openapi.yaml#/components/schemas/AssetKind"
        description: 只检索指定类型；缺省检索全部类型。
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Stage4Limit"
    responses:
      "200":
        description: 统一目录分页
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AssetCatalogEntryPage"
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
