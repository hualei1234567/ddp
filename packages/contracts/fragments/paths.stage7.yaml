# 阶段 7 数据平面路径片段（第一批：HF 数据源登记与导入）。
# 仅声明 backend/app/api/v1/datasource_routes.py 实际实现的端点。
# 由 openapi.yaml 通过 $ref 解析；引用回入口文件以复用公共参数与响应。

dataSources:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listDataSources
    tags: [datasources]
    summary: 数据源列表
    parameters:
      - name: kind
        in: query
        schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceKind" }
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Stage4Limit"
    responses:
      "200":
        description: 数据源分页
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSourcePage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    operationId: createDataSource
    tags: [datasources]
    summary: 登记外部数据源
    description: |
      `revision` 必须是 40 位 commit sha：`main` 等可变引用会移动，只存分支名的
      导入不可复现，因此契约层直接拒绝。
      `license` 必填；`access_condition=GATED` 与 `is_gated` 必须一致——
      访问成功不等于拥有商业使用权。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceCreate" }
    responses:
      "201":
        description: 数据源已登记
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSource" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: data_source_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: getDataSource
    tags: [datasources]
    summary: 数据源详情
    responses:
      "200":
        description: 数据源
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSource" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  patch:
    operationId: updateDataSource
    tags: [datasources]
    summary: 修改数据源治理字段
    description: |
      只允许改 name / license / access_condition / is_gated / config_name /
      split / notes。`repo_id` 与 `revision` 不可改——改 revision 等于换数据，
      必须重新登记以保证血缘可追。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/DataSourcePatch" }
    responses:
      "200":
        description: 已修改
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSource" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "428": { $ref: "../openapi.yaml#/components/responses/PreconditionRequired" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceDetailOverview:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: data_source_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: getDataSourceDetail
    tags: [datasources]
    summary: 数据源详情聚合
    description: |
      一次返回登记信息、导入任务与最近远端校验结论，供详情页使用。
      `remote_check=null` 表示从未校验或摘要损坏，前端必须显示"未校验"。
    parameters:
      - name: import_limit
        in: query
        description: 返回的导入任务数量上限。
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    responses:
      "200":
        description: 数据源详情聚合
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceDetail" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImports:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: data_source_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    operationId: createDataSourceImport
    tags: [datasources]
    summary: 登记一次导入
    description: |
      只建任务并投递 `datasource.import_requested` 事件，**不在 HTTP 线程下载数据**。
      `scope=SAMPLE` 必须给 `sample_limit`：默认只做小样本，不默认全量下载。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceImportCreate" }
    responses:
      "201":
        description: 导入任务已登记
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceImport" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportList:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listDataSourceImports
    tags: [datasources]
    summary: 导入任务列表
    description: |
      同时支持全项目列表与按数据源过滤；`data_source_id` 为可选查询参数，
      避免为同一份数据提供两条等价路径。
    parameters:
      - name: data_source_id
        in: query
        schema: { type: string, format: uuid }
      - name: status
        in: query
        schema: { $ref: "../openapi.yaml#/components/schemas/ImportStatus" }
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Stage4Limit"
    responses:
      "200":
        description: 导入任务分页
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceImportPage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: getDataSourceImport
    tags: [datasources]
    summary: 导入任务详情
    responses:
      "200":
        description: 导入任务
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceImport" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportLogs:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: listDataSourceImportLogs
    tags: [datasources]
    summary: 导入步骤日志（只读）
    description: |
      返回一次导入的执行期步骤日志：时间、阶段、等级与脱敏后的消息。
      不带 `cursor` 时返回最近 `limit` 条（默认 100、上限 500），按时间正序；
      `next_cursor` 非空表示还有更早的日志，带该游标可继续向更早翻页，
      顺序保持一致。`truncated` 与 `next_cursor !== null` 严格等价。
      消息不包含密钥、预签名 URL 或绝对路径。本端点只读，不提供任何写入/修改入口。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    responses:
      "200":
        description: 步骤日志
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ImportLogList" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportActions:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: action
      in: path
      required: true
      schema: { $ref: "../openapi.yaml#/components/schemas/ImportAction" }
  post:
    operationId: actOnDataSourceImport
    tags: [datasources]
    summary: 推进导入任务状态
    description: |
      `PENDING -> RUNNING -> {SUCCEEDED, FAILED, CANCELLED}`；终态不得回退。
      `fail` 必须带 `error_message`：失败留痕是 `docs/ddp/07` §5 的硬要求。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ImportActionRequest" }
    responses:
      "200":
        description: 状态已推进
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataSourceImport" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "428": { $ref: "../openapi.yaml#/components/responses/PreconditionRequired" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# ---------------------------------------------------------------------------
# 审看与质量报告（阶段 7 第二批）
#
# 这 6 个端点在后两步（提交 e6afb0c / 7c7665c）就已实现，但契约未跟进，
# 导致客户端无法生成类型、也无法按 code 分支。补这里属于**记录既有实现**，
# 不改任何运行时行为。
# ---------------------------------------------------------------------------

dataSourceImportAssets:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: listDataSourceImportAssets
    tags: [datasources]
    summary: 列出导入产出的媒体资产
    description: |
      按 episode + 机位排序，便于逐条审看。`limit` 默认 500、上限 1000——
      一个导入任务通常对应几十个资产，超过上限说明任务规模异常，
      而不是靠无界返回掩盖。
    parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
    responses:
      "200":
        description: 资产列表
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/MediaAssetList" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

mediaAssetPlayback:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    operationId: presignMediaAssetPlayback
    tags: [datasources]
    summary: 签发媒体资产短时播放地址
    description: |
      用 POST 而非 GET：签发 URL 会产出一个可访问凭证，属于有副作用的行为，
      不应被浏览器或代理缓存、预取。URL 有效期 900 秒。
    responses:
      "200":
        description: 播放信息
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/MediaAssetPlayback" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportReview:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    operationId: ensureDataSourceImportReview
    tags: [datasources]
    summary: 为导入创建审核记录（幂等）
    description: |
      已存在时直接返回既有记录，不新建、不报错——审核记录是"每个导入一条"，
      重复调用是客户端的正常重试行为。
    responses:
      "201":
        description: 审核记录
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataReview" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  get:
    operationId: getDataSourceImportReview
    tags: [datasources]
    summary: 读取导入的审核记录
    responses:
      "200":
        description: 审核记录
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataReview" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportReviewDecisions:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    operationId: decideDataSourceImportReview
    tags: [datasources]
    summary: 给出导入审核结论
    description: |
      审核人不得是提交人（职责分离）。数据库层亦有兜底约束，
      绕过应用层直写同样会被拒。
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ReviewDecisionRequest" }
    responses:
      "200":
        description: 审核结论已记录
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/DataReview" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "428": { $ref: "../openapi.yaml#/components/responses/PreconditionRequired" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportQualityReport:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    operationId: getDataSourceImportQualityReport
    tags: [datasources]
    summary: 读取导入的质量报告
    description: |
      规则版本、样本范围、通过率与失败原因都在响应里。`sample_scope` 与导入任务
      的范围一致——质量结论只覆盖实际导入的样本，不对外声称覆盖全量。
    responses:
      "200":
        description: 质量报告
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ImportQualityReport" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

dataSourceImportEpisodes:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    operationId: materializeDataSourceImportEpisodes
    tags: [datasources]
    summary: 把一次成功导入的媒体资产生成 Canonical Episode
    description: |
      导入链路产出的是「一个机位的一段视频」（MediaAsset），而 Canonical 层的
      样本单元是 Episode（一个演示片段的全部机位）。本端点按 `episode_key`
      聚合，为每一组生成一条 Episode，并把组内全部 RawAsset 挂上去。

      **幂等**：同一 `episode_key` 生成的 Episode 使用确定性 code
      `EP-{episode_key}`；重复调用不会造出第二份，已存在的计入
      `skipped_episode_keys`。因此可以安全重试。

      前置条件：导入状态必须是 `SUCCEEDED`——对失败或未完成的导入生成 Episode
      等于把半截数据当成样本。无可用媒体资产时返回 422 而不是空列表，避免
      "看着成功、实际什么也没生成"。

      **时间基准如实标注**：公开数据集的元数据通常不含时钟同步声明，生成的
      Episode 一律 `sync_status=DEGRADED` + `sync_method=NONE`，数据集准入时
      要求显式确认降级原因。标定快照为空数组，由数据集侧的 `CALIBRATION_MISSING`
      排除码如实反映，不在 Episode 上伪造标定信息。
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ImportEpisodeMaterializeRequest" }
    responses:
      "201":
        description: Episode 已生成（可能是部分新增）
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ImportEpisodeMaterializeResult" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "422": { $ref: "../openapi.yaml#/components/responses/UnprocessableEntity" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
