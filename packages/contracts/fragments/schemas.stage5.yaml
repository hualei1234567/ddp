RequirementCreate:
  type: object
  required:
  - code
  - title
  - source_type
  - dimensions
  # owner_id **刻意不在此列**，尽管实现三层（Pydantic `owner_id: UUID` 无默认、
  # 领域 `required_uuid`、DB `nullable=False` + `ondelete=RESTRICT`）都要求非空。
  #
  # 原因：把已有的可选字段改成 required 对客户端是**破坏性变更**
  # （oasdiff request-property-became-required），会让现有集成突然 422。
  # 契约收紧不是"补文档"，是改协议。
  #
  # 现状是一处**已知且已登记**的不一致：契约允许省略、实现会拒。
  # 由 `scripts/check_contract_parity.py --strict` 持续跟踪。后续二选一：
  #   - 若要真允许无主需求 → 放宽实现（需 DDL 迁移 + 回答"谁审批/谁对账"）；
  #   - 若要强制有主 → 走契约版本升级，给客户端迁移窗口。
  additionalProperties: false
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
    title:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type:
      - string
      - 'null'
      maxLength: 4000
    source_type:
      type: string
      enum:
      - MODEL_FEEDBACK
      - EVALUATION
      - MANUAL
      - OPERATION
    source_feedback_ids:
      type: array
      items:
        type: string
        format: uuid
      uniqueItems: true
    source_evaluation_ids:
      type: array
      items:
        type: string
        format: uuid
      uniqueItems: true
    dimensions:
      type: array
      minItems: 1
      items:
        $ref: ../openapi.yaml#/components/schemas/GapDimension
    target_episode_count:
      type: integer
      minimum: 1
    quality_thresholds:
      type: object
      additionalProperties: true
    priority:
      type: string
      enum:
      - P0
      - P1
      - P2
      - P3
    due_at:
      type:
      - string
      - 'null'
      format: date-time
    owner_id:
      type: string
      format: uuid
