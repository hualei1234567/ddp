ModelArtifact:
  type: object
  required:
  - object_key
  - sha256
  - size_bytes
  - format
  - verification_status
  additionalProperties: false
  properties:
    object_key:
      type: string
      minLength: 1
      maxLength: 1024
    sha256:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    size_bytes:
      type: integer
      minimum: 1
    format:
      type: string
      enum:
      - ONNX
      - TORCHSCRIPT
      - SAFETENSORS
      - TENSORRT
      - OTHER
    # 运行时真实返回该字段（前端 apps/web/src/types/modelops.ts 也读取），
    # 此前契约漏列。additionalProperties: false 下必须显式声明，
    # 否则严格客户端会因未知字段拒绝整个响应。
    # 取值见 domain/modelops/enums.py::ArtifactVerification。
    verification_status:
      type: string
      enum:
      - UNVERIFIED
      - VERIFIED
