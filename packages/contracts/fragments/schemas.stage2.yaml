    time_domain: {type: string, enum: [UTC], default: UTC}
    allow_overlap: {type: boolean, default: false}
    overlap_reason: {type: [string, "null"], maxLength: 1000}
    rule_parameters: {type: object, additionalProperties: true}
TimeBase:
  type: object
  required: [time_domain, clock_source, sync_method, sync_status]
  additionalProperties: false
  properties:
    time_domain: {type: string, enum: [UTC, ROS, DEVICE, HOST, MONOTONIC, UNKNOWN]}
    clock_source: {type: string, enum: [PTP, NTP, ROS_CLOCK, DEVICE_CLOCK, HOST_CLOCK, MONOTONIC, EXTERNAL, UNKNOWN]}
    clock_id: {type: [string, "null"], maxLength: 200}
    offset_to_utc_ns: {type: [integer, "null"]}
    drift_ppm: {type: [number, "null"]}
    uncertainty_ns: {type: [integer, "null"]}
    sync_method: {type: string, enum: [PTP, NTP, HARDWARE_TRIGGER, SOFTWARE_ESTIMATE, MANUAL, NONE]}
    sync_ref: {type: [string, "null"], maxLength: 200}
    sync_status: {type: string, enum: [VERIFIED, DEGRADED, UNVERIFIED, FAILED]}
CalibrationSnapshotItem:
  type: object
  required: [calibration_id, calibration_version, checksum, target_type, target_id, schema_version]
  additionalProperties: false
  properties:
    calibration_id: {type: string, format: uuid}
    calibration_version: {type: integer, minimum: 1}
    checksum: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    target_type: {type: string, enum: [ROBOT, DEVICE, SENSOR, SYSTEM]}
    target_id: {type: string, format: uuid}
    schema_version: {type: string, minLength: 1, maxLength: 64}
Episode:
  type: object
  required: [episode_id, project_id, episode_lineage_id, episode_version, code, task_id, batch_id, robot_id, device_ids, sensor_ids, status, quality_status, annotation_status, success, failure_reason, readiness_blockers, scene_labels, language_instruction, start_time_ns, end_time_ns, duration_ns, time_base, canonical_schema_version, pipeline_id, pipeline_version, segmentation_rule_version, frame_count, calibration_snapshot, manifest_key, manifest_sha256, preview_refs, supersedes_id, attempt, max_attempts, version, created_at, updated_at, created_by, updated_by]
  additionalProperties: false
  properties:
    episode_id: {type: string, format: uuid}
    project_id: {type: string, format: uuid}
    episode_lineage_id: {type: string, format: uuid}
    episode_version: {type: integer, minimum: 1}
    code: {type: string, minLength: 1, maxLength: 64}
    task_id: {type: [string, "null"], format: uuid}
    batch_id: {type: [string, "null"], format: uuid}
    robot_id: {type: [string, "null"], format: uuid}
    device_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
    sensor_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
    status: {$ref: "#/EpisodeStatus"}
    quality_status: {$ref: "#/EpisodeQualityStatus"}
    annotation_status: {$ref: "#/EpisodeAnnotationStatus"}
    success: {type: [boolean, "null"]}
    failure_reason: {type: [string, "null"], maxLength: 2000}
    readiness_blockers:
      type: array
      description: |
        自动就绪被拒绝的原因；空数组表示「尚未尝试或被清除」，不是「没有阻塞」。

        **刻意不复用 `failure_reason`**：后者被 `mark_failed` / `reject` /
        `invalidate` 占用，混用会让正常流水线的 Episode 被失败统计误计，
        且真实失败原因会覆盖就绪原因。

        判不了绝不放行：`FRAME_COUNT_UNDETERMINED` 等分支表示「无法确定」，
        而不是「自动通过了」。
      items:
        type: object
        additionalProperties: false
        required: [code, message, detail]
        properties:
          code:
            type: string
            enum:
              - STREAMS_MISSING
              - STREAM_INCOMPLETE
              - STREAM_SNAPSHOT_MISMATCH
              - TIME_BASE_INVALID
              - TIME_SYNC_UNVERIFIED
              - CALIBRATION_MISSING
              - DURATION_UNKNOWN
              - FRAME_RATE_UNKNOWN
              - FRAME_RATE_INCONSISTENT
              - FRAME_COUNT_UNDETERMINED
          message: {type: string, minLength: 1, maxLength: 500}
          detail: {type: object, additionalProperties: true}
    scene_labels: {type: array, items: {type: string, maxLength: 100}, uniqueItems: true}
    language_instruction: {type: [string, "null"], maxLength: 1000}
    start_time_ns: {type: integer}
    end_time_ns: {type: integer}
    duration_ns: {type: integer}
    time_base: {$ref: "#/TimeBase"}
    canonical_schema_version: {type: string, minLength: 1, maxLength: 64}
    pipeline_id: {type: string, minLength: 1, maxLength: 128}
    pipeline_version: {type: string, minLength: 1, maxLength: 64}
    segmentation_rule_version: {type: string, minLength: 1, maxLength: 64}
    frame_count: {type: integer, minimum: 0}
    calibration_snapshot: {type: array, items: {$ref: "#/CalibrationSnapshotItem"}}
    manifest_key: {type: [string, "null"], maxLength: 1024}
    manifest_sha256: {type: [string, "null"], pattern: '^sha256:[0-9a-f]{64}$'}
    preview_refs: {type: array, items: {type: object, additionalProperties: true}}
    supersedes_id: {type: [string, "null"], format: uuid}
    attempt: {type: integer, minimum: 1}
    max_attempts: {type: integer, minimum: 1}
    version: {type: integer, minimum: 1}
    created_at: {type: [string, "null"], format: date-time}
    updated_at: {type: [string, "null"], format: date-time}
    created_by: {type: [string, "null"], format: uuid}
    updated_by: {type: [string, "null"], format: uuid}
EpisodeCreate:
  type: object
  required: [raw_asset_ids, segmentation, time_base, canonical_schema_version, pipeline_id, pipeline_version]
  additionalProperties: false
  properties:
    raw_asset_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
    segmentation: {$ref: "#/EpisodeSegmentation"}
    time_base: {$ref: "#/TimeBase"}
    calibration_snapshot: {type: array, items: {$ref: "#/CalibrationSnapshotItem"}, default: []}
    canonical_schema_version: {type: string, minLength: 1, maxLength: 64}
    pipeline_id: {type: string, minLength: 1, maxLength: 128}
    pipeline_version: {type: string, minLength: 1, maxLength: 64}
    code: {type: [string, "null"], minLength: 1, maxLength: 64}
    task_id: {type: [string, "null"], format: uuid}
    batch_id: {type: [string, "null"], format: uuid}
    robot_id: {type: [string, "null"], format: uuid}
    device_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
    sensor_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
    scene_labels: {type: array, items: {type: string, maxLength: 100}, uniqueItems: true}
    language_instruction: {type: [string, "null"], maxLength: 1000}
    success: {type: [boolean, "null"]}
    failure_reason: {type: [string, "null"], maxLength: 1000}
    ingestion_job_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
    evidence_role: {type: string, minLength: 1, maxLength: 32, default: INPUT}
EpisodeActionRequest:
  type: object
  additionalProperties: false
  description: |
    `ready` 必须提供 `manifest` 与 `frame_count`，且不接受 `quality_status`；
    `quality-result` 必须提供 `quality_status`；`reject`/`invalidate` 必须提供 `reason`；
    其余动作禁止 manifest/frame_count。
  properties:
    reason: {type: [string, "null"], maxLength: 1000}
    quality_status: {type: [string, "null"], enum: [PASS, WARN, FAIL, null]}
    manifest: {type: [object, "null"], additionalProperties: true}
    frame_count: {type: [integer, "null"], minimum: 0}
EpisodeRevisionCreate:
  type: object
  required: [code]
  additionalProperties: false
  properties:
    code: {type: string, minLength: 1, maxLength: 64}
EpisodePage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items: {type: array, items: {$ref: "#/Episode"}}
    next_cursor: {type: [string, "null"]}
IngestionJobType:
  type: string
  enum: [VALIDATE, PARSE_METADATA, SEGMENT_EPISODE, REVALIDATE]
IngestionJobStatus:
  type: string
  enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLING, CANCELLED]
IngestionJob:
  type: object
  required: [job_id, project_id, job_type, raw_asset_ids, input_manifest_key, idempotency_key, status, attempt, max_attempts, timeout_sec, pipeline_id, pipeline_version, parser_id, parser_version, config_hash, started_at, finished_at, error_code, error_summary, output_refs, log_ref, metrics, version, created_at, updated_at, created_by, updated_by]
  additionalProperties: false
  properties:
    job_id: {type: string, format: uuid}
    project_id: {type: string, format: uuid}
    job_type: {$ref: "#/IngestionJobType"}
    raw_asset_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
    input_manifest_key: {type: [string, "null"], maxLength: 1024}
    idempotency_key: {type: [string, "null"], maxLength: 128}
    status: {$ref: "#/IngestionJobStatus"}
    attempt: {type: integer, minimum: 1}
    max_attempts: {type: integer, minimum: 1}
    timeout_sec: {type: integer, minimum: 1, maximum: 86400}
    pipeline_id: {type: [string, "null"], maxLength: 128}
    pipeline_version: {type: [string, "null"], maxLength: 64}
    parser_id: {type: [string, "null"], maxLength: 128}
    parser_version: {type: [string, "null"], maxLength: 64}
    config_hash: {type: [string, "null"], pattern: '^sha256:[0-9a-f]{64}$'}
    started_at: {type: [string, "null"], format: date-time}
    finished_at: {type: [string, "null"], format: date-time}
    error_code: {type: [string, "null"], maxLength: 64}
    error_summary: {type: [string, "null"], maxLength: 2000}
    output_refs: {type: array, items: {type: object, additionalProperties: true}}
    log_ref: {type: [string, "null"], maxLength: 1024}
    metrics: {type: object, additionalProperties: true}
    version: {type: integer, minimum: 1}
    created_at: {type: [string, "null"], format: date-time}
    updated_at: {type: [string, "null"], format: date-time}
    created_by: {type: [string, "null"], format: uuid}
    updated_by: {type: [string, "null"], format: uuid}
IngestionJobCreate:
  type: object
  required: [job_type, timeout_sec]
  additionalProperties: false
  properties:
    job_type: {$ref: "#/IngestionJobType"}
    timeout_sec: {type: integer, minimum: 1, maximum: 86400}
    raw_asset_ids: {type: array, maxItems: 64, items: {type: string, format: uuid}, uniqueItems: true}
    input_manifest_key: {type: [string, "null"], maxLength: 1024}
    idempotency_key: {type: [string, "null"], minLength: 8, maxLength: 128}
    max_attempts: {type: integer, minimum: 1, maximum: 100, default: 3}
    pipeline_id: {type: [string, "null"], maxLength: 128}
    pipeline_version: {type: [string, "null"], maxLength: 64}
    parser_id: {type: [string, "null"], maxLength: 128}
    parser_version: {type: [string, "null"], maxLength: 64}
    config_hash: {type: [string, "null"], pattern: '^sha256:[0-9a-f]{64}$'}
    metrics: {type: object, additionalProperties: true}
IngestionJobActionRequest:
  type: object
  additionalProperties: false
  properties:
    reason: {type: [string, "null"], maxLength: 1000}
IngestionJobPage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items: {type: array, items: {$ref: "#/IngestionJob"}}
    next_cursor: {type: [string, "null"]}

MaterializedEpisode:
  type: object
  required: [episode_id, episode_key, raw_asset_ids]
  additionalProperties: false
  description: 由导入产物生成的一条 Episode；`episode_key` 是源数据里的分组键。
  properties:
    episode_id: { type: string, format: uuid }
    episode_key: { type: string, minLength: 1, maxLength: 1024 }
    raw_asset_ids:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: string, format: uuid }
