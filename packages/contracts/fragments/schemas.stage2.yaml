LineageResponse:
  type: object
  required: [items, direction]
  additionalProperties: false
  properties:
    items: {type: array, items: {$ref: "#/LineageEdge"}}
    direction: {type: string, enum: [forward, reverse]}
    raw_asset_sources:
      type: array
      default: []
      description: |
        图上出现的 RawAsset 各自的**来源结论**。这是「这个资产的字节最初从
        哪里来」的直接答案，避免调用方自己从 edge.metadata 里推测。

        `status` 是四态，**不要合并**：
        - `RESOLVED`：能追到数据源与导入任务；
        - `NO_EXTERNAL_SOURCE`：手工上传或设备采集，**这是正常状态**，
          不是缺失；
        - `SOURCE_LINK_MISSING`：声称来自导入但查不到对应媒体行——数据不一致，
          应排查；
        - `UNKNOWN_ASSET`：图上引用了不存在的资产。
      items: {$ref: "#/RawAssetSource"}

