  required: [raw_asset_id, status, data_sources, imports]
  additionalProperties: false
  properties:
    raw_asset_id: {type: string, format: uuid}
    status:
      type: string
      enum: [RESOLVED, NO_EXTERNAL_SOURCE, SOURCE_LINK_MISSING, UNKNOWN_ASSET]
    data_sources: {type: array, items: {$ref: "#/DataSourceNode"}}
    imports: {type: array, items: {$ref: "#/DataSourceImportNode"}}

