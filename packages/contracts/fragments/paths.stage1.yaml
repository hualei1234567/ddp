calibrations:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
  get:
    operationId: listCalibrations
    tags: [calibrations]
    summary: 标定记录列表（游标分页）
    parameters:
      - {name: target_type, in: query, required: false, schema: {$ref: "../openapi.yaml#/components/schemas/CalibrationTargetType"}}
      - {name: target_id, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: status, in: query, required: false, schema: {$ref: "../openapi.yaml#/components/schemas/CalibrationStatus"}}
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200": {description: 标定记录分页结果, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CalibrationPage"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
  post:
    operationId: createCalibration
    tags: [calibrations]
    summary: 创建标定草案
    description: 初始状态固定为 `DRAFT`；`performed_by` 与 `checksum` 由服务端写入。
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CalibrationCreate"}}}}
    responses:
      "201": {description: 标定草案已创建, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/Calibration"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
calibrationDetail:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/CalibrationId"
  get:
    operationId: getCalibration
    tags: [calibrations]
    summary: 标定记录详情
    responses:
      "200": {description: 标定记录详情, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/Calibration"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
  patch:
    operationId: updateCalibration
    tags: [calibrations]
    summary: 修改标定草案（仅 DRAFT）
    description: 非 DRAFT 记录返回 `resource_immutable`；必须携带 `If-Match`。
    parameters: [{$ref: "../openapi.yaml#/components/parameters/IfMatch"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/CalibrationPatch"}}}}
    responses:
      "200": {description: 修改后的标定记录, content: {application/json: {schema: {$ref: "../openapi.yaml#/components/schemas/Calibration"}}}}
      "401": {$ref: "../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../openapi.yaml#/components/responses/Forbidden"}
      "404": {$ref: "../openapi.yaml#/components/responses/NotFound"}
      "409": {$ref: "../openapi.yaml#/components/responses/Conflict"}
      "422": {$ref: "../openapi.yaml#/components/responses/UnprocessableEntity"}
      "428": {$ref: "../openapi.yaml#/components/responses/PreconditionRequired"}
      "429": {$ref: "../openapi.yaml#/components/responses/TooManyRequests"}
calibrationSubmit:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ProjectId"
    - $ref: "../openapi.yaml#/components/parameters/CalibrationId"
  post:
    operationId: submitCalibration
    tags: [calibrations]
