# N4-001/N4-002：处理运行与阶段步骤 schema。
# 长度/取值上限取自 backend/app/domain/processing/（唯一权威实现）。

ProcessingRunStatus:
  type: string
  enum: [CREATED, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, RETRYING]
  description: |
    七态状态机。`SUCCEEDED` / `CANCELLED` 是终态；`FAILED` 可经服务端
    `RETRYING` 重试。`FAILED` 不是终态，客户端不得把它渲染成"已结束"。

ProcessingStepStatus:
  type: string
  enum: [RUNNING, SUCCEEDED, FAILED, SKIPPED]
  description: |
    单个阶段的执行结果。`SKIPPED` 是一等状态，不是"成功"的别名：它表示
    该阶段在当前流水线版本下没有真实实现，必须同时带非空 `log_summary`
    （跳过原因）。把未实现阶段写成 `SUCCEEDED` 会让"处理完成"变成谎话。

ProcessingStage:
  type: string
  enum:
    - FILE_VALIDATION
    - METADATA_EXTRACTION
    - FORMAT_PARSING
    - TIME_ALIGNMENT
    - CALIBRATION_VALIDATION
    - EPISODE_SEGMENTATION
    - DATA_CLEANING
    - QUALITY_PRE_CHECK
  description: |
    八个执行阶段，顺序即声明顺序，只允许前进。未开始时 `stage=null`。
    Upload 与 Artifact Registration 不在本实体内：前者属于接入任务，
    后者由产物引用承担。

ProcessingRunCreate:
  type: object
  additionalProperties: false
  required: [pipeline_version, input_refs]
  properties:
    pipeline_version:
      type: string
      minLength: 1
      maxLength: 64
    input_refs:
      type: array
      minItems: 1
      maxItems: 1000
      description: 对象存储引用或稳定标识；不传大对象本体。
      items:
        type: string
        minLength: 1
        maxLength: 1024

ProcessingRun:
  type: object
  required:
    - run_id
    - project_id
    - pipeline_version
    - input_refs
    - output_refs
    - status
    - attempt
    - retry_count
    - allowed_actions
    - version
    - created_at
    - updated_at
  properties:
    run_id: { type: string, format: uuid }
    project_id: { type: string, format: uuid }
    pipeline_version: { type: string, minLength: 1, maxLength: 64 }
    input_refs:
      type: array
      minItems: 1
      maxItems: 1000
      items: { type: string, minLength: 1, maxLength: 1024 }
    output_refs:
      type: array
      maxItems: 1000
      items: { type: string, minLength: 1, maxLength: 1024 }
    status: { $ref: "../openapi.yaml#/components/schemas/ProcessingRunStatus" }
    stage:
      oneOf:
        - $ref: "../openapi.yaml#/components/schemas/ProcessingStage"
        - type: "null"
      description: 当前阶段；未开始为 `null`。
    attempt:
      type: integer
      minimum: 0
      description: 已开始的执行尝试次数；未 claim 前为 0。
    retry_count:
      type: integer
      minimum: 0
      description: 进入 `RETRYING` 的次数；恒不大于 `attempt`。
    error_code:
      type: [string, "null"]
      maxLength: 64
      description: 仅 `FAILED` 非空。
    error_summary:
      type: [string, "null"]
      maxLength: 2000
      description: 仅 `FAILED` 非空。
    started_at:
      type: [string, "null"]
      format: date-time
      description: 首次进入 `RUNNING` 的时间；未执行为 `null`。
    finished_at:
      type: [string, "null"]
      format: date-time
      description: 本次尝试/运行结束时间；`FAILED` 也有值（可重试）。
    allowed_actions:
      type: array
      description: |
        服务端权威动作列表，客户端只按它渲染按钮。内部动作
        `system-*` / `worker-*` 永远不会出现。
      items:
        type: string
        enum: [cancel]
    version: { type: integer, minimum: 1 }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }
    steps:
      oneOf:
        - type: array
          maxItems: 200
          items: { $ref: "../openapi.yaml#/components/schemas/ProcessingRunStep" }
        - type: "null"
      description: |
        仅详情响应内联（有界，最多 200 条）。列表响应为 `null`；完整历史走
        `GET .../steps` 分页。

ProcessingRunStep:
  type: object
  required:
    - step_id
    - run_id
    - stage
    - attempt
    - status
    - started_at
    - created_at
    - updated_at
  additionalProperties: false
  properties:
    step_id: { type: string, format: uuid }
    run_id: { type: string, format: uuid }
    stage: { $ref: "../openapi.yaml#/components/schemas/ProcessingStage" }
    attempt:
      type: integer
      minimum: 1
      description: 执行尝试序号；与运行 `attempt` 对齐，重试会递增。
    status: { $ref: "../openapi.yaml#/components/schemas/ProcessingStepStatus" }
    log_summary:
      type: [string, "null"]
      maxLength: 1000
      description: 已脱敏的一行摘要；`SKIPPED` 时必非空（跳过原因）。
    error_code:
      type: [string, "null"]
      maxLength: 64
      description: 仅 `FAILED` 非空。
    error_summary:
      type: [string, "null"]
      maxLength: 2000
      description: 仅 `FAILED` 非空。
    started_at: { type: string, format: date-time }
    finished_at:
      type: [string, "null"]
      format: date-time
      description: 终态必非空；`RUNNING` 为 `null`。
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

ProcessingRunStepPage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ProcessingRunStep" }
    next_cursor: { type: [string, "null"] }

ProcessingRunPage:
  type: object
  required: [items, next_cursor]
  additionalProperties: false
  properties:
    items:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/ProcessingRun" }
    next_cursor: { type: [string, "null"] }
