openapi: 3.1.0
info:
  title: DDP API
  version: 0.2.0
  description: |
    DDP（Embodied AI Data Platform）HTTP API 契约。

    - `0.2.0` 是**当前已实现端点快照**：覆盖 `/health`、平台元信息，以及
      devices / sensors / calibrations 的全部已实现路由、错误码、乐观锁与分页。
    - 设备域**冻结目标**为 `ddp.device/1.0.0`（已批准），字段与语义以
      `docs/architecture/阶段1-设备域契约冻结-v1.md` 为准。
    - 当前实现与冻结目标的逐项差距、责任与排期见
      `docs/architecture/阶段1-设备域冻结字段实现差距与排期.md`。
    - 未实现字段不会在本文中伪装为已可用；例如 `frame_id`、`frame_convention`、
      `calibration_version`、`profile_version`、`schema_version` 目前尚未进入实现接口。

    认证：生产环境使用 `Authorization: Bearer <JWT>`；本项目阶段 0 另支持
    local 环境、显式开关且 loopback 来源的 `X-User-Id` 本地后门，不属于对外契约。
    所有项目路由由服务端校验成员资格，不信任客户端传入的 `project_id`。
    错误体统一为 `{"error": {"code", "message", "request_id"}}`。
    响应头携带 `X-Request-Id`；写动作要求 `If-Match: "<version>"`。
  contact:
    name: DDP System Architect
  license:
    name: Proprietary
x-ddp-contract:
  kind: implemented-snapshot
  version: 0.2.0
  frozen_target: ddp.device/1.0.0
  frozen_status: approved
  approved_at: "2026-11-08"
  frozen_document: docs/architecture/阶段1-设备域契约冻结-v1.md
  gap_document: docs/architecture/阶段1-设备域冻结字段实现差距与排期.md
  approval_record: docs/adr/0009-device-contract-freeze.md
  note: |
    本文件只声明已实现行为。冻结目标的破坏性字段更名（coordinate_frame→frame_id、
    version→lock_version、Profile version→profile_version）在差距 G-03/G-04/G-08
    关闭前不会出现在本快照中，避免前端生成不可调用的类型。
servers:
  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: platform
    description: 健康检查与平台元信息
  - name: devices
    description: 设备档案、项目隔离、乐观锁与生命周期动作
  - name: sensors
    description: 传感器档案、参照校验、乐观锁与生命周期动作
  - name: calibrations
    description: 标定记录草案、提交/校验/驳回/激活/作废/过期
paths:
  /health:
    get:
      operationId: getHealth
      tags: [platform]
      security: []
      summary: 服务健康检查
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/platform/meta:
    get:
      operationId: getPlatformMeta
      tags: [platform]
      security: []
      summary: 平台元信息
      responses:
        "200":
          description: 平台元信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMeta"
  /api/v1/projects/{project_id}/devices:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listDevices
      tags: [devices]
      summary: 设备列表（游标分页）
      parameters:
        - name: status
          in: query
          required: false
          description: 生命周期状态过滤；非法枚举返回 `validation_failed`
          schema:
            $ref: "#/components/schemas/LifecycleStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 设备分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createDevice
      tags: [devices]
      summary: 创建设备档案
      description: 初始状态固定为 `PROVISIONED`；客户端不得提交 status/project_id/审计字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: 设备已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/projects/{project_id}/devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DeviceId"
    get:
      operationId: getDevice
      tags: [devices]
      summary: 设备详情
      responses:
        "200":
          description: 设备详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateDevice
      tags: [devices]
      summary: 修改设备档案（不含状态）
      description: |
        仅允许修改白名单字段；`status`、`project_id`、各 `*_id`、审计字段一律拒绝。
        必须携带 `If-Match`；成功一次版本 +1。
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatch"
      responses:
        "200":
          description: 修改后的设备
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/projects/{project_id}/devices/{device_id}/activate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DeviceId"
    post:
      operationId: activateDevice
