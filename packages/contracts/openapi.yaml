      type: object
      additionalProperties: false
      required:
        [pending, published, failed, retrying, oldest_pending_age_seconds, stale,
         failures_by_event_type, generated_at]
      properties:
        pending: {type: integer, minimum: 0, description: 待处理（PENDING）事件数}
        published: {type: integer, minimum: 0, description: 已发布（PUBLISHED）事件数}
        failed: {type: integer, minimum: 0, description: 失败（FAILED）事件数}
        retrying:
          type: integer
          minimum: 0
          description: 正在重试的事件数（attempts > 0 且仍 PENDING）
        oldest_pending_age_seconds:
          type: [integer, "null"]
          minimum: 0
          description: 最老待处理事件距今秒数；无待处理时为 null（不是 0）
        stale:
