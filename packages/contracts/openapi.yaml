  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: platform
    description: 健康检查与平台元信息
  - name: devices
    description: 设备档案、项目隔离、乐观锁与生命周期动作
  - name: sensors
    description: 传感器档案、参照校验、乐观锁与生命周期动作
  - name: calibrations
    description: 标定记录草案、提交/校验/驳回/激活/作废/过期
  - name: collection
    description: 采集任务与批次、分配、拆分与状态动作
  - name: uploads
    description: 上传会话、分片预签名、确认、断点、完成与中止
  - name: raw-assets
    description: RawAsset 列表、详情与短期下载地址
  - name: episodes
    description: Episode 创建、列表、详情、状态动作与修订
  - name: ingestion-jobs
    description: 解析/校验 Job 创建、列表、详情、取消与重试
  - name: lineage
    description: RawAsset 与 Episode 血缘正/反向查询
  - name: annotation-schemas
    description: 标签 Schema 版本、审批与发布（发布后不可原地修改）
  - name: annotation-samples
    description: 标注样本选择、预览与样本集快照
  - name: annotation-tasks
    description: 标注任务、批次与状态动作
  - name: annotation-assignments
    description: 分配、领取与职责分离
  - name: annotation-submissions
    description: 提交、记录、复核与仲裁
  - name: annotation-quality
    description: 黄金集、质检抽检与 IAA 报告
