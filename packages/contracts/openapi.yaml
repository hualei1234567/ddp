components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 生产环境使用 Bearer JWT；本地 X-User-Id 后门不属于对外契约。
    adapterHmac:
      type: apiKey
      in: header
      name: X-DDP-Signature
      description: |
        外部训练/模型平台回调签名。算法：HMAC-SHA256(secret, timestamp + "." + nonce + "." + raw_body)，
        以 `sha256=<hex>` 传输；同时携带 X-DDP-Timestamp（Unix 秒）与 X-DDP-Nonce。
        时间窗默认 ±300 秒；nonce 在窗口内不得重复；重放返回 409：训练回调为 training_callback_replayed，模型回调为 model_callback_replayed。
