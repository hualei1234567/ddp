openapi: 3.1.0
info:
  title: DDP API
  version: 1.13.0
  description: |
    DDP（Embodied AI Data Platform）HTTP API 契约。

    - `1.0.0` 是**阶段 1 + 阶段 2 已实现端点冻结快照**：覆盖 `/health`、平台元信息、
      devices / sensors / calibrations，以及阶段 2 的 collection-tasks / collection-batches、
      upload-sessions、raw-assets、episodes、ingestion-jobs 与血缘查询。
    - `1.1.0` 在 `1.0.0` 基础上**增量加入阶段 3 标注域已实现端点**：标签 Schema、样本集、
      任务/批次/分配、提交/记录、复核/仲裁、黄金集、质检抽检与 IAA 报告。
    - 阶段 1 设备域冻结目标为 `ddp.device/1.0.0`（已批准）。
    - 阶段 2 冻结版本为 `ddp.stage2/1.0.0`（DDP-312，v1.0 FROZEN）。
    - 阶段 3 冻结版本为 `ddp.stage3/1.0.0`（DDP-323）；冻结端点矩阵、错误码与
      `If-Match`/`Idempotency-Key` 规则见 `docs/architecture/阶段3-契约冻结-v1.0.md`。
    - `1.2.0` 在 `1.1.0` 基础上**增量加入阶段 4 数据集与训练支撑已实现端点**：Dataset /
      DatasetVersion / DatasetItem、去重·划分·泄漏·质量策略、选择预览、质量/泄漏报告、
      Manifest、跨项目授权、导出 Job 与产物、训练需求/修订/交付、外部训练引用与 Adapter 回调。
      冻结版本 `ddp.stage4/1.0.0`；端点矩阵与错误码见 `docs/architecture/阶段4-契约冻结-v1.0.md`。
    - `1.3.0` 在 `1.2.0` 基础上**增量加入阶段 5 模型闭环已实现端点**：Model / ModelVersion
      产物校验与发布、模型评测、推理服务与推理任务、模型反馈、数据缺口汇总、数据需求闭环，
      以及模型平台 Adapter 签名回调（HMAC）。冻结版本 `ddp.stage5/1.0.0`。
    - `1.4.0` 在 `1.3.0` 基础上**增量加入阶段 6 供应商与到货验收已实现端点**：供应商档案、
      到货批次、到货片段裁决、只追加验收核验账本与供应商绩效。冻结版本 `ddp.stage6/1.0.0`。
    - `1.5.0` 在 `1.4.0` 基础上**增量加入阶段 7 数据平面第一批已实现端点**：
      Hugging Face 数据源登记与导入任务状态。冻结版本 `ddp.stage7/1.0.0`（仅本批范围）。
      解析、视频审看与人工审核尚未实现，不在本版本声明内。
    - `1.6.0` 在 `1.5.0` 基础上**补齐设备域已实现但契约缺漏的字段**（G-20）：
      Sensor 的 `frame_id` / `frame_convention`（ADR-0019），Calibration 的
      `calibration_version` 与 Profile 快照三字段（ADR-0020）。均为新增字段，
      不改变既有字段语义，`version` 继续保留并标 DEPRECATED。
    - `1.7.0` 在 `1.6.0` 基础上**增量加入 G-01 已实现端点**：`/robots` 全套
      （列表/创建/详情/修改 + 5 个生命周期动作）与 `/calibration-profiles`
      （登记新版本/详情，无 PATCH——Profile 不可变，改配置 = 新建版本）。
      同时补 `robots` 表的状态语义列（`status_reason`/`fault_*`/`status_changed_*`），
      与 devices/sensors 对齐。
    - `1.8.0` 在 `1.7.0` 基础上**增量加入 N3–N9 阶段已实现端点**：
      采集素材四实体（collection-plans / collection-sops / scenarios / action-specs，
      各「创建 / 列表 / 详情」——本批无更新与删除路径，状态恒为 DRAFT；
      **该限制已在 `1.9.0` 解除**）；
      标注质量检查（`annotation-submissions/{id}/quality-checks`）与 AI 预标注建议
      （`annotation-submissions/{id}/ai-suggestions`、`annotation-ai-suggestions/{id}/confirm`）；
      DatasetVersion 血缘（复用既有 `LineageResponse` 形状）。
      同时补齐两个已实现但契约缺失的响应字段：`training-deliveries[].requirement_match`
      （N6 需求核对报告，NULL 表示未核对、不等于通过）与
      `data-gaps[].items[].coverage_source`（MEASURED / MANUAL / UNKNOWN，
      测不到不等于覆盖率为 0）。以及错误码 `training_delivery_requirement_unmet`。
      全部为增量：无路径删除、无字段删除、无必填性收紧。
    - `1.8.0` 同时收录标注质量检查的**提交即自动执行**语义：
      `POST .../quality-checks` 是手动重跑（每次新增一条 run），不是首次触发；
      且自动检查失败不得否决提交。以及 AI 建议采纳统计
      `GET .../ai-suggestions/agreement`（按模型版本聚合采纳/修订/待处理，
      采纳率分母为已决定条数，无样本时为 null 而非 0）。
    - `1.9.0` 在 `1.8.0` 基础上**增量补齐采集素材的写路径**：四类素材各新增
      「更新（PATCH）」与「状态迁移（POST .../actions/{action}）」与「删除（DELETE）」，
      共 12 个操作。状态机 `DRAFT --activate--> ACTIVE --archive--> ARCHIVED` 由此
      完整可达（`ARCHIVED` 为终态，无出边）；`1.8.0` 中「状态恒为 DRAFT」的限制解除。
      字段可变性由 `backend/app/domain/collection/asset_lifecycle.py` 唯一裁决：
      描述性字段（`name` / `description` / `scene_labels`）在 `DRAFT` / `ACTIVE` 可改，
      `ARCHIVED` 一律不可改；执行内容字段（`CollectionSop.steps` /
      `ActionSpec.actions`）任何状态都不开放原地修改——内容变更必须新增版本行，
      否则任务冻结的版本快照会与行内容脱节。全部为增量：无路径删除、无字段删除、
      无必填性收紧。
    - `1.10.0` 在 `1.9.0` 基础上**新增训练执行方式 `execution_mode`**：
      外部训练引用响应（LOCAL / MOCK / DRY_RUN / REMOTE / UNKNOWN）与训练交付响应
      （取最近一次外部引用，尚未提交训练为 UNKNOWN）均声明为 required；
      外部训练引用创建请求新增可选 `execution_mode`。服务端由 Adapter 配置或请求
      确定方式，两者都缺失时返回 422，**绝不默认 REMOTE**；存量引用回填
      UNKNOWN（迁移 0054），不冒充真实训练。该字段为新增响应字段，客户端升级后
      必须按值区分真实/模拟执行。
    - `1.11.0`（本版包含三项独立增量）**新增 Episode 检索参数**：
      `GET /projects/{project_id}/episodes` 补齐已实现但此前未声明的可选
      query 参数（status / task_id / batch_id / quality_status /
      annotation_status / scene_label / device_id / robot_id / camera /
      captured_from / captured_to），其中 `camera` 为新增能力。全部可选、
      向后兼容，未收窄既有行为。
    - `1.11.0` **新增导入中心可观测性**：
      `DataSourceImport` 增加 `stage` / `processed_items` / `total_items`
      （均可空，`null` 明确表示"未测量"，迁移 0055 前的存量不回填 0），并新增
      只读端点 `GET .../data-source-imports/{import_id}/logs` 返回结构化步骤日志
      （`DataSourceImportLog`，最近 N 条上限截断，消息已脱敏）。全部为增量：
      无路径删除、无字段删除、未收窄既有字段取值。
    - `1.11.0` 在 `1.10.0` 基础上**新增 N4-001 处理运行实体**：
      `processing-runs` 的创建 / 列表 / 详情 / 客户端取消（`cancel`）四个操作，
      以及七态状态机（CREATED/QUEUED/RUNNING/SUCCEEDED/FAILED/CANCELLED/RETRYING）
      与八个执行阶段的封闭枚举。客户端只能看到服务端 `allowed_actions`；
      `system-*` / `worker-*` 内部动作不对外暴露。本版本**不包含**八阶段编排、
      Worker claim/advance 的触发入口与前端页面（N4-002 及后续）。
    - `1.12.0` **新增数据源远端校验与详情聚合**：`DataSourceCreate` 新增可选
      `verify_remote`（默认 `false`，不访问外网）；开启后超时、仓库不存在/无权限、
      gated 与声明不一致均以 `validation_failed` 拒绝登记。校验结论只以规范化摘要
      写入服务端保留的 `metadata.remote_check`，远端返回的其他字段不落库。
      新增 `GET .../data-sources/{data_source_id}/detail`，返回 `DataSourceDetail`
      （登记信息 + 导入任务 + `RemoteSourceCheck`）。全部为增量：无路径删除、
      无字段删除、未收窄既有字段取值。
    - `1.12.0` 在 `1.11.0` 基础上**新增 N4-002 八阶段编排可观测性**：
      创建处理运行时同事务写入投递类事件 `processing.run.requested`，由
      `app.workers.processing` 逐阶段执行；新增步骤记录
      （`PROCESSING_RUN_STEP`：`(run_id, stage, attempt)` 唯一，`SKIPPED` 必带
      跳过原因，`FAILED` 必带错误码与摘要）、详情响应内联有界 `steps`
      （列表响应为 `null`）与只读端点 `GET .../processing-runs/{id}/steps`
      （游标分页）。FILE_VALIDATION 校验输入对象存在；其余七个阶段在
      当前版本无真实实现，一律显式 `SKIPPED` 并记录原因，**不冒充成功**。
      全部为增量：无路径删除、无字段删除、未收窄既有字段取值。
    - `1.12.0` **新增标注任务 SLA 逾期可见性**：`AnnotationTask` 响应新增必填
      派生字段 `is_overdue`（无 `due_at` 或已终态恒为 false），`GET /annotation-tasks`
      新增可选 `overdue=true|false` 过滤。逾期不新增状态、不写库、不自动改派。
    - `1.12.0` **新增人工审核证据**：`DataReview` 与审核决定请求新增可选
      `evidence`（键白名单 timestamp_seconds / camera / note / episode_key，
      ≤4 键、序列化 ≤2000 字节），与审核结论同事务写入审计留痕。
    - `1.13.0` **导入步骤日志改为游标分页**：`GET .../data-source-imports/{import_id}/logs`
      新增可选 `cursor` 查询参数，响应新增必填 `next_cursor`（可为 null）。
      不带 `cursor` 时仍返回最近 `limit` 条（默认 100、上限 500），行为向后兼容；
      带 `next_cursor` 时返回严格更早的一页，顺序与时间一致。`truncated` 语义
      收敛为"还有更早日志未返回"，与 `next_cursor !== null` 严格等价。
      全部为增量：无路径删除、无字段删除、未收窄既有字段取值。
    - `1.13.0` **新增 N4-004 统一质量引擎**：`quality-runs` 的创建 / 详情 /
      结论明细三个只读追加型操作。规则实现仍留在导入、标注、数据集三处既有
      模块；本版本只做统一编排、六类分层（INTEGRITY / TEMPORAL / VISUAL /
      METADATA / ANNOTATION / OVERALL）与结果持久化。`rule_set_version` 为
      适用规则声明的内容 SHA，运行创建时固化；每条 finding 另带
      `rule_version`，规则升级不回写历史。`NOT_APPLICABLE` 与 `PASS` 严格
      区分（前者 `score` 为 null），整体状态新增 `INCOMPLETE`。本批次 POST
      只接受单个 Episode 或导入任务；批量/自动质检留给后续批次，
      `DATASET_VERSION` 规则源已注册但入口未开放。全部为增量：无路径删除、
      无字段删除、无既有字段语义变更。
    - 本文只声明**已实现行为**；未实现字段不得据此声称可用。
    - 阶段 2 的字段、错误码、`If-Match`、`Idempotency-Key` 与分页 cursor 以
      `docs/architecture/阶段2-契约冻结-v1.0.md` 与 `docs/architecture/阶段2-契约索引.md` 为准。

    本文件是唯一 OpenAPI 入口；为保证可维护性，路径项与 Schema 拆分到 `fragments/`
    并由本文件解析。Redocly/oasdiff 的输入始终是 `packages/contracts/openapi.yaml`。

    认证：生产环境使用 `Authorization: Bearer <JWT>`；本地环境可显式启用 loopback
    `X-User-Id` 后门，不属于对外契约。所有项目路由由服务端校验成员资格，不信任客户端
    传入的 `project_id`。错误体统一为 `{"error": {"code", "message", "request_id", "details?"}}`。
    响应头携带 `X-Request-Id`；写动作按端点要求 `If-Match: "<version>"` 与 `Idempotency-Key`。
