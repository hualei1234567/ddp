  - name: datasets
    description: Dataset 容器、状态动作与生命周期
  - name: dataset-versions
    description: DatasetVersion 构建、校验、冻结、复现与归档
  - name: dataset-items
    description: DatasetItem 显式版本引用与划分
  - name: dataset-policies
    description: 去重、划分、泄漏与质量策略（版本化、不可原地修改）
  - name: dataset-reports
    description: 选择预览、质量报告、泄漏报告与 Manifest
  - name: dataset-grants
    description: 跨项目数据集显式授权
  - name: exports
    description: 异步导出 Job、产物清单、校验和与下载
  - name: training-requests
    description: 训练需求、revision 与审批
  - name: training-deliveries
    description: 训练交付、验收与返工
  - name: training-adapters
    description: 外部训练引用、状态同步与 HMAC 回调
  - name: models
    description: 模型容器与生命周期
  - name: model-versions
    description: 模型版本、产物校验与发布（发布后不可原地修改）
  - name: evaluations
    description: 冻结数据集上的模型评测、指标与结论
  - name: inference
    description: 外部推理服务与推理任务登记
  - name: model-feedback
    description: 结构化模型问题与数据缺口
  - name: data-requirements
    description: 数据需求闭环与满足/复测关联
  - name: model-adapters
    description: 模型平台 Adapter 回调（HMAC）
  - name: robots
    description: 机器人档案、生命周期动作与标定配置引用
  - name: calibration-profiles
    description: 标定配置版本（不可变；改配置 = 新建版本）
  - name: suppliers
    description: 供应商档案、状态机与绩效指标
  - name: inbound-batches
    description: 到货批次、片段人工裁决与只追加验收核验账本
  - name: processing
    description: 处理运行实体、七态状态机与阶段/产物引用（八阶段编排属 N4-002）
