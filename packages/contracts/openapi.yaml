        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 生产环境使用 Bearer JWT；本地 X-User-Id 后门不属于对外契约。
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 项目 ID；服务端校验当前主体成员资格，不信任客户端声明
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SensorId:
      name: sensor_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalibrationId:
      name: calibration_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 不透明游标；由上一页 `next_cursor` 返回；非法返回 `validation_failed`
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量，默认 20，最大 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        乐观锁版本，格式为 `"<version>"`（可带弱校验前缀 `W/`）。
        缺失返回 428 `precondition_required`；不匹配返回 409 `version_conflict`。
      schema:
        type: string
        pattern: '^(W/)?"?[1-9][0-9]*"?$'
  responses:
    Unauthorized:
      description: 未认证或令牌无效（`not_authenticated`，401）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 权限不足、跨项目访问或四眼违规（`forbidden`，403）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: |
        同项目内资源不存在或跨项目不可见（`resource_not_found`，404）；
        平台管理员访问不存在的项目时可能为 `not_found`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: |
        状态/版本/唯一性冲突，可能返回：
        `state_transition_invalid`、`version_conflict`、`resource_immutable`、
        `duplicate_resource`、`calibration_active_conflict` 或通用 `conflict`（409）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: |
        参数或领域校验失败，可能返回：
        `validation_failed`、`calibration_invalid`、`calibration_target_invalid`、
        `calibration_profile_invalid`、`calibration_checksum_mismatch`、
        `calibration_not_active`（422）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: 缺少 `If-Match`（`precondition_required`，428）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: 触发写路径/认证路径限流（`rate_limited`，429）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorCode:
      type: string
      description: 稳定错误码；未知错误不得默认成功
      enum:
        - not_authenticated
        - forbidden
        - not_found
        - resource_not_found
        - conflict
        - state_transition_invalid
        - version_conflict
        - resource_immutable
        - duplicate_resource
        - calibration_active_conflict
        - validation_failed
        - calibration_invalid
        - calibration_target_invalid
        - calibration_profile_invalid
        - calibration_checksum_mismatch
        - calibration_not_active
        - precondition_required
        - rate_limited
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            request_id:
              type: [string, "null"]
    HealthResponse:
      type: object
      required: [status, service, version, env]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
        env:
          type: string
    PlatformMeta:
      type: object
      required: [name, version, env, phase, modules]
      additionalProperties: false
      properties:
        name:
          type: string
        version:
          type: string
        env:
          type: string
        phase:
          type: string
        modules:
          type: array
          items:
            type: string
    LifecycleStatus:
      type: string
      enum: [PROVISIONED, ACTIVE, IN_MAINTENANCE, FAULT, SUSPENDED, RETIRED]
    DeviceType:
      type: string
      enum: [COMPUTE, CONTROLLER, CAMERA_RIG, TELEOP, GRIPPER, OTHER]
    SensorType:
      type: string
      enum: [RGB, RGB_D, DEPTH, IMU, JOINT_STATE, END_EFFECTOR, FORCE_TORQUE, MOCAP, AUDIO]
    SensorSyncMode:
      type: string
      enum: [PTP, NTP, HARDWARE_TRIGGER, SOFTWARE_ESTIMATE, MANUAL, NONE]
    CalibrationScope:
      type: string
      enum: [ROBOT, DEVICE, SENSOR, SYSTEM]
    CalibrationTargetType:
      type: string
      enum: [ROBOT, DEVICE, SENSOR, SYSTEM]
    CalibrationType:
      type: string
      enum:
        - INTRINSICS
        - EXTRINSICS
        - HAND_EYE
        - IMU
        - JOINT_OFFSET
        - TIME_OFFSET
        - FORCE_TORQUE
        - DEPTH_ALIGNMENT
    CalibrationStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - VALIDATED
        - ACTIVE
        - REJECTED
        - SUPERSEDED
        - REVOKED
        - EXPIRED
    Device:
      type: object
      required:
        - device_id
        - project_id
        - robot_id
        - code
        - name
        - device_type
        - vendor
        - model
        - serial_number
        - firmware_version
        - hardware_version
        - calibration_profile_id
        - capability_profile
        - status
        - location_id
        - owner_user_id
        - version
        - created_at
        - updated_at
        - created_by
        - updated_by
      additionalProperties: false
      properties:
        device_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        robot_id:
          type: [string, "null"]
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        device_type:
          $ref: "#/components/schemas/DeviceType"
        vendor:
          type: [string, "null"]
          maxLength: 120
        model:
          type: [string, "null"]
          maxLength: 120
        serial_number:
          type: [string, "null"]
          maxLength: 120
        firmware_version:
          type: [string, "null"]
          maxLength: 64
        hardware_version:
          type: [string, "null"]
          maxLength: 64
        calibration_profile_id:
          type: [string, "null"]
          format: uuid
        capability_profile:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        location_id:
          type: [string, "null"]
          format: uuid
        owner_user_id:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          minimum: 1
          description: 乐观锁；仅表示档案版本，不表示业务修订历史
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        created_by:
          type: [string, "null"]
          format: uuid
        updated_by:
          type: [string, "null"]
          format: uuid
    DeviceCreate:
      type: object
      required: [code, name, device_type]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        device_type:
          $ref: "#/components/schemas/DeviceType"
        robot_id:
          type: [string, "null"]
          format: uuid
        vendor:
          type: [string, "null"]
          maxLength: 120
        model:
          type: [string, "null"]
          maxLength: 120
        serial_number:
          type: [string, "null"]
          maxLength: 120
        firmware_version:
          type: [string, "null"]
          maxLength: 64
        hardware_version:
          type: [string, "null"]
          maxLength: 64
        calibration_profile_id:
          type: [string, "null"]
          format: uuid
        capability_profile:
          type: object
          additionalProperties: true
          default: {}
        location_id:
          type: [string, "null"]
          format: uuid
        owner_user_id:
          type: [string, "null"]
          format: uuid
    DevicePatch:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        device_type:
          $ref: "#/components/schemas/DeviceType"
        robot_id:
          type: [string, "null"]
          format: uuid
        vendor:
          type: [string, "null"]
          maxLength: 120
        model:
          type: [string, "null"]
          maxLength: 120
        serial_number:
          type: [string, "null"]
          maxLength: 120
        firmware_version:
          type: [string, "null"]
          maxLength: 64
        hardware_version:
          type: [string, "null"]
          maxLength: 64
        calibration_profile_id:
          type: [string, "null"]
          format: uuid
        capability_profile:
          type: object
          additionalProperties: true
        location_id:
          type: [string, "null"]
          format: uuid
        owner_user_id:
          type: [string, "null"]
          format: uuid
    DevicePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        next_cursor:
          type: [string, "null"]
    Sensor:
      type: object
      required:
        - sensor_id
        - project_id
        - robot_id
        - device_id
        - code
        - sensor_type
        - vendor
        - model
        - serial_number
        - sample_rate_hz
        - resolution_w
        - resolution_h
        - bit_depth
        - channels
        - intrinsic_calibration_id
        - extrinsic_calibration_id
        - coordinate_frame
        - sync_mode
        - sync_group
        - firmware_version
        - calibration_profile_id
        - status
        - mount_position
        - version
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        sensor_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        robot_id:
          type: [string, "null"]
          format: uuid
        device_id:
          type: [string, "null"]
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
        sensor_type:
          $ref: "#/components/schemas/SensorType"
        vendor:
          type: [string, "null"]
          maxLength: 120
        model:
          type: [string, "null"]
          maxLength: 120
        serial_number:
          type: [string, "null"]
          maxLength: 120
        sample_rate_hz:
          type: number
          exclusiveMinimum: 0
        resolution_w:
          type: [integer, "null"]
          minimum: 1
        resolution_h:
          type: [integer, "null"]
          minimum: 1
