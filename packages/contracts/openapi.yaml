  /api/v1/projects/{project_id}/devices/{device_id}/maintenance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DeviceId"
    post:
      operationId: enterDeviceMaintenance
      tags: [devices]
      summary: 设备进入维护（ACTIVE/FAULT→IN_MAINTENANCE）
      description: |
        当前实现接收 `ActionRequest` 形状但不持久化 reason/maintenance_record_id；
        冻结目标要求持久化并写审计，见差距 G-09/G-10。
