    stage2:
      version: ddp.stage2/1.0.0
      frozen_status: frozen
      frozen_at: "2026-11-09"
      task: DDP-312
      implemented_baseline_task: DDP-311
      frozen_document: docs/architecture/阶段2-契约冻结-v1.0.md
      index_document: docs/architecture/阶段2-契约索引.md
