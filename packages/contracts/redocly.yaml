extends:
  - recommended

rules:
  # 阶段 0 的 /health 与 /api/v1/platform/meta 为公开只读端点，不强制 4xx；
  # 阶段 1/2 写端点均已在契约中声明 401/403/409/422/428/429。
  operation-4xx-response: warn
  # summary 已足够；description 按端点复杂度可选。
  operation-description: off
  # 信息区已包含 owner 与许可名称，不以 URL/邮箱作为门禁。
  info-license: off
  info-contact: off
  # 标签必须有说明，避免“未知标签”污染生成代码。
  tag-description: error
  # 契约通过 fragments/ 拆分；组件由路径片段间接引用。
  # 若 Redocly 的静态计数未识别间接引用，保留为 warn 而不阻断 lint。
  no-unused-components: warn
