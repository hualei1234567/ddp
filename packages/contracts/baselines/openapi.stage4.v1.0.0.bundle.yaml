openapi: 3.1.0
info:
  title: DDP API
  version: 1.2.0
  description: |
    DDP（Embodied AI Data Platform）HTTP API 契约。

    - `1.0.0` 是**阶段 1 + 阶段 2 已实现端点冻结快照**：覆盖 `/health`、平台元信息、
      devices / sensors / calibrations，以及阶段 2 的 collection-tasks / collection-batches、
      upload-sessions、raw-assets、episodes、ingestion-jobs 与血缘查询。
    - `1.1.0` 在 `1.0.0` 基础上**增量加入阶段 3 标注域已实现端点**：标签 Schema、样本集、
      任务/批次/分配、提交/记录、复核/仲裁、黄金集、质检抽检与 IAA 报告。
    - 阶段 1 设备域冻结目标为 `ddp.device/1.0.0`（已批准）。
    - 阶段 2 冻结版本为 `ddp.stage2/1.0.0`（DDP-312，v1.0 FROZEN）。
    - 阶段 3 冻结版本为 `ddp.stage3/1.0.0`（DDP-323）；冻结端点矩阵、错误码与
      `If-Match`/`Idempotency-Key` 规则见 `docs/architecture/阶段3-契约冻结-v1.0.md`。
    - `1.2.0` 在 `1.1.0` 基础上**增量加入阶段 4 数据集与训练支撑已实现端点**：Dataset /
      DatasetVersion / DatasetItem、去重·划分·泄漏·质量策略、选择预览、质量/泄漏报告、
      Manifest、跨项目授权、导出 Job 与产物、训练需求/修订/交付、外部训练引用与 Adapter 回调。
      冻结版本 `ddp.stage4/1.0.0`；端点矩阵与错误码见 `docs/architecture/阶段4-契约冻结-v1.0.md`。
    - 本文只声明**已实现行为**；未实现字段不得据此声称可用。
    - 阶段 2 的字段、错误码、`If-Match`、`Idempotency-Key` 与分页 cursor 以
      `docs/architecture/阶段2-契约冻结-v1.0.md` 与 `docs/architecture/阶段2-契约索引.md` 为准。

    本文件是唯一 OpenAPI 入口；为保证可维护性，路径项与 Schema 拆分到 `fragments/`
    并由本文件解析。Redocly/oasdiff 的输入始终是 `packages/contracts/openapi.yaml`。

    认证：生产环境使用 `Authorization: Bearer <JWT>`；本地环境可显式启用 loopback
    `X-User-Id` 后门，不属于对外契约。所有项目路由由服务端校验成员资格，不信任客户端
    传入的 `project_id`。错误体统一为 `{"error": {"code", "message", "request_id", "details?"}}`。
    响应头携带 `X-Request-Id`；写动作按端点要求 `If-Match: "<version>"` 与 `Idempotency-Key`。
  contact:
    name: DDP System Architect
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: platform
    description: 健康检查与平台元信息
  - name: devices
    description: 设备档案、项目隔离、乐观锁与生命周期动作
  - name: sensors
    description: 传感器档案、参照校验、乐观锁与生命周期动作
  - name: calibrations
    description: 标定记录草案、提交/校验/驳回/激活/作废/过期
  - name: collection
    description: 采集任务与批次、分配、拆分与状态动作
  - name: uploads
    description: 上传会话、分片预签名、确认、断点、完成与中止
  - name: raw-assets
    description: RawAsset 列表、详情与短期下载地址
  - name: episodes
    description: Episode 创建、列表、详情、状态动作与修订
  - name: ingestion-jobs
    description: 解析/校验 Job 创建、列表、详情、取消与重试
  - name: lineage
    description: RawAsset 与 Episode 血缘正/反向查询
  - name: annotation-schemas
    description: 标签 Schema 版本、审批与发布（发布后不可原地修改）
  - name: annotation-samples
    description: 标注样本选择、预览与样本集快照
  - name: annotation-tasks
    description: 标注任务、批次与状态动作
  - name: annotation-assignments
    description: 分配、领取与职责分离
  - name: annotation-submissions
    description: 提交、记录、复核与仲裁
  - name: annotation-quality
    description: 黄金集、质检抽检与 IAA 报告
  - name: datasets
    description: Dataset 容器、状态动作与生命周期
  - name: dataset-versions
    description: DatasetVersion 构建、校验、冻结、复现与归档
  - name: dataset-items
    description: DatasetItem 显式版本引用与划分
  - name: dataset-policies
    description: 去重、划分、泄漏与质量策略（版本化、不可原地修改）
  - name: dataset-reports
    description: 选择预览、质量报告、泄漏报告与 Manifest
  - name: dataset-grants
    description: 跨项目数据集显式授权
  - name: exports
    description: 异步导出 Job、产物清单、校验和与下载
  - name: training-requests
    description: 训练需求、revision 与审批
  - name: training-deliveries
    description: 训练交付、验收与返工
  - name: training-adapters
    description: 外部训练引用、状态同步与 HMAC 回调
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - platform
      security: []
      summary: 服务健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/platform/meta:
    get:
      operationId: getPlatformMeta
      tags:
        - platform
      security: []
      summary: 平台元信息
      responses:
        '200':
          description: 平台元信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMeta'
  /api/v1/projects/{project_id}/devices:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listDevices
      tags:
        - devices
      summary: 设备列表（游标分页）
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LifecycleStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 设备分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDevice
      tags:
        - devices
      summary: 创建设备档案
      description: 初始状态固定为 `PROVISIONED`；客户端不得提交 status/project_id/审计字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: 设备已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    get:
      operationId: getDevice
      tags:
        - devices
      summary: 设备详情
      responses:
        '200':
          description: 设备详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateDevice
      tags:
        - devices
      summary: 修改设备档案（不含状态）
      description: 仅允许修改白名单字段；必须携带 `If-Match`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatch'
      responses:
        '200':
          description: 修改后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}/activate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      operationId: activateDevice
      tags:
        - devices
      summary: 设备启用（PROVISIONED→ACTIVE）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}/maintenance:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      operationId: enterDeviceMaintenance
      tags:
        - devices
      summary: 设备进入维护（ACTIVE/FAULT→IN_MAINTENANCE）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}/fault:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      operationId: reportDeviceFault
      tags:
        - devices
      summary: 上报设备故障（ACTIVE/IN_MAINTENANCE→FAULT）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}/suspend:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      operationId: suspendDevice
      tags:
        - devices
      summary: 挂起设备（任意非终态→SUSPENDED）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}/retire:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      operationId: retireDevice
      tags:
        - devices
      summary: 设备退役（任意非终态→RETIRED，终态）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/sensors:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listSensors
      tags:
        - sensors
      summary: 传感器列表（游标分页）
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LifecycleStatus'
        - name: sensor_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SensorType'
        - name: robot_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 传感器分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createSensor
      tags:
        - sensors
      summary: 创建传感器档案
      description: 必须至少关联 `robot_id` 或 `device_id`；引用必须同项目。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      responses:
        '201':
          description: 传感器已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/sensors/{sensor_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SensorId'
    get:
      operationId: getSensor
      tags:
        - sensors
      summary: 传感器详情
      responses:
        '200':
          description: 传感器详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateSensor
      tags:
        - sensors
      summary: 修改传感器档案（不含状态）
      description: 必须携带 `If-Match`；引用变更会重新校验同项目与标定目标一致性。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorPatch'
      responses:
        '200':
          description: 修改后的传感器
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/sensors/{sensor_id}/activate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SensorId'
    post:
      operationId: activateSensor
      tags:
        - sensors
      summary: 传感器启用（PROVISIONED→ACTIVE）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的传感器
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/sensors/{sensor_id}/maintenance:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SensorId'
    post:
      operationId: enterSensorMaintenance
      tags:
        - sensors
      summary: 传感器进入维护
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的传感器
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/sensors/{sensor_id}/fault:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SensorId'
    post:
      operationId: reportSensorFault
      tags:
        - sensors
      summary: 上报传感器故障（ACTIVE/IN_MAINTENANCE→FAULT）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作后的传感器
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/sensors/{sensor_id}/suspend:
