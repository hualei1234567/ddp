        count_map:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        split_counts:
          type: object
          required:
            - train
            - validation
            - test
          additionalProperties: false
          properties:
            train:
              type: integer
              minimum: 0
            validation:
              type: integer
              minimum: 0
            test:
              type: integer
              minimum: 0
        policy_ref:
          type: object
          required:
            - policy_id
            - version
