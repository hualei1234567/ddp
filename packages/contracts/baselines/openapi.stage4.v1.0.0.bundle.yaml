          additionalProperties: false
          properties:
            policy_id:
              $ref: '#/components/schemas/uuid'
            version:
              type: integer
              minimum: 1
            policy_sha256:
              $ref: '#/components/schemas/sha256'
    leakage-report.v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://ddp.local/schemas/dataset/leakage-report.v1.schema.json
      title: DDP LeakageReport v1（阶段 4 草案）
      description: 泄漏检查报告。硬规则失败 FAIL；软规则失败 WARN/WAIVED；无法完成 UNKNOWN。FAIL/UNKNOWN 阻断冻结与导出，不得默认 PASS。
      $comment: 契约版本：ddp.stage4/1.0.0-draft
      type: object
      required:
        - leakage_report_id
        - project_id
        - dataset_version_id
        - status
        - leakage_status
        - policy_ref
        - checked_rule_count
        - violation_count
        - hard_violation_count
        - soft_violation_count
        - violations
        - waivers
        - checked_at
        - report_sha256
        - version
      additionalProperties: false
      properties:
        leakage_report_id:
          $ref: '#/components/schemas/uuid'
        project_id:
          $ref: '#/components/schemas/uuid'
        dataset_version_id:
          $ref: '#/components/schemas/uuid'
        status:
          type: string
          enum:
            - GENERATING
            - READY
            - FAILED
            - STALE
        leakage_status:
          type: string
          enum:
            - PASS
            - WARN
            - FAIL
            - UNKNOWN
            - WAIVED
        policy_ref:
          $ref: '#/components/schemas/policy_ref'
        checked_rule_count:
          type: integer
          minimum: 0
        violation_count:
          type: integer
          minimum: 0
        hard_violation_count:
          type: integer
          minimum: 0
        soft_violation_count:
          type: integer
          minimum: 0
        violations:
          type: array
          items:
            type: object
            required:
              - rule
              - level
              - split_a
              - split_b
              - object_refs
            additionalProperties: false
            properties:
              rule:
                type: string
                maxLength: 100
              level:
                type: string
                enum:
                  - HARD
                  - SOFT
              split_a:
                type: string
                enum:
                  - TRAIN
                  - VALIDATION
                  - TEST
              split_b:
                type: string
                enum:
                  - TRAIN
                  - VALIDATION
                  - TEST
              group_key:
                type:
                  - string
                  - 'null'
                maxLength: 200
              object_refs:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - object_type
                    - object_id
                  additionalProperties: false
                  properties:
                    object_type:
                      type: string
                      enum:
                        - EPISODE
                        - DATASET_ITEM
                        - RAW_ASSET
                        - ANNOTATION_SUBMISSION
                        - SCENE_GROUP
                        - SIMILARITY_GROUP
                        - BATCH
                    object_id:
                      $ref: '#/components/schemas/uuid'
              evidence:
                type:
                  - string
                  - 'null'
                maxLength: 1000
        waivers:
          type: array
          items:
            type: object
            required:
              - rule
              - approved_by
              - reason
              - approved_at
              - audit_ref
            additionalProperties: false
            properties:
              rule:
                type: string
                enum:
                  - SCENE_GROUP_CROSS_SPLIT
                  - BATCH_GROUP_CROSS_SPLIT
                  - TEMPORAL_OVERLAP_CROSS_SPLIT
                  - DUPLICATE_ANNOTATION
              approved_by:
                $ref: '#/components/schemas/uuid'
              reason:
                type: string
                minLength: 1
                maxLength: 2000
              impact:
                type:
                  - string
                  - 'null'
                maxLength: 1000
              approved_at:
                $ref: '#/components/schemas/date_time'
              expires_at:
                oneOf:
                  - $ref: '#/components/schemas/date_time'
                  - type: 'null'
              audit_ref:
                type: string
                minLength: 1
                maxLength: 256
        unknown_reason:
          type:
            - string
            - 'null'
          maxLength: 1000
        checked_at:
          $ref: '#/components/schemas/date_time'
        source_snapshot_at:
          oneOf:
            - $ref: '#/components/schemas/date_time'
            - type: 'null'
        report_sha256:
          $ref: '#/components/schemas/sha256'
        report_key:
          type:
            - string
            - 'null'
          maxLength: 1024
        version:
          type: integer
          minimum: 1
      $defs:
        uuid:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        sha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        date_time:
          type: string
          format: date-time
        policy_ref:
          type: object
          required:
            - policy_id
            - version
            - policy_sha256
          additionalProperties: false
          properties:
            policy_id:
              $ref: '#/components/schemas/uuid'
            version:
              type: integer
              minimum: 1
            policy_sha256:
              $ref: '#/components/schemas/sha256'
    manifest.v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://ddp.local/schemas/dataset/manifest.v1.schema.json
      title: DDP DatasetVersion Manifest v1（阶段 4 草案）
      description: DatasetVersion 的规范化样本清单 API 视图。manifest_sha256 由服务端对不含本字段的 RFC 8785 JCS 规范 JSON 计算；客户端提交的 Hash 一律忽略。
      $comment: 契约版本：ddp.stage4/1.0.0-draft
      type: object
      required:
        - schema_version
        - dataset_version_id
        - dataset_lineage_id
        - dataset_version
        - project_id
        - created_by
        - created_at
        - policy_refs
        - source_snapshot_at
        - items
        - split_counts
        - quality_report_sha256
        - leakage_report_sha256
        - annotation_schema_versions
        - episode_version_digest
        - canonicalization
        - manifest_sha256
      additionalProperties: false
      properties:
        schema_version:
          type: string
          const: ddp.dataset.manifest/1.0.0
        dataset_version_id:
          $ref: '#/components/schemas/uuid'
        dataset_lineage_id:
          $ref: '#/components/schemas/uuid'
        dataset_version:
          type: integer
          minimum: 1
        project_id:
          $ref: '#/components/schemas/uuid'
        created_by:
          $ref: '#/components/schemas/uuid'
        created_at:
          $ref: '#/components/schemas/date_time'
        policy_refs:
          type: object
          required:
            - dedup
            - split
            - leakage
            - quality
          additionalProperties: false
          properties:
            dedup:
              $ref: '#/components/schemas/policy_ref'
            split:
              $ref: '#/components/schemas/policy_ref'
            leakage:
              $ref: '#/components/schemas/policy_ref'
            quality:
              $ref: '#/components/schemas/policy_ref'
        selection_rule_version:
          type: string
          minLength: 1
          maxLength: 64
        source_snapshot_at:
          $ref: '#/components/schemas/date_time'
        items:
          type: array
          items:
            $ref: '#/components/schemas/dataset-item.v1.schema'
        split_counts:
          $ref: '#/components/schemas/split_counts'
        quality_report_sha256:
          $ref: '#/components/schemas/sha256'
        leakage_report_sha256:
          $ref: '#/components/schemas/sha256'
        annotation_schema_versions:
          type: array
          items:
            type: object
            required:
              - schema_id
              - schema_version
              - schema_sha256
            additionalProperties: false
            properties:
              schema_id:
                $ref: '#/components/schemas/uuid'
              schema_version:
                type: integer
                minimum: 1
              schema_sha256:
                $ref: '#/components/schemas/sha256'
          uniqueItems: true
        episode_version_digest:
          $ref: '#/components/schemas/sha256'
        annotation_submission_refs_digest:
          oneOf:
            - $ref: '#/components/schemas/sha256'
            - type: 'null'
        canonicalization:
          type: string
          const: RFC8785_JCS
        manifest_sha256:
          $ref: '#/components/schemas/sha256'
          description: 服务端计算；不在被哈希的规范 JSON 内。
        manifest_key:
          type:
            - string
            - 'null'
          maxLength: 1024
        size_bytes:
          type:
            - integer
            - 'null'
          minimum: 0
        inline:
          type: boolean
          description: true 表示响应内联 items；false 时通过短期签名 URL 下载。
        download_url:
          type:
            - string
            - 'null'
          maxLength: 4096
        download_url_expires_at:
          oneOf:
            - $ref: '#/components/schemas/date_time'
            - type: 'null'
      $defs:
        uuid:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        sha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        date_time:
          type: string
          format: date-time
        policy_ref:
          type: object
          required:
            - policy_id
            - version
            - policy_sha256
          additionalProperties: false
          properties:
            policy_id:
              $ref: '#/components/schemas/uuid'
            version:
              type: integer
              minimum: 1
            policy_sha256:
              $ref: '#/components/schemas/sha256'
        split_counts:
          type: object
          required:
            - train
            - validation
            - test
          additionalProperties: false
          properties:
            train:
              type: integer
              minimum: 0
            validation:
              type: integer
              minimum: 0
            test:
              type: integer
              minimum: 0
    dedup-policy.v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://ddp.local/schemas/dataset/dedup-policy.v1.schema.json
      title: DDP DedupPolicy v1（阶段 4 草案）
      description: 去重策略。P0 精确去重使用 episode_lineage / manifest_sha256 / raw_asset_sha256；近似重复默认仅告警（WARN_ONLY），不阻断构建或冻结。
      $comment: 契约版本：ddp.stage4/1.0.0-draft
      type: object
      required:
        - dedup_policy_id
        - project_id
        - version
        - exact_keys
        - near_duplicate_enabled
        - near_duplicate_enforcement
        - retain_rule
        - policy_sha256
        - created_at
        - created_by
      additionalProperties: false
      properties:
        dedup_policy_id:
          $ref: '#/components/schemas/uuid'
        project_id:
          $ref: '#/components/schemas/uuid'
        name:
          type:
            - string
            - 'null'
          maxLength: 200
        version:
          type: integer
          minimum: 1
          description: 策略版本，单调递增。
        exact_keys:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - EPISODE_LINEAGE
              - MANIFEST_SHA256
              - RAW_ASSET_SHA256
          description: 默认 ['EPISODE_LINEAGE', 'MANIFEST_SHA256', 'RAW_ASSET_SHA256']。
        near_duplicate_enabled:
          type: boolean
          default: false
        near_duplicate_enforcement:
          type: string
          enum:
            - WARN_ONLY
            - BLOCK
          default: WARN_ONLY
          description: '[DECISION] 近似重复默认仅告警，不阻断；BLOCK 需 PO 显式开启并审计。'
        similarity_method:
          type:
            - string
            - 'null'
          maxLength: 100
        similarity_threshold:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        similarity_min_cluster_size:
          type:
            - integer
            - 'null'
          minimum: 2
        grouping_keys:
          type: array
          items:
            type: string
            maxLength: 100
          uniqueItems: true
        retain_rule:
          type: string
          enum:
            - NEWEST_ACCEPTED
            - HIGHEST_QUALITY
            - EARLIEST
            - MANUAL
          description: 保留规则必须确定，不得随机；MANUAL 需逐组记录人工决定。
        policy_sha256:
          $ref: '#/components/schemas/sha256'
        created_at:
          $ref: '#/components/schemas/date_time'
        created_by:
          $ref: '#/components/schemas/uuid'
      $defs:
        uuid:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        sha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        date_time:
          type: string
          format: date-time
    split-policy.v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://ddp.local/schemas/dataset/split-policy.v1.schema.json
      title: DDP SplitPolicy v1（阶段 4 草案）
      description: 训练/验证/测试划分策略。[DECISION] 默认 Episode 级 80/10/10，可配置；空测试集默认失败，只有显式 ALLOW_EMPTY_TEST 且 PO 审批并记录理由时允许。
      $comment: 契约版本：ddp.stage4/1.0.0-draft
      type: object
      required:
        - split_policy_id
        - project_id
        - version
        - strategy
        - seed
        - group_by
        - empty_split_policy
        - min_item_count
        - min_duration_ns
        - rounding_rule
        - policy_sha256
        - created_at
        - created_by
      additionalProperties: false
      properties:
        split_policy_id:
          $ref: '#/components/schemas/uuid'
        project_id:
          $ref: '#/components/schemas/uuid'
        name:
          type:
            - string
            - 'null'
          maxLength: 200
        version:
          type: integer
          minimum: 1
        strategy:
          type: string
          enum:
            - RATIO
            - FIXED_COUNT
        train_ratio:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        validation_ratio:
          type: number
          minimum: 0
          maximum: 1
          default: 0.1
        test_ratio:
          type: number
          minimum: 0
          maximum: 1
          default: 0.1
        train_count:
          type:
            - integer
            - 'null'
          minimum: 1
        validation_count:
          type:
            - integer
            - 'null'
          minimum: 1
        test_count:
          type:
            - integer
            - 'null'
          minimum: 0
        seed:
          type: integer
          minimum: 0
        stratify_by:
          type: array
          items:
            type: string
            enum:
              - SCENE
              - ACTION
              - ROBOT
              - DEVICE
              - LABEL
              - QUALITY_STATUS
          uniqueItems: true
        group_by:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - EPISODE_LINEAGE
              - MANIFEST_SHA256
              - RAW_ASSET_SHA256
              - SIMILARITY_GROUP
              - SCENE_GROUP
          default:
            - EPISODE_LINEAGE
          description: 最小不可拆分单元；默认 Episode 血缘。
        empty_split_policy:
          type: string
          enum:
            - FAIL
            - ALLOW_EMPTY_TEST
          default: FAIL
          description: '[DECISION] 默认 FAIL；ALLOW_EMPTY_TEST 需 PO 审批并记录理由，训练/验证始终不得为空。'
        empty_test_waiver_required:
          type: boolean
          default: true
        min_item_count:
          type: integer
          minimum: 1
          default: 1
        min_duration_ns:
          type: integer
          minimum: 0
          default: 0
        rounding_rule:
          type: string
          enum:
            - FLOOR
            - ROUND_HALF_UP
            - LARGEST_REMAINDER
          default: LARGEST_REMAINDER
          description: 占比划分的确定性舍入规则，必须写入质量报告与 Manifest。
        policy_sha256:
          $ref: '#/components/schemas/sha256'
        created_at:
          $ref: '#/components/schemas/date_time'
        created_by:
          $ref: '#/components/schemas/uuid'
      allOf:
        - if:
            properties:
              strategy:
                const: RATIO
            required:
              - strategy
          then:
            required:
              - train_ratio
              - validation_ratio
              - test_ratio
        - if:
            properties:
              strategy:
                const: FIXED_COUNT
            required:
              - strategy
          then:
            required:
              - train_count
              - validation_count
              - test_count
      $defs:
        uuid:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        sha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        date_time:
          type: string
          format: date-time
    leakage-policy.v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://ddp.local/schemas/dataset/leakage-policy.v1.schema.json
      title: DDP LeakagePolicy v1（阶段 4 草案）
      description: 泄漏检查策略。[DECISION] 血缘/内容 Hash/跨划分重复为硬规则；场景组/相似簇/批次组/时间重叠默认软规则，PO 豁免需审计。硬规则不可豁免。
