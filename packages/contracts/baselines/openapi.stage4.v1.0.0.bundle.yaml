      type: object
      required:
        - leakage_policy_id
        - project_id
        - version
        - hard_rules
        - soft_rules
        - waiver_allowed_rules
        - policy_sha256
        - created_at
        - created_by
      additionalProperties: false
      properties:
        leakage_policy_id:
          $ref: '#/components/schemas/uuid'
        project_id:
          $ref: '#/components/schemas/uuid'
        name:
          type:
            - string
            - 'null'
          maxLength: 200
        version:
          type: integer
          minimum: 1
        hard_rules:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - EPISODE_LINEAGE_CROSS_SPLIT
              - MANIFEST_SHA256_CROSS_SPLIT
              - RAW_ASSET_SHA256_CROSS_SPLIT
              - SIMILARITY_GROUP_CROSS_SPLIT
          default:
            - EPISODE_LINEAGE_CROSS_SPLIT
            - MANIFEST_SHA256_CROSS_SPLIT
            - RAW_ASSET_SHA256_CROSS_SPLIT
        soft_rules:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - SCENE_GROUP_CROSS_SPLIT
              - BATCH_GROUP_CROSS_SPLIT
              - TEMPORAL_OVERLAP_CROSS_SPLIT
              - DUPLICATE_ANNOTATION
          default:
            - SCENE_GROUP_CROSS_SPLIT
            - TEMPORAL_OVERLAP_CROSS_SPLIT
        waiver_allowed_rules:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - SCENE_GROUP_CROSS_SPLIT
              - BATCH_GROUP_CROSS_SPLIT
              - TEMPORAL_OVERLAP_CROSS_SPLIT
              - DUPLICATE_ANNOTATION
          description: 仅软规则可豁免；硬规则出现在本列表即视为策略非法。
        similarity_grouping_enabled:
          type: boolean
          default: false
        scene_grouping_enabled:
          type: boolean
          default: true
        batch_grouping_enabled:
          type: boolean
          default: false
        temporal_overlap_enabled:
          type: boolean
          default: true
        unknown_blocks:
          type: boolean
          const: true
          description: 检查无法完成时必须 UNKNOWN 并阻断，固定为 true。
        policy_sha256:
          $ref: '#/components/schemas/sha256'
        created_at:
          $ref: '#/components/schemas/date_time'
        created_by:
          $ref: '#/components/schemas/uuid'
