      schema:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
    CallbackTimestamp:
      name: X-DDP-Timestamp
      in: header
      required: true
      description: Unix 秒；与服务器时间偏差超过 300 秒拒绝
      schema:
        type: integer
        minimum: 0
    CallbackNonce:
      name: X-DDP-Nonce
      in: header
      required: true
      description: 时间窗内唯一；重放拒绝
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DatasetAction:
      name: action
      in: path
      required: true
      description: Dataset 动作白名单；非法动作返回 422 validation_failed。
      schema:
        type: string
        enum:
          - activate
          - archive
          - restore
    DatasetVersionAction:
      name: action
      in: path
      required: true
      description: |
        DatasetVersion 动作白名单。`system-*` 为后台构建/校验流程使用，客户端不得主动调用；
        普通用户动作：build、cancel、validate、return-draft、freeze、archive。
      schema:
        type: string
        enum:
          - build
          - cancel
          - validate
          - return-draft
          - freeze
          - archive
          - system-build-complete
          - system-build-fail
          - system-validate-pass
          - system-validate-fail
          - system-supersede
    DatasetGrantAction:
      name: action
      in: path
      required: true
      description: 数据集授权动作白名单（approve/reject/revoke）；非法动作返回 422 validation_failed。
      schema:
        type: string
        enum:
          - approve
          - reject
          - revoke
    ExportJobAction:
      name: action
      in: path
      required: true
      description: 导出 Job 动作白名单（cancel/retry）；retry 返回 202。
      schema:
        type: string
        enum:
          - cancel
          - retry
    TrainingRequestAction:
      name: action
      in: path
      required: true
      description: 训练需求动作白名单；非法动作返回 422 validation_failed。
      schema:
        type: string
        enum:
          - block
          - unblock
          - cancel
          - close
    TrainingRequestRevisionAction:
      name: action
      in: path
      required: true
      description: 训练需求修订动作白名单；approve/reject 要求项目负责人权限。
      schema:
        type: string
        enum:
          - submit
          - approve
          - reject
    TrainingDeliveryAction:
      name: action
      in: path
      required: true
      description: 训练交付动作白名单；cancel 要求项目负责人权限。
      schema:
        type: string
        enum:
          - ready
          - deliver
          - accept
          - reject
          - rework
          - resume-ready
          - cancel
    ExternalTrainingReferenceAction:
      name: action
      in: path
      required: true
      description: 外部训练引用动作白名单（sync/cancel）。
      schema:
        type: string
        enum:
          - sync
          - cancel
    Stage4Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: 未认证或令牌无效（`not_authenticated`，401）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 权限不足、职责分离违规或跨项目访问（`forbidden`，403）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或跨项目不可见（`resource_not_found` / `not_found`，404）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态/版本/分片/幂等/唯一性冲突（409）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Gone:
      description: 上传会话过期或资产不可用（`upload_session_expired`，410）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: 文件超过允许大小（`file_too_large`，413）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: 声明的内容类型不在白名单（`file_type_unsupported`，415）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 参数或领域校验失败（422）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: 缺少 `If-Match` 或必填 `Idempotency-Key`（428）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 触发写路径/认证路径限流（`rate_limited`，429）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 依赖不可用（`object_storage_unavailable`，503）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
