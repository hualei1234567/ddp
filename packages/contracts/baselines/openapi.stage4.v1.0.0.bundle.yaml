components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 生产环境使用 Bearer JWT；本地 X-User-Id 后门不属于对外契约。
    adapterHmac:
      type: apiKey
      in: header
      name: X-DDP-Signature
      description: |
        外部训练平台回调签名。算法：HMAC-SHA256(secret, timestamp + "." + nonce + "." + raw_body)，
        以 `sha256=<hex>` 传输；同时携带 X-DDP-Timestamp（Unix 秒）与 X-DDP-Nonce。
        时间窗默认 ±300 秒；nonce 在窗口内不得重复；重放返回 409 training_callback_replayed。
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 项目 ID；服务端校验当前主体成员资格，不信任客户端声明。
      schema:
        type: string
        format: uuid
    ProjectIdQuery:
      name: project_id
      in: query
      required: true
      description: 无项目路径前缀的资源使用查询参数定位项目；服务端仍做成员资格与资源归属双重校验。
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadSessionId:
      name: upload_session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SensorId:
      name: sensor_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalibrationId:
      name: calibration_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartNumber:
      name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    Cursor:
      name: cursor
      in: query
      required: false
      description: 不透明游标；由上一页 `next_cursor` 返回；非法返回 `validation_failed`。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量，默认 20，最大 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        乐观锁版本，格式为 `"<version>"`（可带弱校验前缀 `W/`）。
        缺失返回 428 `precondition_required`；不匹配返回 409 `version_conflict`。
      schema:
        type: string
        pattern: ^(W/)?"?[1-9][0-9]*"?$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键；长度 8–128。相同键不同请求体返回 409 `idempotency_key_reused`。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 必填幂等键；缺失返回 428 `precondition_required`，长度非法返回 422。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TaskAction:
      name: action
      in: path
      required: true
      description: 采集任务状态动作白名单；系统内部动作 `system-data-check` 不对外暴露。
      schema:
        type: string
        enum:
          - submit-review
          - return-draft
          - approve
          - ready
          - assign
          - start
          - pause
          - resume
          - block
          - unblock
          - submit
          - accept
          - reject
          - rework
          - complete
          - cancel
    BatchAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum:
          - ready
          - start
          - pause
          - resume
          - block
          - unblock
          - submit
          - accept
          - reject
          - rework
          - complete
          - cancel
    EpisodeAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum:
          - ready
          - quality-check
          - quality-result
          - accept
          - reject
          - complete
          - invalidate
    JobAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum:
          - cancel
          - retry
    LineageDirection:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum:
          - forward
          - reverse
        default: forward
    LineageDepth:
      name: depth
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5
        default: 1
    LineageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SchemaId:
      name: schema_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SampleSetId:
      name: sample_set_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArbitrationId:
      name: arbitration_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoldSetId:
      name: gold_set_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QualitySampleId:
      name: quality_sample_id
      in: path
      required: true
