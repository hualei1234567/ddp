openapi: 3.1.0
info:
  title: DDP API
  version: 1.0.0
  description: |
    DDP（Embodied AI Data Platform）HTTP API 契约。

    - `1.0.0` 是**阶段 1 + 阶段 2 已实现端点冻结快照**：覆盖 `/health`、平台元信息、
      devices / sensors / calibrations，以及阶段 2 的 collection-tasks / collection-batches、
      upload-sessions、raw-assets、episodes、ingestion-jobs 与血缘查询。
    - 阶段 1 设备域冻结目标为 `ddp.device/1.0.0`（已批准）。
    - 阶段 2 冻结版本为 `ddp.stage2/1.0.0`（DDP-312，v1.0 FROZEN）。
    - 本文只声明**已实现行为**；未实现字段不得据此声称可用。
    - 阶段 2 的字段、错误码、`If-Match`、`Idempotency-Key` 与分页 cursor 以
      `docs/architecture/阶段2-契约冻结-v1.0.md` 与 `docs/architecture/阶段2-契约索引.md` 为准。

    本文件是唯一 OpenAPI 入口；为保证可维护性，路径项与 Schema 拆分到 `fragments/`
    并由本文件解析。Redocly/oasdiff 的输入始终是 `packages/contracts/openapi.yaml`。

    认证：生产环境使用 `Authorization: Bearer <JWT>`；本地环境可显式启用 loopback
    `X-User-Id` 后门，不属于对外契约。所有项目路由由服务端校验成员资格，不信任客户端
    传入的 `project_id`。错误体统一为 `{"error": {"code", "message", "request_id", "details?"}}`。
    响应头携带 `X-Request-Id`；写动作按端点要求 `If-Match: "<version>"` 与 `Idempotency-Key`。
  contact:
    name: DDP System Architect
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: platform
    description: 健康检查与平台元信息
  - name: devices
    description: 设备档案、项目隔离、乐观锁与生命周期动作
  - name: sensors
    description: 传感器档案、参照校验、乐观锁与生命周期动作
  - name: calibrations
    description: 标定记录草案、提交/校验/驳回/激活/作废/过期
  - name: collection
    description: 采集任务与批次、分配、拆分与状态动作
  - name: uploads
    description: 上传会话、分片预签名、确认、断点、完成与中止
  - name: raw-assets
    description: RawAsset 列表、详情与短期下载地址
  - name: episodes
    description: Episode 创建、列表、详情、状态动作与修订
  - name: ingestion-jobs
    description: 解析/校验 Job 创建、列表、详情、取消与重试
  - name: lineage
    description: RawAsset 与 Episode 血缘正/反向查询
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - platform
      security: []
      summary: 服务健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/platform/meta:
    get:
      operationId: getPlatformMeta
      tags:
        - platform
      security: []
      summary: 平台元信息
      responses:
        '200':
          description: 平台元信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMeta'
  /api/v1/projects/{project_id}/devices:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listDevices
      tags:
        - devices
      summary: 设备列表（游标分页）
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LifecycleStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 设备分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDevice
      tags:
        - devices
      summary: 创建设备档案
      description: 初始状态固定为 `PROVISIONED`；客户端不得提交 status/project_id/审计字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: 设备已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    get:
      operationId: getDevice
      tags:
        - devices
      summary: 设备详情
      responses:
        '200':
          description: 设备详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateDevice
      tags:
        - devices
      summary: 修改设备档案（不含状态）
      description: 仅允许修改白名单字段；必须携带 `If-Match`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatch'
      responses:
        '200':
          description: 修改后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/projects/{project_id}/devices/{device_id}/activate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      operationId: activateDevice
