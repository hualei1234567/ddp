openapi: 3.1.0
info:
  title: DDP Stage 3 Annotation API
  version: 1.0.0-draft
  description: |
    DDP 阶段 3 标注中心 HTTP API 草案（未冻结）。覆盖标签 Schema、样本集、
    标注任务/批次、分配/工作量、提交/记录、复核/仲裁、黄金集、质检抽检、IAA、
    血缘与指标摘要。
    - 所有项目路由由服务端强制 project scope；不信任客户端 project_id。
    - 写动作使用 If-Match；缺失 428，失配 409；写动作支持 Idempotency-Key。
    - 本文件是 DRAFT，不得声称已实现或已冻结。
    - 复杂响应 Schema 以同目录 JSON Schema 为准。
  contact:
    name: DDP System Architect (待确认)
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: annotation-schemas
    description: 标签 Schema、版本、审批与发布
  - name: annotation-samples
    description: 标注样本选择、预览与快照
  - name: annotation-tasks
    description: 标注任务、批次与状态动作
  - name: annotation-assignments
    description: 分配、领取、工作量与工作台
  - name: annotation-submissions
    description: 提交、记录、复核与仲裁
  - name: annotation-quality
    description: 黄金集、质检抽检与 IAA
  - name: annotation-metrics
    description: 指标摘要、血缘与审计
paths:
  /api/v1/projects/{project_id}/annotation-schemas:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAnnotationSchemas
      tags: [annotation-schemas]
      summary: 标签 Schema 列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AnnotationSchemaStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Schema 分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationSchemaPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createAnnotationSchema
      tags: [annotation-schemas]
      summary: 创建标签 Schema（DRAFT）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationSchemaCreate" }
      responses:
        "201":
          description: Schema 已创建
          content:
            application/json:
              schema: { $ref: "./label-schema.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-schemas/{schema_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SchemaId"
    get:
      operationId: getAnnotationSchema
      tags: [annotation-schemas]
      summary: Schema 详情
      responses:
        "200":
          description: Schema 详情
          content:
            application/json:
              schema: { $ref: "./label-schema.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateAnnotationSchema
      tags: [annotation-schemas]
      summary: 修改 DRAFT Schema
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationSchemaPatch" }
      responses:
        "200":
          description: 修改后的 Schema
          content:
            application/json:
              schema: { $ref: "./label-schema.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-schemas/{schema_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SchemaId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnAnnotationSchema
      tags: [annotation-schemas]
      summary: Schema 状态动作（submit-review/publish/deprecate/revoke/return-draft）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的 Schema
          content:
            application/json:
              schema: { $ref: "./label-schema.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-sample-sets/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: previewAnnotationSampleSet
      tags: [annotation-samples]
      summary: 预览样本选择（不落库或落 PREVIEW）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleSetPreviewRequest" }
      responses:
        "200":
          description: 预览结果
          content:
            application/json:
              schema: { $ref: "./annotation-sample-selection.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-sample-sets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAnnotationSampleSets
      tags: [annotation-samples]
      summary: 样本集列表
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, PREVIEW, SNAPSHOTTED, CONSUMED, CANCELLED] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 样本集分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationSampleSetPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createAnnotationSampleSet
      tags: [annotation-samples]
      summary: 创建/快照样本集
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleSetCreate" }
      responses:
        "201":
          description: 样本集已创建
          content:
            application/json:
              schema: { $ref: "./annotation-sample-selection.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-sample-sets/{sample_set_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SampleSetId"
    get:
      operationId: getAnnotationSampleSet
      tags: [annotation-samples]
      summary: 样本集详情
      responses:
        "200":
          description: 样本集详情
          content:
            application/json:
              schema: { $ref: "./annotation-sample-selection.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAnnotationTasks
      tags: [annotation-tasks]
      summary: 标注任务列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AnnotationTaskStatus" }
        - name: assigned_to
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 任务分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationTaskPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createAnnotationTask
      tags: [annotation-tasks]
      summary: 创建标注任务（DRAFT）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationTaskCreate" }
      responses:
        "201":
          description: 任务已创建
          content:
            application/json:
              schema: { $ref: "./annotation-task.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getAnnotationTask
      tags: [annotation-tasks]
      summary: 任务详情
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema: { $ref: "./annotation-task.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateAnnotationTask
      tags: [annotation-tasks]
      summary: 修改 DRAFT 任务
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationTaskPatch" }
      responses:
        "200":
          description: 修改后的任务
          content:
            application/json:
              schema: { $ref: "./annotation-task.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-tasks/{task_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnAnnotationTask
      tags: [annotation-tasks]
      summary: 任务状态动作（submit-review/approve/return-draft/ready/assign/start/pause/resume/block/unblock/submit/accept/reject/rework/complete/cancel/archive）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的任务
          content:
            application/json:
              schema: { $ref: "./annotation-task.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-tasks/{task_id}/items:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listAnnotationTaskItems
      tags: [annotation-tasks]
      summary: 任务样本项列表（AN 仅本人可见范围内）
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 样本项分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationTaskItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-tasks/{task_id}/batches:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listAnnotationBatches
      tags: [annotation-tasks]
      summary: 批次列表
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PLANNED, READY, ASSIGNED, IN_PROGRESS, PAUSED, BLOCKED, SUBMITTED, REVIEWING, ARBITRATION, ACCEPTED, REJECTED, REWORK, CANCELLED] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 批次分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationBatchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createAnnotationBatch
      tags: [annotation-tasks]
      summary: 拆分批次
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationBatchCreate" }
      responses:
        "201":
          description: 批次已创建
          content:
            application/json:
              schema: { $ref: "./annotation-batch.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-batches/{batch_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BatchId"
    get:
      operationId: getAnnotationBatch
      tags: [annotation-tasks]
      summary: 批次详情
      responses:
        "200":
          description: 批次详情
          content:
            application/json:
              schema: { $ref: "./annotation-batch.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateAnnotationBatch
      tags: [annotation-tasks]
      summary: 修改 PLANNED/READY 批次
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationBatchPatch" }
      responses:
        "200":
          description: 修改后的批次
          content:
            application/json:
              schema: { $ref: "./annotation-batch.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-batches/{batch_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BatchId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnAnnotationBatch
      tags: [annotation-tasks]
      summary: 批次状态动作（ready/assign/start/pause/resume/block/unblock/submit/accept/reject/rework/cancel）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的批次
          content:
            application/json:
              schema: { $ref: "./annotation-batch.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-assignments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAnnotationAssignments
      tags: [annotation-assignments]
      summary: 分配列表（AN 仅本人）
      parameters:
        - name: task_id
          in: query
          schema: { type: string, format: uuid }
        - name: assignee_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ASSIGNED, CLAIMED, IN_PROGRESS, SUBMITTED, COMPLETED, REVOKED, EXPIRED] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 分配分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationAssignmentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createAnnotationAssignment
      tags: [annotation-assignments]
      summary: 创建分配（校验容量/职责分离）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationAssignmentCreate" }
      responses:
        "201":
          description: 分配已创建
          content:
            application/json:
              schema: { $ref: "./annotation-assignment.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-assignments/{assignment_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssignmentId"
    get:
      operationId: getAnnotationAssignment
      tags: [annotation-assignments]
      summary: 分配详情
      responses:
        "200":
          description: 分配详情
          content:
            application/json:
              schema: { $ref: "./annotation-assignment.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-assignments/{assignment_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssignmentId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnAnnotationAssignment
      tags: [annotation-assignments]
      summary: 分配动作（claim/start/release/revoke/expire）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的分配
          content:
            application/json:
              schema: { $ref: "./annotation-assignment.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-assignments/{assignment_id}/workbench:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssignmentId"
    get:
