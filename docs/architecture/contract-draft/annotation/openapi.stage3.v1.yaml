  /api/v1/projects/{project_id}/iaa-reports/{iaa_report_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IaaReportId"
    get:
      operationId: getIaaReport
      tags: [annotation-quality]
      summary: IAA 报告详情（样本不足时 status=INSUFFICIENT_DATA）
      responses:
        "200":
          description: IAA 报告详情
          content:
            application/json:
              schema: { $ref: "./iaa-report.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-workloads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAnnotationWorkloads
      tags: [annotation-metrics]
      summary: 工作量汇总（个人明细仅授权）
      parameters:
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
        - name: period_start
          in: query
          schema: { type: string, format: date-time }
        - name: period_end
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 工作量分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationWorkloadPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-workloads/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getAnnotationWorkload
      tags: [annotation-metrics]
      summary: 某人工作量（本人/AM/PM/AU）
      parameters:
        - name: period_start
          in: query
          schema: { type: string, format: date-time }
        - name: period_end
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 工作量详情
          content:
            application/json:
              schema: { $ref: "./annotation-workload.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-tasks/{task_id}/lineage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getAnnotationTaskLineage
      tags: [annotation-metrics]
      summary: 标注任务血缘（正反向、深度 1–5）
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [FORWARD, BACKWARD, BOTH] }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 血缘边分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationLineagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-tasks/{task_id}/audit:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listAnnotationAuditEvents
      tags: [annotation-metrics]
      summary: 标注任务审计事件（只读）
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 审计事件分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationAuditPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/annotation-metrics/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getAnnotationMetricsSummary
      tags: [annotation-metrics]
      summary: 标注指标摘要（口径/缺失语义）
      parameters:
        - name: task_id
          in: query
          schema: { type: string, format: uuid }
        - name: period_start
          in: query
          schema: { type: string, format: date-time }
        - name: period_end
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 指标摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationMetricsSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SchemaId:
      name: schema_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SampleSetId:
      name: sample_set_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batch_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArbitrationId:
      name: arbitration_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GoldSetId:
      name: gold_set_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QualitySampleId:
      name: quality_sample_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IaaReportId:
      name: iaa_report_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Action:
      name: action
      in: path
      required: true
      description: 服务端白名单动作；非法动作返回 422 validation_failed
      schema: { type: string, minLength: 1, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 乐观锁版本，格式 "3"
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键；作用域 (project_id, user_id, key)，至少 24h
      schema: { type: string, minLength: 1, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Unauthorized:
      description: 未登录或 Token 失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: 权限不足、职责分离违规、项目范围拒绝
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: 同项目内不存在；跨项目统一不可见
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: 状态/版本/幂等/业务冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnprocessableEntity:
      description: 参数/Schema/业务校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PreconditionRequired:
      description: 缺少 If-Match
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: 触发限流
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Gone:
      description: 分配/资源已过期或撤销
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServiceUnavailable:
      description: 依赖/outbox/对象存储不可用
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, minLength: 1, maxLength: 100 }
            message: { type: string, minLength: 1, maxLength: 2000 }
            request_id: { type: [string, "null"], maxLength: 128 }
            details: { type: [object, "null"], additionalProperties: true }
    AnnotationSchemaStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, DEPRECATED, REVOKED]
    AnnotationTaskStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, READY, ASSIGNED, IN_PROGRESS, PAUSED, BLOCKED, SUBMITTED, REVIEWING, ARBITRATION, ACCEPTED, REJECTED, REWORK, COMPLETED, CANCELLED, ARCHIVED]
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, "null"], maxLength: 2000 }
        comment: { type: [string, "null"], maxLength: 2000 }
        evidence_refs: { type: array, items: { type: string, maxLength: 1024 }, uniqueItems: true }
        payload: { type: [object, "null"], additionalProperties: true }
    AnnotationSchemaCreate:
      type: object
      required: [code, name, annotation_levels, labels]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        annotation_levels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [TASK, EPISODE, TIME_RANGE, ACTION_SEGMENT, FRAME, OBJECT_TRACK] }
        labels: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
    AnnotationSchemaPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        annotation_levels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [TASK, EPISODE, TIME_RANGE, ACTION_SEGMENT, FRAME, OBJECT_TRACK] }
        labels: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
    SampleSetPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        filters: { type: object, additionalProperties: true }
        strategy: { type: string, enum: [FILTER, STRATIFIED, RISK_BASED, MANUAL] }
        strata: { type: array, items: { type: object, additionalProperties: true } }
        dedup_key: { type: string, enum: [EPISODE_LINEAGE, EPISODE_VERSION, NONE] }
    SampleSetCreate:
      type: object
      required: [code, selection_rule_version, filters, dedup_key]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: [string, "null"], maxLength: 200 }
        selection_rule_version: { type: string, minLength: 1, maxLength: 64 }
        strategy: { type: string, enum: [FILTER, STRATIFIED, RISK_BASED, MANUAL] }
        filters: { type: object, additionalProperties: true }
        strata: { type: array, items: { type: object, additionalProperties: true } }
        dedup_key: { type: string, enum: [EPISODE_LINEAGE, EPISODE_VERSION, NONE] }
        data_source: { type: string, enum: [REAL, SYNTHETIC, MIXED, UNKNOWN] }
    AnnotationTaskCreate:
      type: object
      required: [code, name, sample_set_id, schema_id, schema_version, target_item_count, target_episode_count, priority]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        sample_set_id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid }
        schema_version: { type: integer, minimum: 1 }
        gold_set_id: { type: [string, "null"], format: uuid }
        iaa_policy: { type: object, additionalProperties: true }
        quality_policy: { type: object, additionalProperties: true }
        assignment_mode: { type: string, enum: [MANUAL, CLAIM, MIXED] }
        target_item_count: { type: integer, minimum: 1 }
        target_episode_count: { type: integer, minimum: 1 }
        due_at: { type: [string, "null"], format: date-time }
        priority: { type: string, enum: [P0, P1, P2, P3] }
    AnnotationTaskPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        due_at: { type: [string, "null"], format: date-time }
        priority: { type: string, enum: [P0, P1, P2, P3] }
    AnnotationBatchCreate:
      type: object
      required: [code, sequence_no, planned_item_count]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        sequence_no: { type: integer, minimum: 1 }
        stratum: { type: [string, "null"], maxLength: 100 }
        item_refs: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        planned_item_count: { type: integer, minimum: 0 }
        assignee_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        reviewer_pool_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        due_at: { type: [string, "null"], format: date-time }
    AnnotationBatchPatch:
      type: object
      additionalProperties: false
      properties:
        stratum: { type: [string, "null"], maxLength: 100 }
        item_refs: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        planned_item_count: { type: integer, minimum: 0 }
        assignee_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        reviewer_pool_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        due_at: { type: [string, "null"], format: date-time }
    AnnotationAssignmentCreate:
      type: object
      required: [task_id, batch_id, assignee_id, assignment_role, planned_item_count, planned_minutes]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid }
        assignment_role: { type: string, enum: [ANNOTATOR, REVIEWER, ARBITER] }
        planned_item_count: { type: integer, minimum: 0 }
        planned_minutes: { type: integer, minimum: 0 }
        lease_expires_at: { type: [string, "null"], format: date-time }
    AnnotationSubmissionCreate:
      type: object
      required: [task_id, batch_id, assignment_id, schema_id, schema_version, schema_sha256, item_count, records_digest, data_source]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid }
        schema_version: { type: integer, minimum: 1 }
        schema_sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        item_count: { type: integer, minimum: 0 }
        records_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        record_refs: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        data_source: { type: string, enum: [REAL, SYNTHETIC, MIXED, UNKNOWN] }
        auto_label:
          type: [object, "null"]
          additionalProperties: true
    AnnotationSubmissionPatch:
      type: object
      additionalProperties: false
      properties:
        item_count: { type: integer, minimum: 0 }
        records_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        record_refs: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        auto_label:
          type: [object, "null"]
          additionalProperties: true
    AnnotationReviewCreate:
      type: object
      required: [submission_id, review_round]
      additionalProperties: false
      properties:
        submission_id: { type: string, format: uuid }
        reviewer_id: { type: [string, "null"], format: uuid }
        review_round: { type: integer, minimum: 1 }
    AnnotationArbitrationCreate:
      type: object
      required: [task_id, submission_id, review_id, arbiter_ids, quorum, trigger]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        submission_id: { type: string, format: uuid }
        review_id: { type: string, format: uuid }
        arbiter_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        quorum: { type: integer, minimum: 1 }
        trigger: { type: string, enum: [REVIEWER_DISAGREEMENT, ANNOTATOR_DISPUTE, GOLD_SET_CONFLICT, IAA_CONFLICT, HIGH_RISK, POLICY] }
    GoldSetCreate:
      type: object
      required: [code, schema_id, schema_version, schema_sha256, items, exposure_policy, max_exposure_per_annotator, rotation_policy]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: [string, "null"], maxLength: 200 }
        schema_id: { type: string, format: uuid }
        schema_version: { type: integer, minimum: 1 }
        schema_sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        items: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
        exposure_policy: { type: string, enum: [HIDDEN, ROTATING, CONTROLLED] }
        max_exposure_per_annotator: { type: integer, minimum: 1 }
        rotation_policy: { type: string, enum: [NONE, PER_TASK, PER_PERIOD, PER_ANNOTATOR] }
        usage_policy: { type: [object, "null"], additionalProperties: true }
    GoldSetPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 200 }
        items: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
        exposure_policy: { type: string, enum: [HIDDEN, ROTATING, CONTROLLED] }
        max_exposure_per_annotator: { type: integer, minimum: 1 }
        rotation_policy: { type: string, enum: [NONE, PER_TASK, PER_PERIOD, PER_ANNOTATOR] }
        usage_policy: { type: [object, "null"], additionalProperties: true }
    QualitySampleCreate:
      type: object
      required: [task_id, submission_id, sampling_policy_version, sample_type, sample_reason]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        submission_id: { type: string, format: uuid }
        sampling_policy_version: { type: string, minLength: 1, maxLength: 64 }
        sample_type: { type: string, enum: [RANDOM, STRATIFIED, RISK_BASED, GOLD_SET, IAA_OVERLAP] }
        stratum: { type: [string, "null"], maxLength: 100 }
        sample_reason: { type: string, minLength: 1, maxLength: 500 }
        item_refs: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        reviewer_id: { type: [string, "null"], format: uuid }
        due_at: { type: [string, "null"], format: date-time }
    IaaReportCreate:
      type: object
      required: [task_id, schema_id, schema_version, metric_definitions_version, metrics]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid }
        schema_version: { type: integer, minimum: 1 }
        metric_definitions_version: { type: string, minLength: 1, maxLength: 64 }
        metrics: { type: array, minItems: 1, items: { type: string, enum: [PERCENT_AGREEMENT, COHEN_KAPPA, FLEISS_KAPPA, KRIPPENDORFF_ALPHA, SPAN_F1, BOUNDARY_MAE] } }
    AnnotationSchemaPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./label-schema.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AnnotationSampleSetPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./annotation-sample-selection.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AnnotationTaskPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./annotation-task.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AnnotationTaskItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [episode_id, episode_version, sample_role]
            properties:
              episode_id: { type: string, format: uuid }
              episode_version: { type: integer, minimum: 1 }
              time_range: { type: [object, "null"], additionalProperties: true }
              stratum: { type: [string, "null"], maxLength: 100 }
              sample_role: { type: string, enum: [NORMAL, GOLD, IAA, QUALITY] }
        next_cursor: { type: [string, "null"] }
    AnnotationBatchPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./annotation-batch.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AnnotationAssignmentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./annotation-assignment.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AnnotationSubmissionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./annotation-submission.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AnnotationRecordPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./annotation-record.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AnnotationReviewPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "./annotation-review.v1.schema.json" } }
        next_cursor: { type: [string, "null"] }
