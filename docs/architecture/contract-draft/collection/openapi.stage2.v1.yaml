openapi: 3.1.0
info:
  title: DDP Stage 2 Collection / Ingestion / Episode API
  version: 1.0.0-draft
  description: |
    DDP 阶段 2 HTTP API 草案（未冻结）。覆盖采集任务/批次、上传会话与分片、
    RawAsset、IngestionJob、Episode 基础切片与血缘。
    - 所有项目路由由服务端强制 project scope；不信任客户端 project_id。
    - 写动作使用 If-Match；登记为 DRAFT 的契约不得声称已实现。
    - 上传完成返回 202；整文件 Hash/格式/恶意扫描由 VALIDATE Job 异步完成。
    - 复杂响应 Schema 以同目录 JSON Schema 为准。
  contact:
    name: DDP System Architect
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: collection
    description: 采集任务、批次、分配与状态动作
  - name: uploads
    description: 上传会话、分片、断点续传、完成与中止
  - name: raw-assets
    description: RawAsset 查询、下载、重校验、隔离放行、墓碑
  - name: ingestion
    description: 解析/校验/切片 Job 与重试/取消/日志
  - name: episodes
    description: Episode 基础切片、Manifest、质检动作与下载
  - name: lineage
    description: 数据血缘正向/反向查询
paths:
  /api/v1/projects/{project_id}/collection-tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listCollectionTasks
      tags: [collection]
      summary: 采集任务列表（游标分页）
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CollectionTaskStatus" }
        - name: assigned_to
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 任务分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionTaskPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createCollectionTask
      tags: [collection]
      summary: 创建采集任务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionTaskCreate" }
      responses:
        "201":
          description: 任务已创建（初始 DRAFT）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/collection-tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getCollectionTask
      tags: [collection]
      summary: 任务详情
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateCollectionTask
      tags: [collection]
      summary: 修改任务（仅 DRAFT 核心字段）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionTaskPatch" }
      responses:
        "200":
          description: 修改后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/collection-tasks/{task_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/CollectionAction"
    post:
      operationId: actOnCollectionTask
      tags: [collection]
      summary: 任务状态动作（白名单）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionTaskActionRequest" }
      responses:
        "200":
          description: 动作后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/collection-tasks/{task_id}/batches:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listCollectionBatches
      tags: [collection]
      summary: 批次列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CollectionBatchStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 批次分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBatchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createCollectionBatch
      tags: [collection]
      summary: 拆分批次
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionBatchCreate" }
      responses:
        "201":
          description: 批次已创建（初始 PLANNED）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/collection-batches/{batch_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BatchId"
    get:
      operationId: getCollectionBatch
      tags: [collection]
      summary: 批次详情
      responses:
        "200":
          description: 批次详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateCollectionBatch
      tags: [collection]
      summary: 修改批次（仅 PLANNED 核心字段）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionBatchPatch" }
      responses:
        "200":
          description: 修改后的批次
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/collection-batches/{batch_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BatchId"
      - $ref: "#/components/parameters/CollectionAction"
    post:
      operationId: actOnCollectionBatch
      tags: [collection]
      summary: 批次状态动作（白名单）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionBatchActionRequest" }
      responses:
        "200":
          description: 动作后的批次
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/upload-sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createUploadSession
      tags: [uploads]
      summary: 创建上传会话
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSessionCreate" }
      responses:
        "201":
          description: 会话已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/upload-sessions/{upload_session_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadSessionId"
    get:
      operationId: getUploadSession
      tags: [uploads]
      summary: 断点状态
      responses:
        "200":
          description: 会话状态与已确认分片
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/upload-sessions/{upload_session_id}/parts/{part_number}/url:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadSessionId"
      - $ref: "#/components/parameters/PartNumber"
    post:
      operationId: createUploadPartUrl
      tags: [uploads]
      summary: 获取分片预签名 URL
      responses:
        "200":
          description: 分片上传 URL 与必填头
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPartUrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/upload-sessions/{upload_session_id}/parts/{part_number}/ack:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadSessionId"
      - $ref: "#/components/parameters/PartNumber"
    post:
      operationId: ackUploadPart
      tags: [uploads]
      summary: 确认分片（ETag/大小/SHA256）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadPartAckRequest" }
      responses:
        "200":
          description: 分片已确认
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPartAckResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/upload-sessions/{upload_session_id}/parts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadSessionId"
    get:
      operationId: listUploadParts
      tags: [uploads]
      summary: 已确认分片列表
      responses:
        "200":
          description: 分片列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPartList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/upload-sessions/{upload_session_id}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadSessionId"
    post:
      operationId: completeUploadSession
      tags: [uploads]
      summary: 完成上传并登记/命中 RawAsset（异步校验）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteUploadRequest" }
      responses:
        "202":
          description: 完成已受理，等待 VALIDATE Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompleteUploadResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/upload-sessions/{upload_session_id}/abort:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadSessionId"
    post:
      operationId: abortUploadSession
      tags: [uploads]
      summary: 中止上传会话
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbortRequest" }
      responses:
        "200":
          description: 会话已中止（或原状态返回）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/raw-assets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listRawAssets
      tags: [raw-assets]
      summary: RawAsset 列表/筛选
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RawAssetStatus" }
        - name: collection_task_id
          in: query
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { $ref: "#/components/schemas/AssetFormat" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 资产分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawAssetPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/raw-assets/{asset_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getRawAsset
      tags: [raw-assets]
      summary: RawAsset 详情
      responses:
        "200":
          description: 资产详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawAsset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/raw-assets/{asset_id}/download-url:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: createRawAssetDownloadUrl
      tags: [raw-assets]
      summary: 短期下载地址（强审计）
      responses:
        "200":
          description: 短期签名地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/raw-assets/{asset_id}/revalidate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetId"
    post:
      operationId: revalidateRawAsset
      tags: [raw-assets]
      summary: 重新校验资产
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevalidateRequest" }
      responses:
        "202":
          description: 已创建重新校验 Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/raw-assets/{asset_id}/release-quarantine:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetId"
    post:
      operationId: releaseRawAssetQuarantine
      tags: [raw-assets]
      summary: 隔离放行（DE 提案 + QI/PO 批准，禁止自审）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseQuarantineRequest" }
      responses:
        "202":
          description: 放行已受理并进入重新校验
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/raw-assets/{asset_id}/tombstone:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetId"
    post:
      operationId: tombstoneRawAsset
      tags: [raw-assets]
      summary: 资产墓碑（PO + QI 双人）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TombstoneRequest" }
      responses:
        "200":
          description: 墓碑后的资产
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawAsset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/raw-assets/{asset_id}/ingest:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetId"
    post:
      operationId: ingestRawAsset
      tags: [ingestion]
      summary: 创建解析/切片 Job（资产必须 VALID/ARCHIVED）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "202":
          description: Job 已入队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/ingestion-jobs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listIngestionJobs
      tags: [ingestion]
      summary: Job 列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IngestionJobStatus" }
        - name: raw_asset_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Job 分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJobPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/ingestion-jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getIngestionJob
      tags: [ingestion]
      summary: Job 详情
      responses:
        "200":
          description: Job 详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/ingestion-jobs/{job_id}/retry:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: retryIngestionJob
      tags: [ingestion]
      summary: 重试可重试 Job
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetryRequest" }
      responses:
        "202":
          description: Job 已重新入队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/ingestion-jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: cancelIngestionJob
      tags: [ingestion]
      summary: 取消 Job
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "202":
          description: 取消已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/ingestion-jobs/{job_id}/log-url:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/JobId"
    get:
