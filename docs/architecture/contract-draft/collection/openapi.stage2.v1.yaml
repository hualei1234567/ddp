      tags: [ingestion]
      summary: 日志短期地址
      responses:
        "200":
          description: 日志签名地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/episodes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listEpisodes
      tags: [episodes]
      summary: Episode 列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EpisodeStatus" }
        - name: collection_task_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Episode 分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createEpisode
      tags: [episodes]
      summary: 从 VALID/ARCHIVED 资产创建基础切片
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeCreate" }
      responses:
        "201":
          description: Episode 已创建（PENDING）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/episodes/{episode_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: getEpisode
      tags: [episodes]
      summary: Episode 详情
      responses:
        "200":
          description: Episode 详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateEpisode
      tags: [episodes]
      summary: 修改允许的元数据（READY 后数据字段不可改）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodePatch" }
      responses:
        "200":
          description: 修改后的 Episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/episodes/{episode_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/EpisodeAction"
    post:
      operationId: actOnEpisode
      tags: [episodes]
      summary: Episode 状态动作（白名单）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeActionRequest" }
      responses:
        "200":
          description: 动作后的 Episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/episodes/{episode_id}/manifest:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: getEpisodeManifest
      tags: [episodes]
      summary: Episode Manifest 与 Hash
      responses:
        "200":
          description: Manifest 响应
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeManifestResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/episodes/{episode_id}/download-url:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: createEpisodeDownloadUrl
      tags: [episodes]
      summary: Episode 数据短期下载地址
      responses:
        "200":
          description: 短期签名地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/episodes/{episode_id}/lineage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: getEpisodeLineage
      tags: [lineage]
      summary: Episode 血缘
      parameters:
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Depth"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 血缘遍历结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageTraversalResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/lineage/nodes/{node_type}/{node_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NodeType"
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: traverseLineage
      tags: [lineage]
      summary: 通用血缘遍历
      parameters:
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Depth"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 血缘遍历结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageTraversalResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batch_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadSessionId:
      name: upload_session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NodeId:
      name: node_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartNumber:
      name: part_number
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 10000 }
    CollectionAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum: [submit-review, return-draft, approve, ready, assign, start, pause, resume, block, unblock, submit, accept, reject, rework, complete, cancel]
    EpisodeAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum: [quality-check, accept, reject, retry, complete, archive, invalidate]
    NodeType:
      name: node_type
      in: path
      required: true
      schema:
        type: string
        enum: [RAW_ASSET, UPLOAD_SESSION, COLLECTION_TASK, COLLECTION_BATCH, INGESTION_JOB, EPISODE, QUALITY_RUN, ANNOTATION, DATASET_VERSION, TRAINING_RUN]
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^(W/)?"?[1-9][0-9]*"?$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Direction:
      name: direction
      in: query
      required: false
      schema: { type: string, enum: [forward, reverse, both], default: both }
    Depth:
      name: depth
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 5, default: 2 }
  responses:
    Unauthorized:
      description: 未认证或令牌无效（not_authenticated）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: 权限不足、职责分离违规或跨项目（forbidden/project_scope_denied/asset_quarantined）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: 资源不存在或跨项目不可见（resource_not_found）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: 状态/版本/分片/幂等/重复冲突（409 系列）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Gone:
      description: 会话过期或资产墓碑（upload_session_expired/asset_tombstoned）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PayloadTooLarge:
      description: 文件过大（file_too_large）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnsupportedMediaType:
      description: 类型不在白名单（file_type_unsupported）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnprocessableEntity:
      description: 参数/领域校验失败（422 系列）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PreconditionRequired:
      description: 缺少 If-Match（precondition_required）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: 触发限流（rate_limited）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServiceUnavailable:
      description: 依赖不可用（dependency_unavailable/object_storage_unavailable）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: 稳定错误码；完整注册表见 error-codes.v1.json
              enum:
                - not_authenticated
                - forbidden
                - project_scope_denied
                - asset_quarantined
                - resource_not_found
                - not_found
                - conflict
                - state_transition_invalid
                - version_conflict
                - resource_immutable
                - duplicate_resource
                - idempotency_key_reused
                - upload_incomplete
                - upload_part_conflict
                - upload_session_not_uploading
                - episode_overlap_conflict
                - episode_already_exists
                - job_not_retryable
                - asset_not_usable
                - lineage_conflict
                - upload_session_expired
                - asset_tombstoned
                - file_too_large
                - file_type_unsupported
                - validation_failed
                - file_signature_mismatch
                - hash_mismatch
                - size_mismatch
                - filename_invalid
                - quarantine_release_denied
                - calibration_not_active
                - calibration_snapshot_invalid
                - episode_time_range_invalid
                - time_base_invalid
                - manifest_hash_mismatch
                - manifest_schema_invalid
                - unsupported_format
                - malware_detected
                - scanner_unavailable
                - job_config_invalid
                - precondition_required
                - rate_limited
                - internal_error
                - dependency_unavailable
                - object_storage_unavailable
                - storage_quota_exceeded
            message: { type: string }
            request_id: { type: [string, "null"] }
            details: { type: [object, "null"], additionalProperties: true }
    CollectionTaskStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, READY, ASSIGNED, IN_PROGRESS, PAUSED, BLOCKED, SUBMITTED, DATA_CHECKING, ACCEPTED, REJECTED, REWORK, COMPLETED, CANCELLED]
    CollectionBatchStatus:
      type: string
      enum: [PLANNED, READY, IN_PROGRESS, PAUSED, BLOCKED, SUBMITTED, ACCEPTED, REJECTED, REWORK, CANCELLED]
    UploadSessionStatus:
      type: string
      enum: [CREATED, UPLOADING, COMPLETING, COMPLETED, ABORTED, EXPIRED, FAILED]
    RawAssetStatus:
      type: string
      enum: [VALIDATING, VALID, QUARANTINED, REJECTED, ARCHIVED, TOMBSTONED]
    IngestionJobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLING, CANCELLED]
    EpisodeStatus:
      type: string
      enum: [PENDING, PROCESSING, READY, QUALITY_CHECKING, ACCEPTED, COMPLETED, ARCHIVED, FAILED, REJECTED, INVALIDATED]
    AssetFormat:
      type: string
      enum: [MCAP, ROSBAG2, HDF5, MP4, PARQUET, CSV, JSON, ZIP, UNKNOWN]
    CollectionTask:
      type: object
      required: [task_id, project_id, code, name, status, priority, target_episode_count, target_duration_sec, submitted_episode_count, accepted_episode_count, version, created_at, updated_at]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        requirement_id: { type: [string, "null"], format: uuid }
        plan_id: { type: [string, "null"], format: uuid }
        sop_id: { type: [string, "null"], format: uuid }
        sop_version: { type: [string, "null"], maxLength: 64 }
        scenario_id: { type: [string, "null"], format: uuid }
        action_spec_id: { type: [string, "null"], format: uuid }
        action_spec_version: { type: [string, "null"], maxLength: 64 }
        status: { $ref: "#/components/schemas/CollectionTaskStatus" }
        priority: { type: string, enum: [P0, P1, P2] }
        assigned_to: { type: [string, "null"], format: uuid }
        assigned_robot_id: { type: [string, "null"], format: uuid }
        assigned_device_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        assigned_sensor_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        location_id: { type: [string, "null"], format: uuid }
        scheduled_start: { type: [string, "null"], format: date-time }
        scheduled_end: { type: [string, "null"], format: date-time }
        actual_start: { type: [string, "null"], format: date-time }
        actual_end: { type: [string, "null"], format: date-time }
        target_episode_count: { type: integer, minimum: 0 }
        target_duration_sec: { type: integer, minimum: 0 }
        submitted_episode_count: { type: integer, minimum: 0 }
        accepted_episode_count: { type: integer, minimum: 0 }
        quality_summary: { type: [object, "null"], additionalProperties: true }
        status_reason: { type: [string, "null"], maxLength: 1000 }
        blocked_reason: { type: [string, "null"], maxLength: 1000 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        updated_by: { type: [string, "null"], format: uuid }
    CollectionTaskCreate:
      type: object
      required: [code, name, priority, target_episode_count, target_duration_sec]
