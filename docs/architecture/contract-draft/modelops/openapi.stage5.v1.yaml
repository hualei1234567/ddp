openapi: 3.1.0
info:
  title: DDP Stage 5 Model Closed-Loop API
  version: 1.0.0-draft
  description: |
    DDP 阶段 5 模型闭环与智能化 HTTP API 草案（`ddp.stage5/1.0.0-draft`）。
    覆盖模型登记与版本、推理服务/任务、模型评测、模型反馈、数据缺口与数据需求闭环。

    - 本文件是设计基线，不代表阶段 5 已实现。
    - 所有项目路由由服务端强制 project scope；不信任客户端 project_id。
    - 写动作使用 If-Match；缺失 428，失配 409；创建与动作支持 Idempotency-Key。
    - 错误体统一 {"error": {"code", "message", "request_id", "details?"}}。
    - DDP 不建设训练/推理集群，不托管模型权重；只保存产物引用、服务端点与结果引用。
    - 真实评测/推理依赖外部 Adapter；未配置时返回 503 `model_adapter_unavailable`，不得伪造成功。
  contact:
    name: DDP System Architect
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: models
    description: 模型容器与生命周期
  - name: model-versions
    description: 模型版本、产物校验与发布
  - name: evaluations
    description: 冻结数据集上的模型评测、指标与结论
  - name: inference
    description: 外部推理服务与推理任务登记
  - name: model-feedback
    description: 结构化模型问题与数据缺口
  - name: data-requirements
    description: 数据需求闭环与满足/复测关联
  - name: model-adapters
    description: 模型平台 Adapter 回调（HMAC）
paths:
  /api/v1/projects/{project_id}/models:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listModels
      tags: [models]
      summary: 模型列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ModelStatus" }
        - name: task_type
          in: query
          schema: { $ref: "#/components/schemas/ModelTaskType" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 模型分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createModel
      tags: [models]
      summary: 创建模型（DRAFT）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelCreate" }
      responses:
        "201":
          description: 模型已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getModel
      tags: [models]
      summary: 模型详情
      responses:
        "200":
          description: 模型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateModel
      tags: [models]
      summary: 修改模型（If-Match）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelPatch" }
      responses:
        "200":
          description: 修改后的模型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/models/{model_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ModelId"
      - $ref: "#/components/parameters/ModelAction"
    post:
      operationId: actOnModel
      tags: [models]
      summary: 模型动作（activate/deprecate/archive/restore）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的模型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/models/{model_id}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: listModelVersions
