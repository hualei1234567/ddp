        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/model-feedback/{feedback_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/FeedbackId"
      - $ref: "#/components/parameters/FeedbackAction"
    post:
      operationId: actOnModelFeedback
      tags: [model-feedback]
      summary: 反馈动作（triage/dismiss/resolve/create-requirement）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackActionRequest" }
      responses:
        "200":
          description: 动作后的反馈
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "201":
          description: 已创建数据需求
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/data-gaps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getDataGapSummary
      tags: [model-feedback]
      summary: 数据缺口聚合（来自 OPEN/TRIAGED 反馈）
      parameters:
        - name: dimension_type
          in: query
          schema: { $ref: "#/components/schemas/GapDimensionType" }
      responses:
        "200":
          description: 缺口汇总
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataGapSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/data-requirements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listDataRequirements
      tags: [data-requirements]
      summary: 数据需求列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RequirementStatus" }
        - name: priority
          in: query
          schema: { type: string, enum: [P0, P1, P2, P3] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 需求分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createDataRequirement
      tags: [data-requirements]
      summary: 创建数据需求（DRAFT）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequirementCreate" }
      responses:
        "201":
          description: 需求已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRequirement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/data-requirements/{requirement_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
    get:
      operationId: getDataRequirement
      tags: [data-requirements]
      summary: 数据需求详情
      responses:
        "200":
          description: 数据需求
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRequirement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/data-requirements/{requirement_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/RequirementAction"
    post:
      operationId: actOnDataRequirement
      tags: [data-requirements]
      summary: 需求动作（submit/approve/reject/plan/start/satisfy/close/cancel/link-retest）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequirementActionRequest" }
      responses:
        "200":
          description: 动作后的需求
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRequirement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/integrations/model-adapters/{adapter_id}/callbacks:
    parameters:
      - $ref: "#/components/parameters/AdapterId"
    post:
      operationId: receiveModelAdapterCallback
      tags: [model-adapters]
      summary: 模型 Adapter 回调（HMAC；评测/推理结果）
      parameters:
        - $ref: "#/components/parameters/CallbackSignature"
        - $ref: "#/components/parameters/CallbackTimestamp"
        - $ref: "#/components/parameters/CallbackNonce"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelAdapterCallback" }
      responses:
        "204":
          description: 已处理
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adapterHmac:
      type: apiKey
      in: header
      name: X-DDP-Signature
      description: HMAC-SHA256(secret, timestamp + "." + nonce + "." + raw_body)，sha256=<hex>。
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelId:
      name: model_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelVersionId:
      name: version_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvaluationId:
      name: evaluation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InferenceServiceId:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InferenceTaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeedbackId:
      name: feedback_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequirementId:
      name: requirement_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdapterId:
      name: adapter_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    ModelAction:
      name: action
      in: path
      required: true
      schema: { type: string, enum: [activate, deprecate, archive, restore] }
    ModelVersionAction:
      name: action
      in: path
      required: true
      description: 发布（publish）要求 OWNER 且发布人不得是唯一创建人。
      schema: { type: string, enum: [validate, publish, deprecate, archive, return-draft] }
    EvaluationAction:
      name: action
      in: path
      required: true
      schema: { type: string, enum: [cancel, retry] }
    InferenceServiceAction:
      name: action
      in: path
      required: true
      schema: { type: string, enum: [deploy, activate, stop, retire] }
    InferenceTaskAction:
      name: action
      in: path
      required: true
      schema: { type: string, enum: [cancel] }
    FeedbackAction:
      name: action
      in: path
      required: true
      schema: { type: string, enum: [triage, dismiss, resolve, create-requirement] }
    RequirementAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum: [submit, approve, reject, plan, start, satisfy, close, cancel, link-retest]
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
    CallbackSignature:
      name: X-DDP-Signature
      in: header
      required: true
      schema: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    CallbackTimestamp:
      name: X-DDP-Timestamp
      in: header
      required: true
      schema: { type: integer, minimum: 0 }
    CallbackNonce:
      name: X-DDP-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    BadRequest: { description: 请求非法, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: 未认证, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: 无权限, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: 不存在或跨项目, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: 冲突/状态不允许, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Gone: { description: 已撤销/过期, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: 校验失败, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    PreconditionRequired: { description: 缺少 If-Match, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    TooManyRequests: { description: 限流, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    ServiceUnavailable: { description: 外部依赖不可用, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, minLength: 1, maxLength: 100 }
            message: { type: string, minLength: 1, maxLength: 2000 }
            request_id: { type: [string, "null"], maxLength: 128 }
            details: { type: [object, "null"], additionalProperties: true }
    ModelStatus: { type: string, enum: [DRAFT, ACTIVE, DEPRECATED, ARCHIVED] }
    ModelTaskType: { type: string, enum: [IMITATION, REINFORCEMENT, VLM, OTHER] }
    ModelVersionStatus:
      type: string
      enum: [DRAFT, VALIDATING, VALIDATION_FAILED, READY, RELEASED, DEPRECATED, ARCHIVED]
    EvaluationStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
    EvaluationVerdict: { type: string, enum: [PASS, FAIL, UNKNOWN] }
    InferenceServiceStatus: { type: string, enum: [PENDING, DEPLOYING, ACTIVE, STOPPED, FAILED, RETIRED] }
    InferenceServiceEnvironment: { type: string, enum: [DEV, STAGING, PROD] }
    InferenceTaskStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
    HealthStatus: { type: string, enum: [UNKNOWN, HEALTHY, UNHEALTHY] }
    FeedbackStatus: { type: string, enum: [OPEN, TRIAGED, REQUIREMENT_CREATED, RESOLVED, DISMISSED] }
    FeedbackIssueType:
      type: string
      enum: [ACTION_COVERAGE, SCENE_COVERAGE, LONG_TAIL, VIEWPOINT, GENERALIZATION, LABEL_GAP, DATA_QUALITY, OTHER]
    FeedbackSeverity: { type: string, enum: [BLOCKER, MAJOR, MINOR] }
    GapDimensionType: { type: string, enum: [SCENE, ACTION, ROBOT, DEVICE, LABEL, MODALITY] }
    RequirementStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, PLANNED, IN_PROGRESS, SATISFIED, CLOSED, REJECTED, CANCELLED]
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, "null"], maxLength: 2000 }
        comment: { type: [string, "null"], maxLength: 2000 }
        evidence_refs: { type: array, items: { type: string, maxLength: 1024 }, uniqueItems: true }
        payload: { type: [object, "null"], additionalProperties: true }
    ModelArtifact:
      type: object
      required: [object_key, sha256, size_bytes, format]
      additionalProperties: false
      properties:
        object_key: { type: string, minLength: 1, maxLength: 1024 }
        sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        size_bytes: { type: integer, minimum: 1 }
        format: { type: string, enum: [ONNX, TORCHSCRIPT, SAFETENSORS, TENSORRT, OTHER] }
    ModelRuntime:
      type: object
      required: [framework, framework_version]
      additionalProperties: false
      properties:
        framework: { type: string, minLength: 1, maxLength: 100 }
        framework_version: { type: string, minLength: 1, maxLength: 100 }
        python_version: { type: [string, "null"], maxLength: 32 }
        cuda_version: { type: [string, "null"], maxLength: 32 }
        image_ref: { type: [string, "null"], maxLength: 512 }
    ModelCreate:
      type: object
      required: [code, name, task_type, framework, owner_id]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        task_type: { $ref: "#/components/schemas/ModelTaskType" }
        framework: { type: string, minLength: 1, maxLength: 100 }
        owner_id: { type: string, format: uuid }
        tags: { type: array, items: { type: string, maxLength: 64 }, uniqueItems: true }
    ModelPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        framework: { type: [string, "null"], minLength: 1, maxLength: 100 }
        tags: { type: array, items: { type: string, maxLength: 64 }, uniqueItems: true }
    Model:
      type: object
      required: [model_id, project_id, code, name, task_type, framework, owner_id, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        model_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        task_type: { $ref: "#/components/schemas/ModelTaskType" }
        framework: { type: string }
        owner_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ModelStatus" }
        current_version_id: { type: [string, "null"], format: uuid }
        tags: { type: array, items: { type: string } }
        allowed_actions: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelVersionCreate:
      type: object
      required: [artifact, runtime]
      additionalProperties: false
      properties:
        artifact: { $ref: "#/components/schemas/ModelArtifact" }
        runtime: { $ref: "#/components/schemas/ModelRuntime" }
        training_request_id: { type: [string, "null"], format: uuid }
        training_delivery_id: { type: [string, "null"], format: uuid }
        external_ref_id: { type: [string, "null"], format: uuid }
        dataset_version_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        metrics_summary: { type: object, additionalProperties: true }
        release_notes: { type: [string, "null"], maxLength: 4000 }
    ModelVersion:
      type: object
      required: [model_version_id, model_id, project_id, version_no, status, artifact, runtime, version, created_at, updated_at]
      additionalProperties: false
      properties:
        model_version_id: { type: string, format: uuid }
        model_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/ModelVersionStatus" }
        artifact: { $ref: "#/components/schemas/ModelArtifact" }
        runtime: { $ref: "#/components/schemas/ModelRuntime" }
        training_request_id: { type: [string, "null"], format: uuid }
        training_delivery_id: { type: [string, "null"], format: uuid }
        external_ref_id: { type: [string, "null"], format: uuid }
        dataset_version_ids: { type: array, items: { type: string, format: uuid } }
        metrics_summary: { type: object, additionalProperties: true }
        release_notes: { type: [string, "null"] }
        validated_at: { type: [string, "null"], format: date-time }
        released_by: { type: [string, "null"], format: uuid }
        released_at: { type: [string, "null"], format: date-time }
        deprecated_at: { type: [string, "null"], format: date-time }
        deprecation_reason: { type: [string, "null"] }
        allowed_actions: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EvaluationCreate:
      type: object
      required: [model_version_id, dataset_version_id, metrics, thresholds]
      additionalProperties: false
      properties:
        model_version_id: { type: string, format: uuid }
        dataset_version_id: { type: string, format: uuid }
        baseline_evaluation_id: { type: [string, "null"], format: uuid }
        metrics: { type: object, additionalProperties: { type: number } }
        thresholds:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              min: { type: [number, "null"] }
              max: { type: [number, "null"] }
        adapter_id: { type: string, minLength: 1, maxLength: 100 }
    Evaluation:
      type: object
      required: [evaluation_id, project_id, model_version_id, dataset_version_id, status, metrics, thresholds, verdict, version, created_at, updated_at]
      additionalProperties: false
      properties:
        evaluation_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        model_version_id: { type: string, format: uuid }
        dataset_version_id: { type: string, format: uuid }
        baseline_evaluation_id: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/EvaluationStatus" }
        metrics: { type: object, additionalProperties: { type: number } }
        thresholds: { type: object, additionalProperties: true }
        verdict: { $ref: "#/components/schemas/EvaluationVerdict" }
        report_ref: { type: [object, "null"], additionalProperties: true }
        error_code: { type: [string, "null"] }
        error_summary: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        allowed_actions: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InferenceServiceCreate:
      type: object
      required: [model_version_id, environment, endpoint_url]
      additionalProperties: false
      properties:
        model_version_id: { type: string, format: uuid }
        environment: { $ref: "#/components/schemas/InferenceServiceEnvironment" }
        endpoint_url: { type: string, format: uri, maxLength: 1024 }
        resource_ref: { type: [string, "null"], maxLength: 512 }
        config: { type: object, additionalProperties: true }
    InferenceService:
      type: object
      required: [service_id, project_id, model_version_id, environment, endpoint_url, status, health_status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        model_version_id: { type: string, format: uuid }
        environment: { $ref: "#/components/schemas/InferenceServiceEnvironment" }
        endpoint_url: { type: string, format: uri }
        resource_ref: { type: [string, "null"] }
        config: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/InferenceServiceStatus" }
        health_status: { $ref: "#/components/schemas/HealthStatus" }
        deployed_at: { type: [string, "null"], format: date-time }
        stopped_at: { type: [string, "null"], format: date-time }
        allowed_actions: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InferenceTaskCreate:
      type: object
      required: [model_version_id]
      additionalProperties: false
      properties:
        model_version_id: { type: string, format: uuid }
        service_id: { type: [string, "null"], format: uuid }
        dataset_version_id: { type: [string, "null"], format: uuid }
        episode_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        adapter_id: { type: string, minLength: 1, maxLength: 100 }
        config: { type: object, additionalProperties: true }
    InferenceTask:
      type: object
      required: [task_id, project_id, model_version_id, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        task_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        model_version_id: { type: string, format: uuid }
        service_id: { type: [string, "null"], format: uuid }
        dataset_version_id: { type: [string, "null"], format: uuid }
        episode_ids: { type: array, items: { type: string, format: uuid } }
        status: { $ref: "#/components/schemas/InferenceTaskStatus" }
        result_ref: { type: [object, "null"], additionalProperties: true }
        metrics: { type: object, additionalProperties: { type: number } }
        log_ref: { type: [string, "null"], maxLength: 1024 }
        error_code: { type: [string, "null"] }
        error_summary: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        allowed_actions: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GapDimension:
      type: object
      required: [dimension_type, dimension_value]
      additionalProperties: false
      properties:
        dimension_type: { $ref: "#/components/schemas/GapDimensionType" }
        dimension_value: { type: string, minLength: 1, maxLength: 200 }
        current_count: { type: [integer, "null"], minimum: 0 }
        target_count: { type: [integer, "null"], minimum: 0 }
    FeedbackCreate:
      type: object
      required: [model_version_id, issue_type, severity, description, dimensions]
      additionalProperties: false
      properties:
        model_version_id: { type: string, format: uuid }
        evaluation_id: { type: [string, "null"], format: uuid }
        inference_task_id: { type: [string, "null"], format: uuid }
        issue_type: { $ref: "#/components/schemas/FeedbackIssueType" }
        severity: { $ref: "#/components/schemas/FeedbackSeverity" }
        description: { type: string, minLength: 1, maxLength: 4000 }
        dimensions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GapDimension" }
        evidence_refs: { type: array, items: { type: string, maxLength: 1024 }, uniqueItems: true }
    Feedback:
      type: object
      required: [feedback_id, project_id, model_version_id, issue_type, severity, description, dimensions, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        feedback_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        model_version_id: { type: string, format: uuid }
        evaluation_id: { type: [string, "null"], format: uuid }
        inference_task_id: { type: [string, "null"], format: uuid }
        issue_type: { $ref: "#/components/schemas/FeedbackIssueType" }
        severity: { $ref: "#/components/schemas/FeedbackSeverity" }
        description: { type: string }
        dimensions: { type: array, items: { $ref: "#/components/schemas/GapDimension" } }
        evidence_refs: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/FeedbackStatus" }
        converted_requirement_id: { type: [string, "null"], format: uuid }
        resolution_note: { type: [string, "null"] }
        allowed_actions: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FeedbackActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, "null"], maxLength: 2000 }
        resolution_note: { type: [string, "null"], maxLength: 2000 }
        requirement_code: { type: [string, "null"], maxLength: 64 }
        requirement_title: { type: [string, "null"], maxLength: 200 }
        target_episode_count: { type: [integer, "null"], minimum: 1 }
        due_at: { type: [string, "null"], format: date-time }
        priority: { type: [string, "null"], enum: [P0, P1, P2, P3] }
    RequirementCreate:
      type: object
      required: [code, title, source_type, dimensions]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 4000 }
        source_type: { type: string, enum: [MODEL_FEEDBACK, EVALUATION, MANUAL, OPERATION] }
        source_feedback_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        source_evaluation_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        dimensions: { type: array, minItems: 1, items: { $ref: "#/components/schemas/GapDimension" } }
        target_episode_count: { type: integer, minimum: 1 }
        quality_thresholds: { type: object, additionalProperties: true }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        due_at: { type: [string, "null"], format: date-time }
        owner_id: { type: string, format: uuid }
    DataRequirement:
      type: object
      required: [requirement_id, project_id, code, title, source_type, dimensions, priority, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        requirement_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        source_type: { type: string }
        source_feedback_ids: { type: array, items: { type: string, format: uuid } }
        source_evaluation_ids: { type: array, items: { type: string, format: uuid } }
        dimensions: { type: array, items: { $ref: "#/components/schemas/GapDimension" } }
        target_episode_count: { type: integer, minimum: 1 }
        quality_thresholds: { type: object, additionalProperties: true }
        priority: { type: string }
        due_at: { type: [string, "null"], format: date-time }
        owner_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RequirementStatus" }
        linked_dataset_version_ids: { type: array, items: { type: string, format: uuid } }
        retest_evaluation_ids: { type: array, items: { type: string, format: uuid } }
        satisfied_at: { type: [string, "null"], format: date-time }
        satisfaction_evidence_ref: { type: [string, "null"], maxLength: 1024 }
        allowed_actions: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RequirementActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, "null"], maxLength: 2000 }
        dataset_version_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        evaluation_id: { type: [string, "null"], format: uuid }
        satisfaction_evidence_ref: { type: [string, "null"], maxLength: 1024 }
    DataGapSummary:
      type: object
      required: [items, freshness]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [dimension_type, dimension_value, open_feedback_count, suggested_episode_count]
            additionalProperties: false
            properties:
              dimension_type: { $ref: "#/components/schemas/GapDimensionType" }
              dimension_value: { type: string }
              open_feedback_count: { type: integer, minimum: 0 }
              current_count: { type: [integer, "null"], minimum: 0 }
              target_count: { type: [integer, "null"], minimum: 0 }
              suggested_episode_count: { type: integer, minimum: 0 }
              requirement_ids: { type: array, items: { type: string, format: uuid } }
        freshness: { type: string, enum: [FRESH, STALE, UNKNOWN] }
    ModelAdapterCallback:
      type: object
      required: [event_id, adapter_version, event_type]
      additionalProperties: false
      properties:
        event_id: { type: string, minLength: 1, maxLength: 128 }
        adapter_version: { type: string, minLength: 1, maxLength: 100 }
        event_type: { type: string, enum: [evaluation.completed, evaluation.failed, inference.completed, inference.failed] }
        evaluation_id: { type: [string, "null"], format: uuid }
        task_id: { type: [string, "null"], format: uuid }
        metrics: { type: object, additionalProperties: { type: number } }
        verdict: { type: [string, "null"], enum: [PASS, FAIL, UNKNOWN] }
        report_ref: { type: [object, "null"], additionalProperties: true }
        result_ref: { type: [object, "null"], additionalProperties: true }
        log_ref: { type: [string, "null"], maxLength: 1024 }
        error_code: { type: [string, "null"], maxLength: 100 }
        error_summary: { type: [string, "null"], maxLength: 2000 }
    ModelPage:
      type: object
