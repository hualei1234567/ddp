              schema: { $ref: "#/components/schemas/ModelVersionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createModelVersion
      tags: [model-versions]
      summary: 创建模型版本（DRAFT）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelVersionCreate" }
      responses:
        "201":
          description: 版本已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/models/{model_id}/versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ModelId"
      - $ref: "#/components/parameters/ModelVersionId"
    get:
