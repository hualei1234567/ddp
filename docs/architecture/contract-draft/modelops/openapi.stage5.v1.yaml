      summary: 推理服务列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/InferenceServiceStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 服务分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InferenceServicePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createInferenceService
      tags: [inference]
      summary: 登记推理服务（PENDING）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InferenceServiceCreate" }
      responses:
        "201":
          description: 服务已登记
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InferenceService" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/inference-services/{service_id}:
