      summary: 训练交付列表
      parameters:
        - name: training_request_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TrainingDeliveryStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 交付分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingDeliveryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createTrainingDelivery
      tags: [training-deliveries]
      summary: 创建交付单（校验 revision/版本/导出/校验和）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingDeliveryCreate" }
      responses:
        "201":
          description: 交付单已创建
          content:
            application/json:
              schema: { $ref: "./training-delivery.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/training-deliveries/{delivery_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DeliveryId"
    get:
      operationId: getTrainingDelivery
      tags: [training-deliveries]
      summary: 交付详情
      responses:
        "200":
          description: 交付详情
          content:
            application/json:
              schema: { $ref: "./training-delivery.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/training-deliveries/{delivery_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DeliveryId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnTrainingDelivery
      tags: [training-deliveries]
      summary: 交付动作（ready/deliver/accept/reject/rework/cancel；验收人不得是唯一交付人）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的交付
          content:
            application/json:
              schema: { $ref: "./training-delivery.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/training-deliveries/{delivery_id}/external-references:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DeliveryId"
    get:
      operationId: listExternalTrainingReferences
      tags: [training-adapters]
      summary: 交付关联的外部训练引用
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 外部引用分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalTrainingReferencePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createExternalTrainingReference
      tags: [training-adapters]
      summary: 提交外部训练引用（Adapter 幂等；不支持能力显式 Unsupported）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalTrainingReferenceCreate" }
      responses:
        "202":
          description: 外部提交已受理
          content:
            application/json:
              schema: { $ref: "./external-training-reference.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/external-training-references/{external_ref_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExternalRefId"
    get:
      operationId: getExternalTrainingReference
      tags: [training-adapters]
      summary: 外部训练引用详情（未知/不可达显示 Unknown/Stale）
      responses:
        "200":
          description: 外部引用详情
          content:
            application/json:
              schema: { $ref: "./external-training-reference.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/external-training-references/{external_ref_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExternalRefId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnExternalTrainingReference
      tags: [training-adapters]
      summary: 外部引用动作（sync/cancel；取消需 Adapter 支持）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的外部引用
          content:
            application/json:
              schema: { $ref: "./external-training-reference.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/integrations/training-adapters/{adapter_id}/callbacks:
    parameters:
      - $ref: "#/components/parameters/AdapterId"
    post:
      operationId: receiveTrainingAdapterCallback
      tags: [training-adapters]
      summary: Adapter 回调（HMAC-SHA256 + 时间窗 + nonce 防重放；幂等）
      security:
        - adapterHmac: []
      parameters:
        - $ref: "#/components/parameters/CallbackSignature"
        - $ref: "#/components/parameters/CallbackTimestamp"
        - $ref: "#/components/parameters/CallbackNonce"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdapterCallbackPayload" }
      responses:
        "204":
          description: 回调已接受（重复回调幂等，不重复更新）
        "400": { $ref: "#/components/responses/UnprocessableEntity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/lineage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    get:
      operationId: getDatasetLineage
      tags: [lineage]
      summary: 数据集血缘（正反向、深度 1–5、只追加）
      parameters:
        - $ref: "#/components/parameters/LineageDirection"
        - $ref: "#/components/parameters/LineageDepth"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 血缘边分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/training-requests/{request_id}/lineage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getTrainingRequestLineage
      tags: [lineage]
      summary: 训练需求全链路血缘（Revision → Delivery → ExportJob → DatasetVersion → Episode → Annotation → RawAsset）
      parameters:
        - $ref: "#/components/parameters/LineageDirection"
        - $ref: "#/components/parameters/LineageDepth"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 血缘边分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adapterHmac:
      type: apiKey
      in: header
      name: X-DDP-Signature
      description: |
        外部训练平台回调签名。算法：HMAC-SHA256(secret, timestamp + "." + nonce + "." + raw_body)，
        以 `sha256=<hex>` 传输；同时携带 X-DDP-Timestamp（Unix 秒）与 X-DDP-Nonce。
        时间窗默认 ±300 秒；nonce 在窗口内不得重复；重放返回 409 training_callback_replayed。
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: version_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DedupPolicyId:
      name: dedup_policy_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SplitPolicyId:
      name: split_policy_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeakagePolicyId:
      name: leakage_policy_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportJobId:
      name: export_job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExternalRefId:
      name: external_ref_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdapterId:
      name: adapter_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    AssetRefTypePath:
      name: asset_ref_type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AssetRefType" }
    AssetRefId:
      name: asset_ref_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Action:
      name: action
      in: path
      required: true
      description: 服务端白名单动作；非法动作返回 422 validation_failed
      schema: { type: string, minLength: 1, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 乐观锁版本，格式 "3"
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键；作用域 (project_id, user_id, key)，至少 24h
      schema: { type: string, minLength: 8, maxLength: 128 }
    CallbackSignature:
      name: X-DDP-Signature
      in: header
      required: true
      description: HMAC-SHA256 签名，格式 sha256=<hex>
      schema: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    CallbackTimestamp:
      name: X-DDP-Timestamp
      in: header
      required: true
      description: Unix 秒；与服务器时间偏差超过 300 秒拒绝
      schema: { type: integer, minimum: 0 }
    CallbackNonce:
      name: X-DDP-Nonce
      in: header
      required: true
      description: 时间窗内唯一；重放拒绝
      schema: { type: string, minLength: 8, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    LineageDirection:
      name: direction
      in: query
      required: false
      schema: { type: string, enum: [FORWARD, BACKWARD, BOTH], default: BOTH }
    LineageDepth:
      name: depth
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 5, default: 1 }
  responses:
    Unauthorized:
      description: 未登录、Token 失效或回调签名非法
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: 权限不足、职责分离违规、项目范围拒绝
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: 同项目内不存在；跨项目统一不可见
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: 状态/版本/幂等/业务冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnprocessableEntity:
      description: 参数/格式/业务校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PreconditionRequired:
      description: 缺少 If-Match
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: 触发限流
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Gone:
      description: 资源已过期、撤销或取消
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServiceUnavailable:
      description: 对象存储/索引/outbox/外部依赖不可用
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, minLength: 1, maxLength: 100 }
            message: { type: string, minLength: 1, maxLength: 2000 }
            request_id: { type: [string, "null"], maxLength: 128 }
            details: { type: [object, "null"], additionalProperties: true }
    AssetRefType:
      type: string
      enum: [RAW_ASSET, EPISODE, ANNOTATION, DATASET_VERSION]
    FreshnessStatus:
      type: string
      enum: [FRESH, STALE, PARTIAL, UNKNOWN]
    DatasetStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    DatasetPurpose:
      type: string
      enum: [TRAINING, EVALUATION, BENCHMARK, OTHER]
    DatasetUsagePolicy:
      type: string
      enum: [TRAINING_ALLOWED, TRAINING_DENIED, UNKNOWN]
    DatasetVersionStatus:
      type: string
      enum: [DRAFT, BUILDING, VALIDATING, READY, FROZEN, SUPERSEDED, VALIDATION_FAILED, CANCELLED, ARCHIVED]
    ValidityStatus:
      type: string
      enum: [VALID, STALE, INVALIDATED, UNKNOWN]
    SplitName:
      type: string
      enum: [TRAIN, VALIDATION, TEST]
    LeakageStatus:
      type: string
      enum: [PASS, WARN, FAIL, UNKNOWN, WAIVED]
    ExportJobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, PARTIAL, CANCELLED]
    ExportFormat:
      type: string
      enum: [LE_ROBOT]
    TrainingRequestStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PENDING_REVIEW, APPROVED, IN_DELIVERY, DELIVERED, ACCEPTED, CLOSED, REJECTED, REVISION_REQUIRED, BLOCKED, CANCELLED]
    RevisionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PENDING_REVIEW, APPROVED, REJECTED, SUPERSEDED]
    TrainingDeliveryStatus:
      type: string
      enum: [DRAFT, READY, DELIVERED, ACCEPTED, REJECTED, REWORK, CANCELLED]
    ExternalStatus:
      type: string
      enum: [SUBMITTED, RUNNING, SUCCEEDED, FAILED, CANCELLED, UNKNOWN, UNAVAILABLE]
    GrantStatus:
      type: string
      enum: [PENDING_APPROVAL, ACTIVE, REJECTED, EXPIRED, REVOKED]
    GrantScope:
      type: string
      enum: [VIEW, DOWNLOAD, EXPORT]
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, "null"], maxLength: 2000 }
        comment: { type: [string, "null"], maxLength: 2000 }
        evidence_refs: { type: array, items: { type: string, maxLength: 1024 }, uniqueItems: true }
        payload: { type: [object, "null"], additionalProperties: true }
    DatasetCreate:
      type: object
      required: [code, name, purpose, owner_id, usage_policy]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        purpose: { $ref: "#/components/schemas/DatasetPurpose" }
        owner_id: { type: string, format: uuid }
        tags: { type: array, items: { type: string, maxLength: 64 }, uniqueItems: true }
        usage_policy: { $ref: "#/components/schemas/DatasetUsagePolicy" }
        retention_policy: { type: [object, "null"], additionalProperties: true }
        default_dedup_policy_id: { type: [string, "null"], format: uuid }
        default_split_policy_id: { type: [string, "null"], format: uuid }
        default_leakage_policy_id: { type: [string, "null"], format: uuid }
    DatasetPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        purpose: { $ref: "#/components/schemas/DatasetPurpose" }
        tags: { type: array, items: { type: string, maxLength: 64 }, uniqueItems: true }
        usage_policy: { $ref: "#/components/schemas/DatasetUsagePolicy" }
        retention_policy: { type: [object, "null"], additionalProperties: true }
        default_dedup_policy_id: { type: [string, "null"], format: uuid }
        default_split_policy_id: { type: [string, "null"], format: uuid }
        default_leakage_policy_id: { type: [string, "null"], format: uuid }
    DatasetVersionCreate:
      type: object
      required: [selection_rule_version, selection_filters, dedup_policy_id, dedup_policy_version, split_policy_id, split_policy_version, leakage_policy_id, leakage_policy_version, quality_policy_id, quality_policy_version]
      additionalProperties: false
      properties:
        selection_rule_version: { type: string, minLength: 1, maxLength: 64 }
        selection_filters: { type: object, additionalProperties: true }
        dedup_policy_id: { type: string, format: uuid }
        dedup_policy_version: { type: integer, minimum: 1 }
        split_policy_id: { type: string, format: uuid }
        split_policy_version: { type: integer, minimum: 1 }
        leakage_policy_id: { type: string, format: uuid }
        leakage_policy_version: { type: integer, minimum: 1 }
        quality_policy_id: { type: string, format: uuid }
        quality_policy_version: { type: integer, minimum: 1 }
        supersedes_version_id: { type: [string, "null"], format: uuid }
        build_now: { type: boolean, default: false }
    DatasetVersionPatch:
      type: object
      additionalProperties: false
      properties:
        selection_rule_version: { type: string, minLength: 1, maxLength: 64 }
        selection_filters: { type: object, additionalProperties: true }
        dedup_policy_id: { type: string, format: uuid }
        dedup_policy_version: { type: integer, minimum: 1 }
        split_policy_id: { type: string, format: uuid }
        split_policy_version: { type: integer, minimum: 1 }
        leakage_policy_id: { type: string, format: uuid }
        leakage_policy_version: { type: integer, minimum: 1 }
        quality_policy_id: { type: string, format: uuid }
        quality_policy_version: { type: integer, minimum: 1 }
    SelectionPreviewRequest:
      type: object
      required: [selection_filters, dedup_policy_id, dedup_policy_version, split_policy_id, split_policy_version, leakage_policy_id, leakage_policy_version]
      additionalProperties: false
      properties:
        selection_filters: { type: object, additionalProperties: true }
        dedup_policy_id: { type: string, format: uuid }
        dedup_policy_version: { type: integer, minimum: 1 }
        split_policy_id: { type: string, format: uuid }
        split_policy_version: { type: integer, minimum: 1 }
        leakage_policy_id: { type: string, format: uuid }
        leakage_policy_version: { type: integer, minimum: 1 }
        sample_limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
    DedupPolicyCreate:
      type: object
      required: [exact_keys, near_duplicate_enabled, near_duplicate_enforcement, retain_rule]
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 200 }
        exact_keys:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [EPISODE_LINEAGE, MANIFEST_SHA256, RAW_ASSET_SHA256] }
        near_duplicate_enabled: { type: boolean, default: false }
        near_duplicate_enforcement: { type: string, enum: [WARN_ONLY, BLOCK], default: WARN_ONLY }
        similarity_method: { type: [string, "null"], maxLength: 100 }
        similarity_threshold: { type: [number, "null"], minimum: 0, maximum: 1 }
        similarity_min_cluster_size: { type: [integer, "null"], minimum: 2 }
        grouping_keys: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        retain_rule: { type: string, enum: [NEWEST_ACCEPTED, HIGHEST_QUALITY, EARLIEST, MANUAL] }
    SplitPolicyCreate:
      type: object
      required: [strategy, seed, group_by, empty_split_policy, min_item_count, min_duration_ns, rounding_rule]
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 200 }
        strategy: { type: string, enum: [RATIO, FIXED_COUNT] }
        train_ratio: { type: number, minimum: 0, maximum: 1, default: 0.8 }
        validation_ratio: { type: number, minimum: 0, maximum: 1, default: 0.1 }
        test_ratio: { type: number, minimum: 0, maximum: 1, default: 0.1 }
        train_count: { type: [integer, "null"], minimum: 1 }
        validation_count: { type: [integer, "null"], minimum: 1 }
        test_count: { type: [integer, "null"], minimum: 0 }
        seed: { type: integer, minimum: 0 }
        stratify_by: { type: array, items: { type: string, enum: [SCENE, ACTION, ROBOT, DEVICE, LABEL, QUALITY_STATUS] }, uniqueItems: true }
        group_by: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [EPISODE_LINEAGE, MANIFEST_SHA256, RAW_ASSET_SHA256, SIMILARITY_GROUP, SCENE_GROUP] }, default: [EPISODE_LINEAGE] }
        empty_split_policy: { type: string, enum: [FAIL, ALLOW_EMPTY_TEST], default: FAIL }
        min_item_count: { type: integer, minimum: 1, default: 1 }
        min_duration_ns: { type: integer, minimum: 0, default: 0 }
        rounding_rule: { type: string, enum: [FLOOR, ROUND_HALF_UP, LARGEST_REMAINDER], default: LARGEST_REMAINDER }
    LeakagePolicyCreate:
      type: object
      required: [hard_rules, soft_rules, waiver_allowed_rules]
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 200 }
        hard_rules:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [EPISODE_LINEAGE_CROSS_SPLIT, MANIFEST_SHA256_CROSS_SPLIT, RAW_ASSET_SHA256_CROSS_SPLIT, SIMILARITY_GROUP_CROSS_SPLIT] }
        soft_rules:
          type: array
          uniqueItems: true
          items: { type: string, enum: [SCENE_GROUP_CROSS_SPLIT, BATCH_GROUP_CROSS_SPLIT, TEMPORAL_OVERLAP_CROSS_SPLIT, DUPLICATE_ANNOTATION] }
        waiver_allowed_rules:
          type: array
          uniqueItems: true
          items: { type: string, enum: [SCENE_GROUP_CROSS_SPLIT, BATCH_GROUP_CROSS_SPLIT, TEMPORAL_OVERLAP_CROSS_SPLIT, DUPLICATE_ANNOTATION] }
        similarity_grouping_enabled: { type: boolean, default: false }
        scene_grouping_enabled: { type: boolean, default: true }
        batch_grouping_enabled: { type: boolean, default: false }
        temporal_overlap_enabled: { type: boolean, default: true }
    DatasetGrantCreate:
      type: object
      required: [grantee_project_id, scope, reason, expires_at]
      additionalProperties: false
      properties:
        dataset_version_id: { type: [string, "null"], format: uuid }
        grantee_project_id: { type: string, format: uuid }
        grantee_team: { type: [string, "null"], maxLength: 200 }
        scope:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/GrantScope" }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expires_at: { type: string, format: date-time }
    ExportJobCreate:
      type: object
      required: [dataset_version_id, format, format_version, exporter_id, exporter_version, mapping_version, config]
      additionalProperties: false
      properties:
        dataset_version_id: { type: string, format: uuid }
        format: { $ref: "#/components/schemas/ExportFormat" }
        format_version: { type: string, const: ddp.lerobot/1.0.0 }
        exporter_id: { type: string, minLength: 1, maxLength: 100 }
        exporter_version: { type: string, minLength: 1, maxLength: 100 }
        mapping_version: { type: string, minLength: 1, maxLength: 100 }
        config: { type: object, additionalProperties: true }
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400, default: 3600 }
        max_attempts: { type: integer, minimum: 1, maximum: 20, default: 3 }
    TrainingRequestCreate:
      type: object
      required: [code, title, owner_id, priority, snapshot]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        owner_id: { type: string, format: uuid }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        snapshot: { $ref: "#/components/schemas/RequirementSnapshot" }
    TrainingRequestRevisionCreate:
      type: object
      required: [snapshot, change_reason]
      additionalProperties: false
      properties:
        snapshot: { $ref: "#/components/schemas/RequirementSnapshot" }
        change_reason: { type: string, minLength: 1, maxLength: 2000 }
    TrainingRequestRevisionPatch:
      type: object
      additionalProperties: false
      properties:
        snapshot: { $ref: "#/components/schemas/RequirementSnapshot" }
        change_reason: { type: [string, "null"], maxLength: 2000 }
    RequirementSnapshot:
      type: object
      required: [business_goal, model_type, training_type, data_modalities, scene_targets, action_targets, robot_targets, device_targets, required_labels, required_schema_versions, target_episode_count, target_duration_ns, quality_thresholds, split_requirements, format, format_version, delivery_due_at, acceptance_method, priority]
      additionalProperties: false
      properties:
        business_goal: { type: string, minLength: 1, maxLength: 2000 }
        model_type: { type: string, minLength: 1, maxLength: 100 }
        training_type: { type: string, enum: [SUPERVISED, IMITATION, RL, FINE_TUNE, OTHER] }
        data_modalities: { type: array, minItems: 1, items: { type: string, maxLength: 64 }, uniqueItems: true }
        scene_targets: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        action_targets: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        robot_targets: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        device_targets: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        required_labels: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        required_schema_versions:
          type: array
          items:
            type: object
            required: [schema_id, schema_version]
            additionalProperties: false
            properties:
              schema_id: { type: string, format: uuid }
              schema_version: { type: integer, minimum: 1 }
        target_episode_count: { type: [integer, "null"], minimum: 1 }
        target_duration_ns: { type: [integer, "null"], minimum: 1 }
        quality_thresholds: { type: object, additionalProperties: true }
        split_requirements:
          type: [object, "null"]
          additionalProperties: false
          properties:
            train_ratio: { type: number, minimum: 0, maximum: 1 }
            validation_ratio: { type: number, minimum: 0, maximum: 1 }
            test_ratio: { type: number, minimum: 0, maximum: 1 }
            group_by: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        leakage_policy_id: { type: [string, "null"], format: uuid }
        format: { $ref: "#/components/schemas/ExportFormat" }
        format_version: { type: string, const: ddp.lerobot/1.0.0 }
        delivery_due_at: { type: string, format: date-time }
        acceptance_method: { type: string, minLength: 1, maxLength: 500 }
        priority: { type: string, enum: [P0, P1, P2, P3] }
    TrainingDeliveryCreate:
      type: object
      required: [training_request_id, training_request_revision_id, dataset_version_id, export_job_id, recipient_id, delivery_note_no]
      additionalProperties: false
      properties:
        training_request_id: { type: string, format: uuid }
        training_request_revision_id: { type: string, format: uuid }
        dataset_version_id: { type: string, format: uuid }
        export_job_id: { type: string, format: uuid }
        recipient_id: { type: string, format: uuid }
        recipient_team: { type: [string, "null"], maxLength: 200 }
        delivery_note_no: { type: string, minLength: 1, maxLength: 64 }
    ExternalTrainingReferenceCreate:
      type: object
      required: [adapter_id, adapter_version, correlation_id]
      additionalProperties: false
      properties:
        adapter_id: { type: string, minLength: 1, maxLength: 100 }
        adapter_version: { type: string, minLength: 1, maxLength: 100 }
        correlation_id: { type: string, minLength: 1, maxLength: 128 }
        model_ref: { type: [object, "null"], additionalProperties: true }
        evaluation_ref: { type: [object, "null"], additionalProperties: true }
        config: { type: object, additionalProperties: true }
    AdapterCallbackPayload:
      type: object
      required: [event_id, adapter_id, adapter_version, external_run_id, external_status, occurred_at]
      additionalProperties: false
      properties:
        event_id: { type: string, minLength: 1, maxLength: 128 }
