openapi: 3.1.0
info:
  title: DDP Stage 4 Dataset & Training API
  version: 1.0.0-draft
  description: |
    DDP 阶段 4 数据集与训练支撑 HTTP API 草案（未冻结，`ddp.stage4/1.0.0-draft`）。
    覆盖资产目录只读视图、Dataset、DatasetVersion、DatasetItem、SelectionPreview、
    DedupPolicy、SplitPolicy、LeakagePolicy/LeakageReport、QualityReport、Manifest、
    ExportJob/产物清单、TrainingRequest/Revision、TrainingDelivery、
    ExternalTrainingReference、DatasetGrant、Adapter 回调与血缘查询。

    - 本文件是设计基线，不代表阶段 4 已实现；当前 main 无阶段 4 领域模块、路由或迁移。
    - 所有项目路由由服务端强制 project scope；不信任客户端 project_id。
    - 写动作使用 If-Match；缺失 428，失配 409；写动作支持 Idempotency-Key。
    - 错误体统一 {"error": {"code", "message", "request_id", "details?"}}。
    - 复杂响应 Schema 以同目录 JSON Schema 为准；客户端按 code 分支，未知 code 不得默认成功。
    - DDP 不建设训练集群、GPU 调度、分布式训练或模型权重托管；只保存外部引用与状态摘要。
  contact:
    name: DDP System Architect
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: asset-catalog
    description: 资产目录只读检索视图与索引新鲜度
  - name: datasets
    description: Dataset 容器、状态与归档
  - name: dataset-versions
    description: DatasetVersion 生命周期、构建、校验、冻结、复现与归档
  - name: dataset-items
    description: DatasetItem 显式版本引用与划分
  - name: dataset-policies
    description: 去重、划分与泄漏策略
  - name: dataset-reports
    description: 选择预览、质量报告、泄漏报告与 Manifest
  - name: dataset-grants
    description: 跨项目数据集显式授权
  - name: exports
    description: 异步导出 Job、产物清单与校验和
  - name: training-requests
    description: 训练需求、revision 与审批
  - name: training-deliveries
    description: 训练交付、验收与返工
  - name: training-adapters
    description: 外部训练引用、状态同步与 HMAC 回调
  - name: lineage
    description: 阶段 2/3/4 正反向血缘
paths:
  /api/v1/projects/{project_id}/asset-catalog:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAssetCatalog
      tags: [asset-catalog]
      summary: 资产目录检索（派生视图；显示 freshness_status）
      parameters:
        - name: asset_ref_type
          in: query
          schema: { $ref: "#/components/schemas/AssetRefType" }
        - name: robot_id
          in: query
          schema: { type: string, format: uuid }
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: scene
          in: query
          schema: { type: string, maxLength: 100 }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: quality_status
          in: query
          schema: { type: string, enum: [PASS, WARN, FAIL, UNKNOWN] }
        - name: annotation_status
          in: query
          schema: { type: string, enum: [NOT_STARTED, IN_PROGRESS, SUBMITTED, APPROVED, REJECTED, UNKNOWN] }
        - name: captured_from
          in: query
          schema: { type: string, format: date-time }
        - name: captured_to
          in: query
          schema: { type: string, format: date-time }
        - name: freshness_status
          in: query
          schema: { $ref: "#/components/schemas/FreshnessStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 资产目录分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetCatalogPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/asset-catalog/{asset_ref_type}/{asset_ref_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetRefTypePath"
      - $ref: "#/components/parameters/AssetRefId"
    get:
      operationId: getAssetCatalogEntry
      tags: [asset-catalog]
      summary: 资产目录详情（权威数据仍以源对象为准）
      responses:
        "200":
          description: 资产目录条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetCatalogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/datasets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listDatasets
      tags: [datasets]
      summary: Dataset 列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DatasetStatus" }
        - name: purpose
          in: query
          schema: { $ref: "#/components/schemas/DatasetPurpose" }
        - name: usage_policy
          in: query
          schema: { $ref: "#/components/schemas/DatasetUsagePolicy" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Dataset 分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createDataset
      tags: [datasets]
      summary: 创建 Dataset（DRAFT）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetCreate" }
      responses:
        "201":
          description: Dataset 已创建
          content:
            application/json:
              schema: { $ref: "./dataset.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    get:
      operationId: getDataset
      tags: [datasets]
      summary: Dataset 详情
      responses:
        "200":
          description: Dataset 详情
          content:
            application/json:
              schema: { $ref: "./dataset.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateDataset
      tags: [datasets]
      summary: 修改 Dataset 非样本字段（ARCHIVED 不可编辑）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetPatch" }
      responses:
        "200":
          description: 修改后的 Dataset
          content:
            application/json:
              schema: { $ref: "./dataset.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnDataset
      tags: [datasets]
      summary: Dataset 状态动作（archive/restore；restore 需 PO 审批并审计）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 动作后的 Dataset
          content:
            application/json:
              schema: { $ref: "./dataset.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    get:
      operationId: listDatasetVersions
      tags: [dataset-versions]
      summary: DatasetVersion 列表
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DatasetVersionStatus" }
        - name: validity_status
          in: query
          schema: { $ref: "#/components/schemas/ValidityStatus" }
        - name: leakage_status
          in: query
          schema: { $ref: "#/components/schemas/LeakageStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: DatasetVersion 分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetVersionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createDatasetVersion
      tags: [dataset-versions]
      summary: 创建 DatasetVersion 草稿（显式策略版本与选择快照）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetVersionCreate" }
      responses:
        "201":
          description: 草稿已创建
          content:
            application/json:
              schema: { $ref: "./dataset-version.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    get:
      operationId: getDatasetVersion
      tags: [dataset-versions]
      summary: DatasetVersion 详情
      responses:
        "200":
          description: 版本详情
          content:
            application/json:
              schema: { $ref: "./dataset-version.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateDatasetVersion
      tags: [dataset-versions]
      summary: 修改 DRAFT 版本（READY/FROZEN 不可原地修改）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetVersionPatch" }
      responses:
        "200":
          description: 修改后的版本
          content:
            application/json:
              schema: { $ref: "./dataset-version.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
      - $ref: "#/components/parameters/Action"
    post:
      operationId: actOnDatasetVersion
      tags: [dataset-versions]
      summary: 版本动作（build/validate/return-draft/freeze/cancel/archive/reproduce）
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: 同步动作后的版本（validate/freeze 等）
          content:
            application/json:
              schema: { $ref: "./dataset-version.v1.schema.json" }
        "202":
          description: 异步动作已受理（build/reproduce）
          content:
            application/json:
              schema: { $ref: "./dataset-version.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/items:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    get:
      operationId: listDatasetItems
      tags: [dataset-items]
      summary: DatasetItem 列表
      parameters:
        - name: split
          in: query
          schema: { $ref: "#/components/schemas/SplitName" }
        - name: sample_role
          in: query
          schema: { type: string, enum: [NORMAL, HOLDOUT, HARD_CASE, EVALUATION] }
        - name: episode_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: DatasetItem 分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getDatasetItem
      tags: [dataset-items]
      summary: DatasetItem 详情
      responses:
        "200":
          description: DatasetItem 详情
          content:
            application/json:
              schema: { $ref: "./dataset-item.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/selection-preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: previewDatasetSelection
      tags: [dataset-reports]
      summary: 选择预览（不冻结；数据不足/空测试集显式失败）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectionPreviewRequest" }
      responses:
        "200":
          description: 预览结果
          content:
            application/json:
              schema: { $ref: "./selection-preview.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/quality-report:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    get:
      operationId: getDatasetQualityReport
      tags: [dataset-reports]
      summary: 质量报告（STALE 时不得用于冻结/导出）
      responses:
        "200":
          description: 质量报告
          content:
            application/json:
              schema: { $ref: "./quality-report.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/leakage-report:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    get:
      operationId: getDatasetLeakageReport
      tags: [dataset-reports]
      summary: 泄漏报告（FAIL/UNKNOWN 阻断；WAIVED 仅在软规则且 PO 审批后）
      responses:
        "200":
          description: 泄漏报告
          content:
            application/json:
              schema: { $ref: "./leakage-report.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/manifest:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    get:
      operationId: getDatasetManifest
      tags: [dataset-reports]
      summary: Manifest（内联或短期签名 URL；服务端计算 SHA256）
      parameters:
        - name: inline
          in: query
          description: true 时内联 items；超过 1 MiB 时服务端可强制返回签名 URL
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Manifest
          content:
            application/json:
              schema: { $ref: "./manifest.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/dedup-policies:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    get:
      operationId: listDedupPolicies
      tags: [dataset-policies]
      summary: 去重策略列表
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 去重策略分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DedupPolicyPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createDedupPolicy
      tags: [dataset-policies]
      summary: 创建去重策略（近似重复默认 WARN_ONLY）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DedupPolicyCreate" }
      responses:
        "201":
          description: 去重策略已创建
          content:
            application/json:
              schema: { $ref: "./dedup-policy.v1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/projects/{project_id}/datasets/{dataset_id}/dedup-policies/{dedup_policy_id}:
    parameters:
