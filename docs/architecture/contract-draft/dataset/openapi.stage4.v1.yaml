        schema_version: { type: [integer, "null"], minimum: 1 }
        storage_ref: { type: [string, "null"], maxLength: 1024 }
        access_scope: { type: [string, "null"], maxLength: 64 }
        retention_policy: { type: [object, "null"], additionalProperties: true }
        freshness_status: { $ref: "#/components/schemas/FreshnessStatus" }
