        format: { $ref: "#/components/schemas/ExportFormat" }
        format_version: { type: string, const: ddp.lerobot/1.0.0 }
        exporter_version: { type: string, minLength: 1, maxLength: 100 }
        mapping_version: { type: string, minLength: 1, maxLength: 100 }
        config_sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        artifact_count: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0 }
        artifacts:
          type: array
          items:
            type: object
            required: [path, size_bytes, sha256, content_type]
            additionalProperties: false
            properties:
              path: { type: string, minLength: 1, maxLength: 1024 }
              size_bytes: { type: integer, minimum: 0 }
              sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              content_type: { type: string, maxLength: 200 }
              episode_refs: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
              time_range: { type: [object, "null"], additionalProperties: true }
              sidecar: { type: boolean, default: false }
        aggregate_sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        verification_status: { type: string, enum: [UNVERIFIED, VERIFIED_BY_LOADER] }
    AssetCatalogEntry:
