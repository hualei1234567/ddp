        scene_labels: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        action_labels: { type: array, items: { type: string, maxLength: 100 }, uniqueItems: true }
        annotation_status: { type: [string, "null"], maxLength: 64 }
        quality_status: { type: [string, "null"], maxLength: 64 }
        episode_version: { type: [integer, "null"], minimum: 1 }
