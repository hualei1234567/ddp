[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error",
  "ignore:.*anyio.abc.BlockingPortal.*:DeprecationWarning",
]
