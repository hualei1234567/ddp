name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 lint / 迁移 / 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ddp
          POSTGRES_PASSWORD: ddp
          POSTGRES_DB: ddp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddp -d ddp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@localhost:5432/ddp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Alembic 升级
        run: alembic upgrade head
      - name: pytest
        run: python -m pytest -q

  frontend:
    name: 前端 类型 / lint / 测试 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: 单元测试
        run: npm test
      - name: 构建
        run: npm run build

  contract:
    name: 契约 OpenAPI lint / 兼容性 diff
    runs-on: ubuntu-latest
    steps:
      - name: 检出（需完整历史以读取基线契约）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: OpenAPI lint（Redocly）
        run: |
          npx --yes @redocly/cli@1 lint \
            packages/contracts/openapi.yaml \
            --config packages/contracts/redocly.yaml
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # TODO(DDP-214 后续)：锁定 Go 与 oasdiff 版本，避免 @latest 供应链漂移。
          go-version: "stable"
      - name: 安装 oasdiff
        run: |
          go install github.com/oasdiff/oasdiff@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: 破坏性兼容性 diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash packages/contracts/scripts/check-compatibility.sh \
            packages/contracts/openapi.yaml \
            "${BASE_REF}"

  security:
    name: Secret / 依赖 / Agent 守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装检查工具
        run: pip install pytest pip-audit
      - name: Secret 扫描（阻断）
        run: python scripts/check_secrets.py
      - name: Agent Bash 守卫测试（阻断）
        run: python -m pytest scripts/tests -q
      - name: 依赖漏洞扫描（阶段 0 仅告警）
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt
