name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 手动触发：用于 billing/runner 恢复后从 UI 重跑，不必再推一个空提交。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 lint / 迁移 / 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ddp
          POSTGRES_PASSWORD: ddp
          POSTGRES_DB: ddp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddp -d ddp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DDP_DATABASE_URL: postgresql+psycopg://ddp:ddp@localhost:5432/ddp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            data-platform/requirements.txt
      - name: 安装依赖
        # data-platform 是独立依赖清单：后端测试会导入 ddp_data.parquet，
        # 其 PyArrow 依赖必须显式安装，不能靠开发机上的巧合。
        run: |
          pip install -r requirements-dev.txt
          pip install -r ../data-platform/requirements.txt
      - name: ruff
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Alembic 升级
        run: alembic upgrade head
      - name: Alembic 降级/再升级（PostgreSQL）
        run: |
          alembic downgrade 0003
          alembic upgrade head
      - name: pytest
        run: python -m pytest -q

  frontend:
    name: 前端 类型 / lint / 测试 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # 前端 job 不安装后端依赖；真实契约比对由 contract job 执行。
      DDP_SKIP_BACKEND_CONTRACT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: 单元测试
        run: npm test
      - name: 构建
        run: npm run build

  e2e:
    name: 前端关键路径 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 新增 job 的第三方 Action 固定到完整 commit SHA；不顺手改动既有 job。
      - name: 检出
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 安装 Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            data-platform/requirements.txt
      - name: 安装后端与数据平台依赖
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
          backend/.venv/bin/pip install -r data-platform/requirements.txt
      - name: 安装前端依赖与 Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E 临时数据库守卫测试
        env:
          PYTHONPATH: backend:data-platform
        run: backend/.venv/bin/python -m pytest scripts/tests/test_e2e_seed_guard.py -q
      - name: 启动固定 digest MinIO 并等待健康
        run: docker compose up -d --wait minio
      - name: 运行本地全栈 E2E
        working-directory: apps/web
        run: DDP_E2E_MINIO_PORT=9000 npm run e2e:local
      - name: 校验结构化 E2E 结果（4 passed / 0 skipped）
        if: always()
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync("e2e-results.json", "utf8"));
          const statuses = [];
          const visit = (suite) => {
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                for (const result of test.results ?? []) statuses.push(result.status);
              }
            }
            for (const child of suite.suites ?? []) visit(child);
          };
          for (const suite of report.suites ?? []) visit(suite);

          const passed = statuses.filter((status) => status === "passed").length;
          const skipped = statuses.filter((status) => status === "skipped").length;
          console.log(JSON.stringify({ passed, skipped, statuses }));
          if (passed !== 4 || skipped !== 0 || statuses.length !== 4) process.exit(1);
          NODE
      - name: 停止 E2E MinIO
        if: always()
        run: docker compose down --volumes
      - name: 上传 E2E 报告与失败诊断
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            apps/web/e2e-report/
            apps/web/test-results/
            apps/web/e2e-results.json

  contract:
    name: 契约 OpenAPI lint / 兼容性 diff
    runs-on: ubuntu-latest
    steps:
      - name: 检出（需完整历史以读取基线契约）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: 安装 Python（真实后端契约快照）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 安装后端依赖
        run: pip install -r backend/requirements-dev.txt
      - name: 安装前端依赖
        run: npm ci --prefix apps/web
      - name: 真实后端设备契约快照
        run: npm --prefix apps/web run contract:check
      - name: OpenAPI lint（Redocly）
        env:
          # DDP-214：锁定到具体版本。`@redocly/cli@1` 是主版本范围，1.x 每次
          # 发布都会漂移——lint 规则集随之变化，同一份契约可能今天绿、明天红。
          REDOCLY_VERSION: "1.34.24"
        run: |
          npx --yes "@redocly/cli@${REDOCLY_VERSION}" lint \
            packages/contracts/openapi.yaml \
            --config packages/contracts/redocly.yaml
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # DDP-214：锁定版本，不用 "stable"（会随上游漂移，同一提交在不同
          # 时间跑可能行为不同）。go1.27.4 是最新稳定版，满足 oasdiff
          # v1.38.0 声明的 go 1.26.0 / toolchain go1.27.2 要求。
          go-version: "1.27.4"
      - name: 安装 oasdiff
        env:
          # DDP-214：锁定版本。此前用 @latest——2026-11-16 的 main CI 就因此
          # 在"安装 oasdiff"这一步偶发失败（同一份代码 PR 上却是绿的），
          # 破坏性兼容性 diff 与冻结基线校验随之全部被跳过。
          # 升级时必须显式改这里，并确认 changelog 无破坏性变更。
          OASDIFF_VERSION: "v1.38.0"
        run: |
          go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: 破坏性兼容性 diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash packages/contracts/scripts/check-compatibility.sh \
            packages/contracts/openapi.yaml \
            "${BASE_REF}"
      - name: 冻结基线 SHA256 校验
        # 冻结基线一旦被改动（含同时改 bundle 与 .sha256），CI 必须失败。
        run: |
          fail=0
          for stage in 2 3 4 5 6 7; do
            file="packages/contracts/baselines/openapi.stage${stage}.v1.0.0.bundle.yaml"
            sha="packages/contracts/baselines/openapi.stage${stage}.v1.0.0.sha256"
            [ -f "$file" ] || { echo "缺少基线 $file"; fail=1; continue; }
            expected=$(cat "$sha")
            actual=$(shasum -a 256 "$file" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "基线 SHA256 不一致（stage${stage}）：expected=$expected actual=$actual"
              fail=1
            else
              echo "stage${stage} 基线校验通过"
            fi
          done
          exit $fail

  security:
    name: Secret / 依赖 / Agent 守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装检查工具
        # pytest：跑 scripts/tests 守卫用例；
        # pip-audit：依赖漏洞扫描；
        # pyyaml：scripts/tests/test_contract_parity_root_array.py 会加载
        #   scripts/check_contract_parity.py，后者 import yaml。此前该依赖
        #   在本地靠间接传递装上、CI 本 job 不装后端依赖，导致新增的这份
        #   守卫测试在 CI 上 ImportError（本地却全绿）。显式声明，不靠巧合。
        run: pip install pytest pip-audit pyyaml
      - name: Secret 扫描（阻断）
        run: python scripts/check_secrets.py
      - name: Agent Bash 守卫测试（阻断）
        run: python -m pytest scripts/tests -q
      - name: outbox 事件归类自检（阻断）
        # 投递类事件必须有消费者与测试（R-13 / T-4）。
        run: python scripts/check_outbox_events.py
      - name: 依赖漏洞扫描（阶段 0 仅告警）
        continue-on-error: true
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r data-platform/requirements.txt
