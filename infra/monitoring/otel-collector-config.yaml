# OpenTelemetry Collector 生产联调配置（供 otel/opentelemetry-collector-contrib 按需挂载）
#
# 与 DDP 后端的对齐关系（见 backend/app/core/telemetry.py 与 docs/ops/otel-tracing.md）：
#   - DDP_OTEL_ENABLED=true
#   - DDP_OTEL_EXPORTER_OTLP_PROTOCOL=grpc  → endpoint=http://otel-collector:4317
#   - DDP_OTEL_EXPORTER_OTLP_PROTOCOL=http  → endpoint=http://otel-collector:4318
#   - DDP_OTEL_SERVICE_NAME=ddp-api
#   - DDP_OTEL_SAMPLE_RATIO=0.1（生产建议先低采样观察成本）
#
# 导出说明：
#   - debug exporter：联调与排障期在 collector 日志中直接观察完整 span/metric 载荷；
#   - prometheus exporter：在 :8889/metrics 暴露接收到的 OTLP 指标，供现有 Prometheus 抓取；
#   - 若生产接入 Tempo / Jaeger，只需在 exporters 中新增 otlp/tempo 并加入 traces pipeline。

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: detailed

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: ddp_otel

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
