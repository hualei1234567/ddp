# DDP 告警规则（阶段 4 / 审计 R2）
#
# 设计原则：
# 1. 每条规则必须能回答「看到这条该做什么」——description 里写动作，不写现象复述
# 2. 必须带 for: 持续时间，避免抖动误报
# 3. 只用**已存在**的指标（见 backend/app/core/metrics.py），不发明指标名
#
# 指标前缀约定：ddp_*（业务指标由 app/core/metrics.py 暴露）

groups:
  - name: ddp-availability
    interval: 30s
    rules:
      # 抓取失败：Prometheus 自己就能检测（up 指标），无需自定义指标
      - alert: DdpApiDown
        expr: up{job="ddp-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "DDP API 抓取失败超过 2 分钟"
          description: >-
            检查 api 容器是否存活（docker ps / docker compose logs api），
            确认 /health 是否返回 200。若容器在但探针失败，先看
            docker compose logs api 里的启动校验报错（密钥缺失会直接拒绝启动）。

      # 业务指标缺席：API 在（up==1）但抓不到任何业务指标，说明指标采集
      # 代码抛异常被吞（collector 单组失败只缺席不补 0，见 metrics.py 注释）。
      # 与 DdpApiDown 区分开：那个是进程/网络问题，这个是指标采集逻辑问题。
      - alert: DdpBusinessMetricsMissing
        expr: absent(ddp_outbox_due_events{job="ddp-api"})
        for: 15m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "15 分钟内抓不到任何业务指标（采集器可能异常）"
          description: >-
            若 DdpApiDown 同时存在，先按那个处理（API 挂了自然没指标）。
            否则说明 /metrics 可达但业务指标采集失败：查 api 日志里
            BusinessMetricsCollector 的异常堆栈（采集单组失败只缺席不补 0），
            以及对应表是否可查（连接池耗尽/权限变更）。

  - name: ddp-pipeline-health
    interval: 30s
    rules:
      # outbox 积压：投递类事件卡住意味着下游（worker）停止消费
      - alert: DdpOutboxBacklog
        expr: ddp_outbox_due_events > 100
        for: 10m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "outbox 到期未投递事件积压 {{ $value }} 条"
          description: >-
            检查对应 worker 是否存活（docker compose ps | grep worker）；
            看 outbox_events 表 failed 计数是否在涨。若只有单一事件类型积压，
            查该事件的消费者是否注册（scripts/check_outbox_registry.py）。

      - alert: DdpOutboxStale
        expr: ddp_outbox_oldest_due_age_seconds > 900
        for: 5m
        labels:
          severity: critical
          component: outbox
        annotations:
          summary: "最老到期 outbox 事件已等待 {{ $value }} 秒（>15 分钟）"
          description: >-
            消费者实际已停止。先确认 worker 容器数量与日志；
            若 worker 正常但事件不消费，检查事件类型是否在投递白名单内、
            以及 outbox_events.attempts 是否已达上限（被标 FAILED 不再重试）。

      - alert: DdpHoneypotPaused
        expr: ddp_annotation_honeypot_paused > 0
        for: 0m
        labels:
          severity: warning
          component: annotation-quality
        annotations:
          summary: "有 {{ $value }} 名标注员因黄金题熔断被暂停"
          description: >-
            这通常意味着标注员理解偏差或黄金题集本身有问题。
            按 docs/ops/honeypot-appeal.md 处理：先看该标注员的窗口准确率与
            错题分布（是否集中在某一类标签），确认不是黄金题答案错误后，
            由 owner 决定 resume 还是培训。**不要批量 resume**。

      - alert: DdpBackflowBacklog
        expr: ddp_annotation_backflow_received_cases > 200
        for: 30m
        labels:
          severity: info
          component: data-flywheel
        annotations:
          summary: "回流案例积压 {{ $value }} 条未转换"
          description: >-
            数据飞轮入口在灌入但转换没跟上。按 docs/ops/backflow-intake.md
            确认是否需要配置 conversion 目标（sample_set_id + schema_id），
            或由运营批量转任务。持续积压说明评测失败率上升，需回看模型能力。
